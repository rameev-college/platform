<style>
:root{
  --paper:#efe6d2; --card:#fbf7ee; --ink:#2a2521; --muted:#6e6458; --line:#d9ccb1;
  --red:#9e2a1e; --red-soft:#f3dcd6; --ok:#2f6a3b; --ok-soft:#dcebdc; --hi:#e8d9b4;
  --serif:"PT Serif",Georgia,serif; --sans:"PT Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
body{background-image:radial-gradient(rgba(120,90,40,.06) 1px,transparent 1px);background-size:6px 6px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0 0 .4em}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.small{font-size:14px}
.sans{font-family:var(--sans)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;margin:0 0 16px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -12px rgba(60,40,10,.35)}
.folder{position:relative;border-top:6px solid var(--red)}
.tag{display:inline-block;font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;transform:rotate(-3deg)}
.btn{font-family:var(--sans);font-size:16px;font-weight:700;border:0;border-radius:4px;background:var(--ink);color:#fff;padding:12px 18px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.red{background:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select,textarea{font:inherit;font-family:var(--sans);width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
textarea{min-height:150px;font-family:var(--serif)}
label{font-family:var(--sans);font-size:14px;font-weight:700;display:block;margin:10px 0 4px}

/* расписание */
.lesson{display:flex;gap:16px;align-items:flex-start;cursor:pointer;transition:transform .1s}
.lesson:hover{transform:translateY(-1px)}
.lesson.dis{cursor:default;opacity:.6}
.lesson .time{font-family:var(--sans);font-weight:700;min-width:64px}
.lesson .time small{display:block;font-weight:400;color:var(--muted)}
.lesson .body{flex:1}
.lesson.now{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.status{font-family:var(--sans);font-size:13px;font-weight:700;padding:3px 8px;border-radius:3px;background:var(--hi);white-space:nowrap}
.status.now{background:var(--red);color:#fff}
.status.done{background:var(--ok-soft);color:var(--ok)}
.status.lock{background:#e4e0d8;color:var(--muted)}

/* шапка урока */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--sans);font-size:14px}
.steps{display:flex;gap:4px;margin:0 0 18px}
.steps i{flex:1;height:5px;background:var(--line);border-radius:3px}
.steps i.on{background:var(--ink)} .steps i.cur{background:var(--red)}
.pts{font-weight:700}
.link{background:none;border:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}

/* материалы дела */
.brief ul{padding-left:20px;margin:0 0 .8em} .brief li{margin-bottom:6px}
.quote{border-left:3px solid var(--red);padding:4px 0 4px 14px;font-style:italic;margin:10px 0}
.note{background:var(--hi);border-radius:4px;padding:12px 14px;font-size:16px}
.note b{font-family:var(--sans)}

/* задания */
.item{border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:10px;background:#fff}
.item.ok{border-color:var(--ok);background:var(--ok-soft)}
.item.bad{border-color:var(--red);background:var(--red-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--sans);font-size:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:20px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.chip:disabled{cursor:default}
.why{font-size:15px;margin-top:8px;display:none}
.checked .why{display:block}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}

/* допрос */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:6px;font-size:16px}
.msg .who{font-family:var(--sans);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px;color:var(--muted)}
.msg.r{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end}
.msg.me .who{color:#cfc6b8}
.msg.p{background:var(--hi);align-self:flex-start;font-style:italic}
.meter{font-family:var(--sans);font-size:13px;margin-bottom:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--red);transition:width .5s}

/* порядок */
.ord{display:flex;align-items:center;gap:10px}
.ord .n{font-family:var(--sans);font-weight:700;min-width:22px}
.ord .t{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:2px}
.ord .mv button{border:1px solid var(--line);background:var(--card);border-radius:3px;width:34px;height:26px;cursor:pointer;font-size:13px}

.fill{margin-bottom:14px}
.fill select{display:block;width:100%;max-width:100%;margin:6px 0;padding:8px 10px}
.res td{padding:6px 8px;border-bottom:1px solid var(--line)} .res td:last-child{text-align:right;font-family:var(--sans);font-weight:700}
.res{width:100%;border-collapse:collapse;margin:8px 0 14px}
.big{font-size:44px;font-weight:700;font-family:var(--sans);line-height:1}
.codebox{font-family:Consolas,Menlo,monospace;font-size:13px;background:#fff;border:1px dashed var(--line);padding:10px;border-radius:4px;word-break:break-word}
/* фирменный стиль колледжа: главная страница кабинета */
body.brand{--paper:#F4F5F7;--card:#fff;--ink:#222;--muted:#5f636b;--line:#e2e4e9;--hi:#EFFE74;--serif:"Manrope",system-ui,sans-serif;--sans:"Manrope",system-ui,sans-serif;background-image:none}
body.brand h1,body.brand h2,body.brand h3{font-weight:800;letter-spacing:-.01em}
body.brand .card{border-radius:18px;box-shadow:none}
body.brand .folder{background:#7199F1;border:0}
body.brand .folder .muted,body.brand .folder .link{color:#222;opacity:.75}
body.brand .tag{color:#222;background:#EFFE74;padding:3px 10px;border-radius:20px;letter-spacing:.03em;font-size:11px}
body.brand .folder .tag{background:#fff}
body.brand .btn{border-radius:12px;background:#222}
body.brand input[type=text],body.brand select{border-radius:12px;border-color:#fff}
body.brand .lesson.now{border-color:#7199F1;box-shadow:0 0 0 2px #7199F1}
body.brand .status{background:#F4F5F7;border-radius:20px;padding:4px 10px}
body.brand .status.now{background:#EFFE74;color:#222}
body.brand .status.done{background:#dfe8fc;color:#222}
body.brand .lesson.dis{opacity:.55}
.mini{border-collapse:collapse;font-family:var(--sans);font-size:14px;margin:4px 0}
.mini td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.mini td:first-child{font-weight:700;background:#f4f5f7}
.item svg{max-width:100%}
body.brand .steps i.cur{background:#7199F1}
body.brand .btn.red{background:#222}
body.brand .btn.ghost{background:transparent;color:#222;border:1.5px solid #222}
body.brand .stamp{border-color:#222;color:#222;transform:none;border-radius:20px;background:#fff}
body.brand .item,body.brand .opt{border-radius:12px}
body.brand .note{border-radius:12px}
.refcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0 14px}
.refcard .rf{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:15px}
.refcard .rf:last-child{border-bottom:0}
.refcard .rf span{color:var(--muted);min-width:110px}
.refcard .rf b{text-align:right;font-weight:600}
.refcard .rf.hid b{color:#b8bcc4;font-weight:400}
.refcard .avatar{width:56px;height:56px;border-radius:50%;background:#EFFE74;display:flex;align-items:center;justify-content:center;font:800 26px var(--sans);margin-bottom:8px}
.refcard .item{margin:8px 0}
.tt{border-collapse:collapse;font-family:var(--sans);margin:8px 0 12px}
.tt th,.tt td{border:1px solid var(--line);padding:6px 12px;text-align:center;background:#fff}
.tt th{background:#f4f5f7;white-space:nowrap}
.grid th,.grid td{padding:4px 6px}
.grid .cell{width:34px}
.tt tr.ok td{background:var(--ok-soft)} .tt tr.bad td{background:var(--red-soft)}
.tt small{color:var(--red);font-weight:700}
.bit,.cell{font:700 16px var(--sans);width:40px;height:34px;border:1.5px solid #222;border-radius:8px;background:#fff;cursor:pointer;color:#222}
.bit.one,.cell.on{background:#EFFE74}
.cell.ok{background:var(--ok-soft);border-color:var(--ok)} .cell.bad{background:var(--red-soft);border-color:var(--red)}
.pickrow{cursor:pointer} .pickrow.sel td{background:#dfe8fc}
.tt .mk{min-width:28px;font-weight:700}
.meas{cursor:pointer} .meas.sel{border-color:#3b67d6;box-shadow:0 0 0 2px #3b67d6}
.budget{padding:6px 0;margin-bottom:10px}
@media (max-width:520px){h1{font-size:25px}.card{padding:16px}.lesson{flex-direction:column;gap:6px}}
</style>
</head>

<script>
/* ===================== СОДЕРЖАНИЕ УРОКОВ ===================== */
const LESSONS = {};
const BRAND_UI = { introStamp: "Практика", start: "Начать", brief: "Теория", doneStamp: "Готово", submit: "Сдать" };
const caseCard = (rows) => `<div class="refcard">${rows.map(([k,v])=>`<div class="rf"><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;
const LIGHTS = [{id:"g",label:"Зелёный"},{id:"y",label:"Жёлтый"},{id:"r",label:"Красный"}];

/* ============ 1. Основы ИБ ============ */
LESSONS.ib7 = {
  title: "Аудитор на один день", theme: "brand", ui: BRAND_UI,
  intro: `<p>Небольшая онлайн-школа программирования наняла тебя как специалиста по информационной безопасности. Директор говорит: «Защитите нам всё и по максимуму».</p>
<p>Твоя задача — объяснить, почему так не бывает, разобраться, какая информация у школы есть и что с ней может случиться, и собрать разумный план защиты в пределах бюджета.</p>
<p class="muted small sans">Перед каждым заданием есть короткая теория. Каждый этап засчитывается с первой попытки, после проверки ты увидишь разбор. В конце результат сам отправится преподавателю.</p>`,
  stages: [
  { name: "Не по максимуму", min: 5,
    brief: `<ul>
<li>Защита стоит денег, времени и удобства. Чем она строже, тем сложнее людям работать.</li>
<li>Поэтому в ИБ действует <b>принцип разумной достаточности</b>: затраты на защиту не должны превышать возможный ущерб, а защита не должна мешать нормальной работе.</li>
<li>Если «закрыть» информацию так, что ею невозможно пользоваться, пострадает одно из её главных свойств — доступность.</li>
</ul>`,
    parts: [
    { type: "mc", q: "Школа ввела правило: каждое открытие любого файла — только по отпечатку пальца и с письменного разрешения директора. Что пострадало?",
      opts: ["Конфиденциальность: данные стали менее защищены","Доступность: сотрудники не могут нормально работать","Ничего: защиты много не бывает"], c: 1,
      w: "Информация должна быть доступна тем, кому она нужна для работы. Чрезмерная защита ломает доступность." },
    { type: "mc", q: "Защита одной таблицы стоит 2 млн ₽ в год, а максимальный ущерб от её утечки оценили в 200 тыс. ₽. Как разумно поступить?",
      opts: ["Купить защиту за 2 млн: безопасность важнее денег","Вообще не защищать таблицу","Подобрать меры, соразмерные возможному ущербу"], c: 2,
      w: "Тратить на защиту в десять раз больше возможного ущерба бессмысленно. Но и оставлять данные без защиты тоже нельзя." }
    ]
  },
  { name: "Паспорт информации", min: 8,
    brief: `<p>Прежде чем защищать информацию, нужно понять её параметры: <b>содержание</b> (что это за данные), <b>важность</b> (насколько они нужны организации) и какое свойство для них критичнее всего:</p>
<ul>
<li><b>Конфиденциальность</b> — информацию видят только те, кому разрешено. Нарушение — утечка.</li>
<li><b>Целостность</b> — информация точная и не изменена без разрешения. Нарушение — подмена или порча.</li>
<li><b>Доступность</b> — информация доступна, когда она нужна. Нарушение — сбой, недоступность.</li>
</ul>`,
    parts: [
    { type: "classify", title: "Что критичнее всего?",
      prompt: "Для каждого вида данных школы выбери свойство, нарушение которого навредит сильнее всего.",
      bins: [{id:"c",label:"Конфиденциальность"},{id:"i",label:"Целостность"},{id:"a",label:"Доступность"}],
      items: [
        {t:"База учеников с паспортными данными родителей", b:"c", w:"Это персональные данные: главное — чтобы они не утекли."},
        {t:"Пароль администратора платформы", b:"c", w:"Если пароль узнают посторонние, они получат доступ ко всему."},
        {t:"Оценки в электронном журнале", b:"i", w:"Секрета в оценках нет, а вот их подмена — серьёзная проблема."},
        {t:"Цены на курсы на публичном сайте", b:"i", w:"Цены и так видят все, но если их подменят, школа потеряет деньги и доверие."},
        {t:"Видеоплатформа для уроков во время занятий", b:"a", w:"Если она не работает, занятия срываются."},
        {t:"Расписание онлайн-занятий в учебный день", b:"a", w:"Расписание не секрет, но оно должно быть доступно ученикам вовремя."}
      ]}
    ]
  },
  { name: "Масштаб последствий", min: 5,
    brief: `<p>Ещё один параметр — <b>масштаб последствий</b>: сколько людей пострадает, какие будут денежные и юридические потери, удар по репутации, можно ли всё быстро исправить.</p>`,
    parts: [
    { type: "order", title: "От самого тяжёлого к самому лёгкому",
      prompt: "Расставь инциденты по масштабу последствий для школы: сверху самый тяжёлый.",
      items: [
        "Паспортные данные тысяч учеников и родителей утекли в интернет",
        "Платформа уроков не работала весь учебный день, все занятия сорваны",
        "Одному преподавателю подменили расписание на неделю, ошибку быстро заметили и исправили",
        "Сайт школы был недоступен 5 минут ночью"
      ]}
    ]
  },
  { name: "Четыре подхода", min: 7,
    brief: `<p>Меры защиты выбирают по-разному. Есть четыре основных подхода:</p>
<ul>
<li><b>Нормативный</b> — меры определяются требованиями законов и стандартов (например, 152-ФЗ о персональных данных, документы ФСТЭК). Защищаем так, как обязывает закон.</li>
<li><b>Базовый</b> — применяется стандартный минимальный набор мер, одинаковый для всех похожих организаций, без детального анализа: антивирус, пароли, резервные копии.</li>
<li><b>Риск-ориентированный</b> — оцениваются угрозы, их вероятность и возможный ущерб. Больше всего ресурсов идёт на самые опасные риски.</li>
<li><b>Объектно-ориентированный</b> — меры подбирают под особенности конкретного объекта защиты: какая информация, где она хранится, как устроена система, кто с ней работает.</li>
</ul>`,
    parts: [
    { type: "classify", title: "Какой подход?",
      prompt: "Определи, какой подход к выбору мер использует каждая организация.",
      bins: [{id:"n",label:"Нормативный"},{id:"b",label:"Базовый"},{id:"r",label:"Риск-ориентированный"},{id:"o",label:"Объектно-ориентированный"}],

/* ===================== ДВИЖОК ===================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const KEY = "cab_" + CONFIG.GROUPS.join("_");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(KEY + k)) } catch(e) { return null } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)) } catch(e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };

/* время: берём с сервера, если не вышло — с устройства */
let clockShift = 0;
async function syncClock(){
  try {
    const r = await fetch(location.href.split("#")[0], {method:"HEAD", cache:"no-store"});
    const d = r.headers.get("Date");
    if (d) clockShift = new Date(d).getTime() - Date.now();
  } catch(e) {}
}
const now = () => Date.now() + clockShift;
function mskTime(hm){ // момент начала по Москве (UTC+3)
  if (!hm) return null;
  const [y,m,d] = CONFIG.DATE.split("-").map(Number); const [h,mi] = hm.split(":").map(Number);
  return Date.UTC(y, m-1, d, h-3, mi);
}
const localHM = t => new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

function partMax(p){
  if (p.variants) p = {...p, ...Object.values(p.variants)[0]};
  if (p.type === "reveal") return p.items.length * 3;
  if (p.type === "truth") return 1 << p.vars.length;
  if (p.type === "dnf") return 2;
  if (p.type === "grid") return p.rows.length * p.cols.length;
  if (p.type === "budget") return p.risks.length + p.bonus;
  if (p.type === "audit") return p.rows.length + p.rows.filter(r => r.err).length;
  if (p.type === "classify" || p.type === "order" || p.type === "fill") return p.items.length;
  if (p.type === "dialog") return p.rounds.length * 3;
  if (p.type === "mc") return 1;
  return 0;
}
const stageMax = s => s.parts.reduce((a,p) => a + partMax(p), 0);
const lessonMax = L => L.stages.reduce((a,s) => a + stageMax(s), 0);

function hash(str){ let h = 2166136261; for (const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) } return (h >>> 0).toString(36).toUpperCase().padStart(6,"0").slice(-6) }

/* ---------- главная ---------- */
function home(){
  document.body.className = "brand"; document.documentElement.style.background = "#F4F5F7";
  const prof = load("profile");
  let html = `<div class="card folder">
    <span class="tag">${esc(CONFIG.SUBTITLE)}</span>
    <h1>${esc(CONFIG.TITLE).replace(/(\d)-(\d)/g,"$1\u2011$2")}</h1>
    <p class="muted sans small">Расписание на ${new Date(CONFIG.DATE+"T12:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"})} · время московское</p>`;
  if (!prof){
    html += `<label for="nm">Фамилия и имя — как на платформе</label>
      <input type="text" id="nm" placeholder="Иванов Иван" autocomplete="name">
      <label for="gr">Группа</label>
      <select id="gr"><option value="">Выбери группу</option>${CONFIG.GROUPS.map(g=>`<option>${g}</option>`).join("")}</select>
      <p style="margin-top:14px"><button class="btn" id="go" disabled>Войти в кабинет</button></p></div>`;
    app.innerHTML = html;
    const chk = () => $("#go").disabled = !($("#nm").value.trim().split(/\s+/).length >= 2 && $("#gr").value);
    $("#nm").oninput = chk; $("#gr").onchange = chk;
    $("#go").onclick = () => { save("profile", {name: $("#nm").value.trim().replace(/\s+/g," "), group: $("#gr").value}); home(); };
    return;
  }
  html += `<div class="row sans small"><span><b>${esc(prof.name)}</b> · группа ${esc(prof.group)}</span>
    <button class="link" id="chg">это не я</button></div></div>`;
  const t = now();
  SCHEDULE.forEach(s => {
    const st = mskTime(s.start), en = mskTime(s.end);
    const done = load("res_" + s.id);
    let status = "", cls = "", open = !s.soon;
    if (s.soon){ status = `<span class="status lock">готовится</span>`; }
    else if (done){ status = `<span class="status done">сдано</span>`; }
    else if (CONFIG.TIME_LOCK && st && t < st){ open = false; cls = "dis"; status = `<span class="status lock">откроется в ${s.start}</span>`; }
    else if (st && en && t >= st && t <= en){ cls = "now"; status = `<span class="status now">идёт сейчас</span>`; }
    else { status = `<span class="status">открыт</span>`; }
    if (!open) cls = "dis";
    const localNote = st && localHM(st) !== s.start ? `<small>у тебя ${localHM(st)}</small>` : "";
    html += `<div class="card lesson ${cls}" data-id="${s.id}" data-open="${open?1:0}">
      <div class="time">${s.start || "—"}${s.end ? "–"+s.end : ""}${localNote}</div>
      <div class="body"><span class="tag">${esc(s.subject)}</span><h3>${esc(s.title)}</h3>${s.note?`<p class="muted small" style="margin:0">${esc(s.note)}</p>`:""}</div>
      <div>${status}</div></div>`;
  });
  if (CONFIG.TEST_MODE) html += `<p style="text-align:center"><button class="link sans small" id="rst">Сбросить прогресс (режим проверки)</button></p>`;
  app.innerHTML = html;
  if ($("#rst")) $("#rst").onclick = resetAll;
  $("#chg").onclick = () => { if (confirmBox()) { try{ localStorage.removeItem(KEY+"profile") }catch(e){} home(); } };
  document.querySelectorAll(".lesson").forEach(el => el.onclick = () => { if (el.dataset.open === "1") openLesson(el.dataset.id) });
}
function confirmBox(){ return true }

/* ---------- урок ---------- */
let L, LID, S;
function openLesson(id){
  LID = id; L = LESSONS[id];
  document.body.className = L.theme || ""; document.documentElement.style.background = L.theme === "brand" ? "#F4F5F7" : "";
  S = load("ls_" + id) || {stage: -1, scores: [], answer: ""};
  const res = load("res_" + id);
  if (res) return results();
  if (S.stage < 0) return intro();
  stageBrief();
}
const DEF_UI = { introStamp: "Дело", start: "Открыть дело", brief: "Материалы дела", doneStamp: "Дело закрыто", submit: "Сдать дело" };
const ui = k => (L.ui && L.ui[k]) || DEF_UI[k];
function persist(){ save("ls_" + LID, S) }
function total(){ return S.scores.reduce((a,b)=>a+(b||0),0) }
function header(){
  const steps = L.stages.map((_,i)=>`<i class="${i < S.stage ? "on" : i === S.stage ? "cur" : ""}"></i>`).join("");
  return `<div class="top"><button class="link" id="back">← В кабинет</button><span class="pts">${total()} баллов</span></div><div class="steps">${steps}</div>`;
}
function bindBack(){ $("#back").onclick = () => { LID = null; home(); } }
function intro(){
  app.innerHTML = `<div class="top"><button class="link" id="back">← В кабинет</button></div>
  <div class="card folder"><span class="stamp">${ui("introStamp")}</span><h1 style="margin-top:12px">${esc(L.title)}</h1>${L.intro}
  <p class="sans small"><b>Этапы:</b> ${L.stages.map((s,i)=>`${i+1}. ${s.name} (${s.min} мин)`).join(" · ")}</p>
  <button class="btn red" id="start">${ui("start")}</button></div>`;
  bindBack();
  $("#start").onclick = () => { S.stage = 0; persist(); stageBrief(); };
}
function stageBrief(){
  if (S.stage >= L.stages.length) return finish();
  const st = L.stages[S.stage];
  app.innerHTML = header() + `<div class="card ${L.theme === "brand" ? "" : "folder"} brief"><span class="tag">${ui("brief")} · часть ${S.stage+1} из ${L.stages.length} · ≈${st.min} мин</span><h2>${esc(st.name)}</h2>${st.brief}
  <button class="btn" id="go">К заданию →</button></div>`;
  bindBack(); scrollTo(0,0);
  let pts = 0, pi = 0;
  $("#go").onclick = () => nextPart();
  function nextPart(){
    if (pi >= st.parts.length){ S.scores[S.stage] = pts; S.stage++; persist(); return stageBrief(); }
    let p = st.parts[pi++];
    if (p.variants) p = {...p, ...p.variants[(S.choice || {})[p.choiceKey]]};
    app.innerHTML = header() + `<div class="card" id="pc"></div>`;
    bindBack(); scrollTo(0,0);
    RENDER[p.type](p, $("#pc"), got => { pts += got; nextPart(); });
  }
}

/* ---------- типы заданий ---------- */
const RENDER = {
classify(p, el, done){
  const items = shuffle(p.items.map((x,i)=>({...x,i})));
  const pick = {};
  el.innerHTML = `<span class="tag">Задание</span><h2>${p.title}</h2><p>${p.prompt}</p>
   ${items.map(x=>`<div class="item" data-i="${x.i}"><div>${x.t}</div><div class="chips">${p.bins.map(b=>`<button class="chip" data-b="${b.id}">${b.label}</button>`).join("")}</div><div class="why"></div></div>`).join("")}
   <div id="aft"></div><button class="btn" id="ck" disabled>Проверить</button>`;
  el.querySelectorAll(".item").forEach(it => it.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    pick[it.dataset.i] = c.dataset.b;
    it.querySelectorAll(".chip").forEach(z => z.classList.toggle("on", z === c));
    $("#ck").disabled = Object.keys(pick).length < p.items.length;
  }));
  $("#ck").onclick = () => {
    let got = 0; el.classList.add("checked");
    el.querySelectorAll(".item").forEach(it => {
      const x = p.items[it.dataset.i], ok = pick[it.dataset.i] === x.b;
      if (ok) got++;
      it.classList.add(ok ? "ok" : "bad");
      it.querySelectorAll(".chip").forEach(z => z.disabled = true);
      it.querySelector(".why").innerHTML = (ok ? "<b>Верно.</b> " : `<b>Правильно: ${p.bins.find(b=>b.id===x.b).label}.</b> `) + x.w;
    });
    $("#aft").innerHTML = `<p class="sans"><b>${got} из ${p.items.length}</b></p>` + (p.after || "");
    const b = $("#ck"); b.textContent = "Дальше →"; b.onclick = () => done(got);
  };
},
mc(p, el, done){

order(p, el, done){

    el.innerHTML = `<span class="tag">Задание</span><h2>${p.title}</h2><p>${p.prompt}</p>
    ${cur.map((v,k)=>`<div class="item ord ${checked ? (v===k?"ok":"bad") : ""}"><span class="n">${k+1}</span><span class="t">${p.items[v]}</span>${checked?"":`<span class="mv"><button data-k="${k}" data-d="-1" aria-label="выше">↑</button><button data-k="${k}" data-d="1" aria-label="ниже">↓</button></span>`}</div>`).join("")}
    <div id="w"></div><button class="btn" id="ck">${checked ? "Дальше →" : "Проверить"}</button>`;
    el.querySelectorAll(".mv button").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, j = k + +b.dataset.d; if (j < 0 || j >= cur.length) return;

    const got = cur.filter((v,k)=>v===k).length;

explore(p, el, done){
  const modes = [
    {k:"sin", f:Math.sin, lead:"Двигай ползунок. Точка вала поворачивается, а справа рисуется её <b>высота</b> — это синус угла. Прокрути полный оборот, до 360°."},
    {k:"cos", f:Math.cos, lead:"Теперь справа рисуется <b>сдвиг точки по горизонтали</b> — это косинус угла. Снова прокрути полный оборот."}
  ];
  let m = 0, a = 0, maxA = 0;
  const gcd = (x,y) => y ? gcd(y, x % y) : x;
  const radStr = d => { if (!d) return "0"; const g = gcd(d,180), n = d/g, q = 180/g; return (n === 1 ? "" : n) + "π" + (q === 1 ? "" : "/" + q) };
  el.innerHTML = `<span class="tag">Интерактив</span><h2>${p.title}</h2><p id="lead"></p><div id="fig"></div>
    <input type="range" id="ang" min="0" max="360" step="15" value="0" style="width:100%;accent-color:#3b67d6" aria-label="Угол поворота">
    <p class="sans" id="rd"></p><button class="btn" id="nx" disabled>Прокрути до 360°</button>`;
  const draw = () => {
    const M = modes[m], r = 80, cx = 105, cy = 115, g0 = 235, g1 = 620, sx = (g1 - g0) / 360;
    const rad = a * Math.PI / 180, px = cx + r * Math.cos(rad), py = cy - r * Math.sin(rad);
    let path = ""; for (let d = 0; d <= maxA; d += 3) path += (d ? "L" : "M") + (g0 + d*sx).toFixed(1) + " " + (cy - r*M.f(d*Math.PI/180)).toFixed(1);
    const gx = g0 + a*sx, gy = cy - r*M.f(rad);
    let s = `<svg viewBox="0 0 640 245" style="width:100%;height:auto;display:block;background:#fff;border:1px solid #e2e4e9;border-radius:12px">`;
    s += `<line x1="15" x2="195" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${cx}" x2="${cx}" y1="25" y2="205" stroke="#9aa0aa"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#c9ced8" stroke-width="2"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#222" stroke-width="1.5"/>`;
    if (m === 0) s += `<line x1="${px}" y1="${cy}" x2="${px}" y2="${py}" stroke="#3b67d6" stroke-width="5" stroke-linecap="round"/><line x1="${px}" y1="${py}" x2="${gx}" y2="${gy}" stroke="#3b67d6" stroke-dasharray="4 4"/>`;
    else s += `<line x1="${cx}" y1="${py}" x2="${px}" y2="${py}" stroke="#3b67d6" stroke-width="5" stroke-linecap="round"/>`;
    s += `<circle cx="${px}" cy="${py}" r="6" fill="#222"/>`;
    s += `<line x1="${g0}" x2="${g1}" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${g0}" x2="${g0}" y1="25" y2="205" stroke="#9aa0aa"/>`;
    [[cy-r,"1"],[cy+r,"−1"]].forEach(([y,l]) => s += `<line x1="${g0}" x2="${g1}" y1="${y}" y2="${y}" stroke="#eceef2"/><text x="${g0-6}" y="${y+4}" font-size="12" text-anchor="end" fill="#5f636b" font-family="sans-serif">${l}</text>`);
    [90,180,270,360].forEach(d => s += `<line x1="${g0+d*sx}" x2="${g0+d*sx}" y1="25" y2="205" stroke="#eceef2"/><text x="${g0+d*sx}" y="222" font-size="11" text-anchor="middle" fill="#5f636b" font-family="sans-serif">${d}°</text><text x="${g0+d*sx}" y="237" font-size="11" text-anchor="middle" fill="#5f636b" font-family="sans-serif">${radStr(d)}</text>`);
    s += `<path d="${path}" fill="none" stroke="#3b67d6" stroke-width="3"/><circle cx="${gx}" cy="${gy}" r="5" fill="#3b67d6"/></svg>`;
    $("#fig").innerHTML = s;
    let v = M.f(rad); if (Math.abs(v) < 0.005) v = 0;
    $("#rd").innerHTML = `Угол <b>${a}° = ${radStr(a)}</b> · ${M.k} = <b>${v.toFixed(2).replace("-","−")}</b>`;
    $("#lead").innerHTML = M.lead;
  };
  $("#ang").oninput = e => {
    a = +e.target.value; maxA = Math.max(maxA, a); draw();
    if (maxA >= 360){ const b = $("#nx"); b.disabled = false; b.textContent = m === 0 ? "Теперь косинус →" : "Дальше →"; }
  };
  $("#nx").onclick = () => {
    if (m === 0){ m = 1; a = 0; maxA = 0; $("#ang").value = 0; $("#nx").disabled = true; $("#nx").textContent = "Прокрути до 360°"; draw(); scrollTo(0,0); }
    else done(0);
  };
  draw();
},

reveal(p, el, done){

      ${answered ? "" : (open < it.clues.length ? `<p><button class="btn ghost" id="more">Открыть подсказку (сейчас за ответ ${Math.max(1,4-open)} б.)</button></p>` : "")}

      ${it.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}<div id="w"></div>`;

      el.querySelectorAll(".opt").forEach(b => b.onclick = () => {

        draw();
        el.querySelectorAll(".opt").forEach(z => { z.disabled = true; if (+z.dataset.i === it.c) z.classList.add("ok"); else if (z.dataset.i === b.dataset.i) z.classList.add("bad") });

dnf(p, el, done){

      if (on.has(i)) m.classList.add(x.covers.length ? "ok" : "bad");
      m.querySelector(".why").innerHTML = (on.has(i) ? "<b>Выбрано.</b> " : "") + x.w; });
    $("#w").innerHTML = `<div class="note"><b>Риски школы:</b><ul style="margin:6px 0 0;padding-left:20px">${p.risks.map(r=>`<li>${cov.has(r.id) ? "✅" : "❌"} ${r.t}</li>`).join("")}</ul>
      <p style="margin:8px 0 0">Закрыто рисков: <b>${cov.size} из ${p.risks.length}</b>. ${waste.length ? "Часть бюджета ушла на меры, которые не закрывают ни одного риска школы." : `Ни одной лишней траты: +${p.bonus}.`}</p></div><p></p>`;
    const b = $("#ck"); b.disabled = false; b.textContent = `${got} из ${partMax(p)} · Дальше →`; b.onclick = () => done(got);
  };
},
text(p, el, done){
  el.innerHTML = `<span class="tag">Ответ</span><h2>${p.title}</h2><p>${p.prompt}</p>
  <textarea id="tx" placeholder="${p.ph || ""}">${esc(S.draft || "")}</textarea>
  <p class="sans small muted" id="cnt"></p><button class="btn red" id="ck">${ui("submit")}</button>`;
  const upd = () => { const n = $("#tx").value.trim().length; $("#cnt").textContent = n < p.min ? `Ещё хотя бы ${p.min - n} символов` : "Готово к сдаче"; $("#ck").disabled = n < p.min; S.draft = $("#tx").value; persist(); };
  $("#tx").oninput = upd; upd();
  $("#ck").onclick = () => { const pre = p.choiceKey ? (S.choice || {})[p.choiceKey] + ": " : ""; S.answer = pre + $("#tx").value.trim(); done(0); };
}
};

/* ---------- финал и отправка ---------- */
function finish(){
  const prof = load("profile") || {};
  const max = lessonMax(L), score = total();
  const details = L.stages.map((s,i)=>`${s.name}: ${S.scores[i]||0}/${stageMax(s)}`).join("; ") + (S.choice ? "; выбор: " + Object.values(S.choice).join(", ") : "");
  const code = hash([prof.name, prof.group, LID, score].join("|") + "|dost");
  const res = { name: prof.name, group: prof.group, lesson: SCHEDULE.find(s=>s.id===LID)?.subject + " · " + L.title,
    score, max, percent: Math.round(score / max * 100), answer: S.answer, details, code, sent: false };
  save("res_" + LID, res);
  results(true);
}
async function sendRes(res){
  const F = CONFIG.FORM; if (!F.action) return "none";
  const body = new URLSearchParams();
  for (const k in F.fields) if (F.fields[k]) body.append(F.fields[k], String(res[k] ?? ""));
  try { await fetch(F.action, {method:"POST", mode:"no-cors", body}); return "ok" } catch(e) { return "fail" }
}
async function results(fresh){
  const res = load("res_" + LID);
  const line = `${res.name}, гр. ${res.group}. ${res.lesson}. Баллы: ${res.score} из ${res.max}. Код: ${res.code}`;
  app.innerHTML = `<div class="top"><button class="link" id="back">← В кабинет</button></div>
  <div class="card folder"><span class="stamp">${ui("doneStamp")}</span>
  <h1 style="margin-top:12px">${esc(res.name)}, спасибо за работу</h1>
  <div class="row" style="align-items:flex-end;margin:10px 0 6px"><span class="big">${res.score}</span><span class="sans muted">из ${res.max} баллов</span></div>
  <table class="res">${L.stages.map((s,i)=>`<tr><td>${i+1}. ${s.name}</td><td>${stageMax(s) ? (S.scores[i] ?? "—") + " / " + stageMax(s) : "сдан"}</td></tr>`).join("")}</table>
  <div id="snd" class="note sans small">Отправляем результат…</div></div>`;
  bindBack(); scrollTo(0,0);
  let st = res.sent ? "ok" : await sendRes(res);
  if (st === "ok" && !res.sent){ res.sent = true; save("res_" + LID, res); }
  const backup = `<p style="margin:10px 0 6px">Скопируй строку ниже и отправь преподавателю в чат группы:</p><div class="codebox">${esc(line)}</div><p style="margin-top:8px"><button class="btn ghost" id="cp">Скопировать</button></p>`;
  $("#snd").innerHTML = st === "ok"
    ? `<b>Результат отправлен преподавателю.</b> Ничего пересылать не нужно.`
    : st === "fail"
      ? `<b>Не получилось отправить: проверь интернет.</b> <button class="link" id="rt">Попробовать ещё раз</button>${backup}`
      : `<b>Автоотправка пока не подключена.</b>${backup}`;
  if ($("#rt")) $("#rt").onclick = () => results();
  if ($("#cp")) $("#cp").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(line); $("#cp").textContent = "Скопировано"; };
}

function resetAll(){ try { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)) } catch(e) {} home(); }
if (location.search.includes("reset")) { try { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)) } catch(e) {} }
if (location.search.includes("testsend")) {
  sendRes({name:"Тест Проверка", group:"тест", lesson:"Проверка связи · " + CONFIG.TITLE, score:0, max:0, percent:0, answer:"—", details:"тестовая запись, можно удалить", code:"TEST"})
    .then(st => { app.innerHTML = `<div class="card"><h2>${st === "ok" ? "Тестовая запись отправлена" : "Не удалось отправить"}</h2><p>${st === "ok" ? "Открой таблицу результатов: там должна появиться строка «Тест Проверка». Если её нет через минуту, напиши мне." : "Проверь интернет и попробуй ещё раз."}</p></div>`; });
} else {
home();
}
syncClock().then(() => { if (document.querySelector(".lesson")) home() });
setInterval(() => { if (!LID && document.querySelector(".lesson")) home() }, 60000);
</script>
