<style>

LESSONS.net11 = {
  title: "Путь одного запроса", theme: "brand", ui: BRAND_UI,
  intro: `<p>Ты открываешь сайт в браузере. За доли секунды компьютер определяет адрес сервера, находит его в сети, устанавливает соединение и получает данные. За этой простой операцией стоят несколько уровней сетевой модели и разные типы адресов.</p>
<p>На занятии ты разберёшь стек TCP/IP, сопоставишь его с OSI, научишься различать IP, MAC и доменное имя, повторишь IPv4 и маски подсети, а затем восстановишь путь запроса к сайту.</p>
<p class="muted small sans">В заданиях встречаются реальные сетевые сценарии. Смотри, на каком уровне возникает проблема и какой протокол или адрес нужен именно в этой ситуации.</p>`,

  { name: "Четыре уровня TCP/IP и модель OSI", min: 8,

<p><b>Запомни:</b> TCP/IP — практический стек протоколов; OSI — эталонная модель для описания функций. Соответствие уровней приблизительное, а не полное совпадение.</p>`,

  { name: "IP, TCP, UDP и прикладные протоколы", min: 9,
    brief: `<p><b>IP</b> доставляет пакеты между сетями, но сам по себе не гарантирует доставку и порядок. За надёжную передачу потока данных может отвечать <b>TCP</b>: устанавливает соединение, подтверждает получение и повторно передаёт потерянные сегменты. <b>UDP</b> отправляет датаграммы без установления соединения и не гарантирует доставку или порядок — это полезно там, где важна скорость и допустима потеря отдельных пакетов.</p>
<p>Прикладные протоколы задают правила общения программ:</p>
<ul>
<li><b>HTTP</b> — передача веб-страниц и данных; защищённый вариант — HTTPS.</li>
<li><b>FTP</b> — передача файлов.</li>
<li><b>Telnet</b> — удалённый текстовый доступ без шифрования; для безопасного администрирования обычно используют SSH.</li>
<li><b>SMTP</b> — отправка электронной почты.</li>
<li><b>POP3</b> — получение почты с сервера, обычно загрузка сообщений клиенту.</li>
</ul>`,

  { name: "MAC, IP и доменное имя", min: 9,
    brief: `<p>У устройства в сети могут одновременно использоваться разные адреса. Они отвечают на разные вопросы:</p>

<li><b>MAC-адрес</b> — адрес сетевого интерфейса для доставки кадров в пределах канального сегмента. Обычно записывается шестью парами шестнадцатеричных символов, например <code>3C:52:82:1A:7B:90</code>.</li>
<li><b>IP-адрес</b> — логический адрес узла для обмена между сетями и маршрутизации, например <code>192.168.1.25</code>.</li>
<li><b>Доменное имя</b> — удобное для человека имя, например <code>example.com</code>; DNS помогает найти соответствующий IP-адрес.</li>
</ul>
<p>MAC не заменяет IP: кадр доставляется в пределах локального канала, а IP-пакет может пройти через несколько маршрутизаторов. Доменное имя, в свою очередь, не является физическим адресом устройства.</p>`,

  { name: "IPv4, маска и частные диапазоны", min: 10,
    brief: `<p><b>IPv4</b> — адрес длиной 32 бита. Его записывают как четыре октета, разделённые точками; каждый октет содержит 8 бит и принимает значение от 0 до 255.</p>
<ul>
<li><b>Маска подсети</b> отделяет сетевую часть адреса от узловой.</li>
<li><b>CIDR</b> записывает длину сетевой части после косой черты: <code>/24</code> означает 24 сетевых бита и 8 бит узла.</li>

<li>Частные диапазоны IPv4: <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Они используются внутри частных сетей и сами по себе не маршрутизируются в публичном интернете.</li>

/* ============ 10 ноября · Математический аппарат ============ */
const IMP = r => (r[0] === 1 && r[1] === 0) ? 0 : 1;
const XOR = r => r[0] ^ r[1];
const ONE = r => 1;
LESSONS.bool11 = {
  title: "Проверка системы функций", theme: "brand", ui: BRAND_UI,
  intro: `<p>Сегодня проверяем не абстрактную формулу, а небольшую систему булевых функций. Нужно выяснить, какие свойства есть у каждой функции и позволяет ли вся система выразить любую булеву функцию.</p>
  <p>На занятии также разбирали примеры <b>f = (x∧y)∨z</b> и <b>g = x⊕y⊕z</b>: первая функция монотонна, но нелинейна; вторая линейна и самодвойственна, но немонотонна.</p>
  <p><b>Исследуем:</b> f₁ = x → y, f₂ = x ⊕ y, f₃ = 1.</p>
  <p class="muted small sans">Работай с таблицами и отметками. В конце примени критерий Поста и обоснуй вывод выбором функций, которые не входят в каждый из пяти классов.</p>`,
  stages: [
    { name: "Таблицы истинности", min: 10,
      brief: `<p>Для двух переменных есть четыре набора: 00, 01, 10, 11.</p><ul>
      <li><b>Импликация</b> x → y равна 0 только в случае x = 1, y = 0. Во всех остальных случаях равна 1.</li>
      <li><b>Исключающее ИЛИ</b> x ⊕ y равно 1, когда значения различаются.</li>
      <li><b>Константа 1</b> не зависит от аргументов и всегда возвращает 1.</li></ul>
      <p>Заполни каждую таблицу самостоятельно, нажимая на ячейки результата.</p>`,
      parts: [
        { type:"truth", title:"f₁ = x → y", vars:["x","y"], f:IMP, prompt:"Построй таблицу истинности импликации. Вспомни единственный набор, на котором она ложна.", after:`<div class="note">f₁: 00 → 1, 01 → 1, 10 → 0, 11 → 1.</div>` },
        { type:"truth", title:"f₂ = x ⊕ y", vars:["x","y"], f:XOR, prompt:"Построй таблицу исключающего ИЛИ. Единица получается, если аргументы различаются.", after:`<div class="note">f₂: 00 → 0, 01 → 1, 10 → 1, 11 → 0.</div>` },
        { type:"truth", title:"f₃ = 1", vars:["x","y"], f:ONE, prompt:"Построй таблицу константы. Проверь все четыре набора.", after:`<div class="note">У константы 1 все значения равны единице.</div>` }
      ]
    },
    { name: "СДНФ и СКНФ для f₁", min: 11,
      brief:`<ul><li><b>СДНФ</b> собирается по строкам, где функция равна 1. Для каждой такой строки строится конъюнкция всех переменных: ноль — с отрицанием, единица — без.</li>
      <li><b>СКНФ</b> собирается по строкам, где функция равна 0. Для каждой строки строится дизъюнкция всех переменных: единица — с отрицанием, ноль — без.</li></ul>
      <p>Для f₁ импликация ложна только на наборе 10. Поэтому СКНФ будет состоять из одной скобки.</p>`,
      parts:[
        {type:"dnf",mode:"sdnf",title:"Собери СДНФ для f₁",vars:["x","y"],f:IMP,prompt:"Выбери все строки таблицы, на которых f₁ = 1. Из них автоматически соберётся СДНФ.",why:"Нужны строки 00, 01 и 11: (¬x∧¬y) ∨ (¬x∧y) ∨ (x∧y)."},
        {type:"dnf",mode:"sknf",title:"Собери СКНФ для f₁",vars:["x","y"],f:IMP,prompt:"Теперь выбери строки, где f₁ = 0.",why:"Только строка 10. Для неё макстерм (¬x∨y), значит СКНФ: (¬x∨y)."}
      ]
    },
    { name:"Классы Поста: матрица 3×5", min: 12,
      brief:`<p>Проверь каждую функцию по пяти классам:</p><ul>
      <li><b>T0</b> — сохраняет 0: f(0,…,0)=0.</li><li><b>T1</b> — сохраняет 1: f(1,…,1)=1.</li>
      <li><b>S</b> — самодвойственная: на противоположных наборах значения противоположны.</li><li><b>L</b> — линейная: в полиноме Жегалкина нет произведений переменных.</li>
      <li><b>M</b> — монотонная: увеличение аргумента с 0 до 1 не может уменьшить значение функции.</li></ul>
      <p>Нажми на клетку, если считаешь, что функция входит в указанный класс.</p>`,
      parts:[{type:"grid",title:"Классы функций",cols:["T0","T1","S","L","M"],prompt:"Отметь все классы, которым принадлежит каждая функция.",rows:[
        {name:"f₁ = x → y",vals:[false,true,false,false,false]},
        {name:"f₂ = x ⊕ y",vals:[true,false,false,true,false]},
        {name:"f₃ = 1",vals:[false,true,false,true,true]}
      ],after:`<div class="note"><b>Проверка:</b> f₁ не сохраняет 0, не самодвойственна, нелинейна и немонотонна; f₂ принадлежит T0 и L; константа 1 принадлежит T1, L и M.</div>`}]
    },
    { name:"Критерий Поста и полнота", min:12,
      brief:`<p><b>Критерий Поста:</b> система булевых функций полна тогда и только тогда, когда она не содержится целиком ни в одном из пяти классов T0, T1, S, L, M.</p>
      <p>Практически это значит: для каждого класса нужно найти хотя бы одну функцию системы, которая в него <b>не входит</b>. Если хотя бы для одного класса все функции входят в него, система неполна.</p>`,
      parts:[
        {type:"classify",title:"Найди функцию вне каждого класса",prompt:"Для каждого класса выбери функцию из системы, которая в него НЕ входит. Одну и ту же функцию можно использовать несколько раз.",bins:[{id:"f1",label:"f₁"},{id:"f2",label:"f₂"},{id:"f3",label:"f₃"}],items:[
          {t:"Вне T0",b:"f1",w:"f₁(0,0)=1, поэтому f₁ не сохраняет 0."},
          {t:"Вне T1",b:"f2",w:"f₂(1,1)=0, поэтому f₂ не сохраняет 1."},
          {t:"Вне S",b:"f1",w:"f₁ не самодвойственна: f₁(0,0)=1 и f₁(1,1)=1, а значения должны быть противоположными."},
          {t:"Вне L",b:"f1",w:"Полином Жегалкина f₁ содержит произведение xy."},
          {t:"Вне M",b:"f2",w:"При переходе (0,1) → (1,1) значение f₂ меняется с 1 на 0."}
        ]},
        {type:"mc",q:"Какой вывод следует из матрицы и критерия Поста для системы {f₁, f₂, f₃}?",opts:["Система полна: для каждого класса найдена функция, которая в него не входит","Система неполна: константа 1 делает любую систему неполной","Нельзя сделать вывод без построения полиномов для всех трёх функций"],c:0,w:"Система не содержится ни в одном из пяти классов: f₁ выводит систему из T0, S, L и M; f₂ — из T1. Следовательно, по критерию Поста система полна."}
      ]
    }
  ]
};

      {type:"dialog",title:"Разговор с финансовым консультантом",lead:"Ты помогаешь герою выбрать действия. После каждого решения консультант показывает последствия.",otherName:"Консультант",youName:"Ты",meterLabel:"Качество решений",finale:`<div class="note">Финансовая устойчивость строится не на запрете любых покупок, а на планировании, приоритетах и запасе на непредвиденные события.</div>`,rounds:[
        {who:"a",line:"Ноутбук сломался, ремонт стоит 8 000 ₽. На отдельном накопительном счёте есть 20 000 ₽. Что разумнее?",opts:[{t:"Оплатить ремонт из резерва, затем запланировать его пополнение",p:3,r:"Да. Это как раз непредвиденный необходимый расход.",n:"После ремонта в резерве осталось 12 000 ₽. В следующем месяце можно начать его восстанавливать."},{t:"Оформить микрозайм, а накопления не трогать ни при каких условиях",p:0,r:"Так можно получить переплату и дополнительные обязательства.",n:"После ремонта в резерве осталось 12 000 ₽. В следующем месяце можно начать его восстанавливать."},{t:"Потратить все накопления на новый дорогой ноутбук, не сравнивая варианты",p:0,r:"Сначала оцени необходимость и стоимость ремонта, а не трать весь запас автоматически.",n:"После ремонта в резерве осталось 12 000 ₽. В следующем месяце можно начать его восстанавливать."}]},
        {who:"a",line:"В следующем месяце доход снизился на 10%. Как действовать?",opts:[{t:"Пересмотреть переменные расходы, сохранить обязательные платежи и временно сократить необязательные покупки",p:3,r:"Верно: бюджет адаптируется к изменившемуся доходу.",n:"Теперь сравним кредит и вклад."},{t:"Сохранить прежние траты и закрыть разницу новым кредитом",p:0,r:"Кредит не должен автоматически закрывать регулярный дефицит бюджета.",n:"Теперь сравним кредит и вклад."},{t:"Перестать учитывать расходы — всё равно доход уже изменился",p:0,r:"Именно в нестабильный период учёт особенно полезен.",n:"Теперь сравним кредит и вклад."}]},
        {who:"a",line:"Что важно сравнить перед оформлением кредита?",opts:[{t:"Полную сумму возврата, ставку, срок, комиссии и последствия просрочки",p:3,r:"Да. Смотри не только на размер ежемесячного платежа, но и на полную стоимость кредита.",n:"И последнее: как оценить вклад на фоне инфляции?"},{t:"Только рекламируемый размер ежемесячного платежа",p:0,r:"Небольшой платёж может означать очень долгий срок и большую переплату.",n:"И последнее: как оценить вклад на фоне инфляции?"},{t:"Только цвет банковской карты и название тарифа",p:0,r:"Это не финансовые параметры договора.",n:"И последнее: как оценить вклад на фоне инфляции?"}]},
        {who:"a",line:"Вклад обещает 10% годовых, а инфляция за год составила 8%. Какой вывод точнее для упрощённого примера?",opts:[{t:"Номинальный доход есть, но реальный прирост покупательной способности будет примерно около 2%, а не 10%",p:3,r:"Верно. Для точного расчёта учитывают сложный процент и фактическую инфляцию.",n:"Тренажёр завершён: бюджет, резерв и понимание условий помогают принимать более взвешенные решения."},{t:"Деньги точно стали на 10% ценнее",p:0,r:"Проценты по вкладу нужно сопоставлять с ростом цен.",n:"Тренажёр завершён: бюджет, резерв и понимание условий помогают принимать более взвешенные решения."},{t:"Инфляция означает, что вклад полностью обесценился",p:0,r:"Если ставка выше инфляции, покупательная способность в упрощённом сравнении может вырасти.",n:"Тренажёр завершён: бюджет, резерв и понимание условий помогают принимать более взвешенные решения."}]}
      ]}
    ]},
    {name:"Финансовые термины",min:12,brief:`<p>Запомни разницу:</p><ul><li><b>Инфляция</b> — общий рост цен и снижение покупательной способности денег.</li><li><b>Кредит</b> — деньги, полученные на условиях возврата и оплаты процентов/иных предусмотренных договором платежей.</li><li><b>Вклад</b> — деньги, размещённые в банке на согласованных условиях; банк начисляет проценты.</li><li><b>Переплата</b> — сумма сверх полученной суммы кредита, которую заёмщик платит по договору.</li><li><b>Ликвидность</b> — насколько быстро актив можно превратить в деньги без существенной потери стоимости.</li></ul>`,parts:[
      {type:"classify",title:"Соедини термин и смысл",prompt:"Распредели определения по финансовым понятиям.",bins:[{id:"i",label:"Инфляция"},{id:"c",label:"Кредит"},{id:"d",label:"Вклад"},{id:"l",label:"Ликвидность"}],items:[
        {t:"Общий рост цен, из-за которого на ту же сумму можно купить меньше",b:"i",w:"Это инфляция."},{t:"Деньги, которые банк предоставляет с обязанностью вернуть их по договору",b:"c",w:"Это кредит."},{t:"Деньги, размещённые в банке для хранения и получения процентов",b:"d",w:"Это вклад."},{t:"Возможность быстро получить деньги от продажи актива без большой потери стоимости",b:"l",w:"Это ликвидность."}
      ]},
      {type:"mc",q:"Почему нельзя сравнивать два кредита только по ежемесячному платежу?",opts:["Потому что важны также срок, ставка, комиссии и полная сумма возврата","Потому что размер платежа вообще не имеет значения","Потому что у всех кредитов одинаковая стоимость"],c:0,w:"Нужно оценивать полную стоимость и условия договора, а не одну цифру."},
      {type:"num",title:"Посчитай переплату",prompt:"По договору человек получил 40 000 ₽. Общая сумма всех платежей по кредиту — 46 800 ₽. Сколько составит переплата?",items:[{a:"Переплата по кредиту",unit:"₽",ans:6800,show:"6 800 ₽",w:"46 800 − 40 000 = 6 800 ₽. Переплата — это сумма сверх полученной суммы кредита."}]}
    ]}
  ]
};

/* ============ 10 ноября · Информационная безопасность ============ */
LESSONS.ib8 = {
  title:"ServiceDesk Lite",theme:"brand",ui:BRAND_UI,
  intro:`<p>Ты работаешь на первой линии ServiceDesk небольшой IT-компании. Поступили три заявки: нужно защитить базу клиентов, журнал заявок и портал поддержки.</p>
  <p>Твоя задача — для каждого объекта определить требование, понять, что именно нарушено, подобрать одну-две подходящие меры и указать, как проверить результат.</p>
  <p class="muted small sans">Главная цепочка занятия: <b>объект → требование → проблема → мера → проверка</b>.</p>`,
  stages:[
    {name:"Объекты и требования",min:8,brief:`<p>Требование защиты зависит от того, что именно защищаем.</p><ul><li><b>Конфиденциальность</b> — доступ только у тех, кому он разрешён.</li><li><b>Целостность</b> — данные нельзя незаметно и неправомерно изменить.</li><li><b>Доступность</b> — система и информация доступны тогда, когда нужны.</li></ul>
    <p>В ServiceDesk Lite три объекта: база клиентов, журнал заявок и портал поддержки.</p>`,parts:[
      {type:"classify",title:"Назначь главное требование",prompt:"Для каждого объекта выбери свойство, которое в описанном сценарии важнее всего защитить.",bins:[{id:"c",label:"Конфиденциальность"},{id:"i",label:"Целостность"},{id:"a",label:"Доступность"}],items:[
        {t:"База клиентов: контакты, договоры и история обращений",b:"c",w:"Эти данные не должны попадать к посторонним."},{t:"Журнал заявок: статусы, исполнители и сроки",b:"i",w:"Важно, чтобы заявки и их статусы не подменяли без разрешения."},{t:"Портал поддержки: сотрудники создают и отслеживают заявки в течение рабочего дня",b:"a",w:"Сервис должен работать, иначе обращения не принимаются."}
      ]}
    ]},
    {name:"Определи нарушение",min:8,brief:`<p>Один объект может столкнуться с разными угрозами, но в каждой заявке есть конкретный симптом. Не путай сам объект с тем, что произошло.</p>`,parts:[
      {type:"classify",title:"Разбери три заявки",prompt:"Распредели инциденты по объекту, которому они непосредственно угрожают.",bins:[{id:"db",label:"База клиентов"},{id:"log",label:"Журнал заявок"},{id:"portal",label:"Портал поддержки"}],items:[
        {t:"Сотрудник отправил файл с контактами клиентов в общий чат, доступный внешним подрядчикам",b:"db",w:"Риск утечки конфиденциальной информации из базы клиентов."},{t:"Пользователь с обычной ролью изменил статус чужой заявки и удалил комментарий",b:"log",w:"Нарушена целостность журнала: изменения сделаны без нужных полномочий."},{t:"Портал перестал отвечать во время рабочего дня после резкого потока запросов",b:"portal",w:"Нарушена доступность сервиса."}
      ]},
      {type:"mc",q:"Что является корректной постановкой проблемы для ServiceDesk?",opts:["«Нужно купить самый дорогой антивирус»","«Обычный пользователь может менять чужие заявки; требуется ограничить изменение и фиксировать действия»","«Нужно сделать безопасность максимальной»"],c:1,w:"Проблема описывает объект, наблюдаемое нарушение и то, какое свойство оказалось под угрозой. Покупка конкретного средства — уже возможная мера."}
    ]},
    {name:"Выбери тип меры",min:8,brief:`<p>Меры защиты бывают четырёх типов:</p><ul><li><b>Правовые</b> — договоры, правила обработки данных, локальные политики, ответственность.</li><li><b>Организационные</b> — регламенты, обучение, назначение ответственных, порядок выдачи и отзыва доступа.</li><li><b>Технические</b> — физическая защита оборудования, контроль доступа в помещения, резервирование каналов и питания.</li><li><b>Программные</b> — роли и права в системе, MFA, шифрование, антивирус, журналирование, резервное копирование средствами ПО.</li></ul>`,parts:[
      {type:"classify",title:"Разложи меры защиты",prompt:"Определи, к какому типу относится каждая мера.",bins:[{id:"law",label:"Правовая"},{id:"org",label:"Организационная"},{id:"tech",label:"Техническая"},{id:"soft",label:"Программная"}],items:[
        {t:"Утвердить политику обработки и хранения клиентских данных",b:"law",w:"Локальный нормативный документ."},{t:"Назначить владельца базы и утвердить порядок согласования доступа",b:"org",w:"Это распределение ответственности и процедура."},{t:"Установить резервный источник питания для сервера",b:"tech",w:"Физическая инженерная мера."},{t:"Включить ролевую модель доступа и MFA",b:"soft",w:"Настройки реализуются средствами программной системы."},{t:"Проводить инструктаж сотрудников по работе с клиентскими данными",b:"org",w:"Обучение и регламент поведения."},{t:"Включить шифрование резервных копий",b:"soft",w:"Шифрование реализуется программными средствами."}
      ]}
    ]},
    {name:"Пять принципов защиты",min:7,brief:`<p>Хорошая система защиты опирается на пять принципов:</p><ul><li><b>Комплексность</b> — сочетать разные меры, а не надеяться на одну.</li><li><b>Соответствие ситуации</b> — учитывать конкретный объект, угрозу и возможный ущерб.</li><li><b>Минимальные права</b> — выдавать только те полномочия, которые нужны для работы.</li><li><b>Многоуровневость</b> — несколько рубежей защиты; отказ одного не должен сразу открывать всё.</li><li><b>Постоянный контроль</b> — следить за событиями, проверять настройки и пересматривать меры.</li></ul>`,parts:[
      {type:"classify",title:"Какой принцип применён?",prompt:"Соедини действия с принципами защиты.",bins:[{id:"c",label:"Комплексность"},{id:"s",label:"Соответствие ситуации"},{id:"m",label:"Минимальные права"},{id:"l",label:"Многоуровневость"},{id:"k",label:"Постоянный контроль"}],items:[
        {t:"Для базы клиентов одновременно настроили роли, MFA, обучение и аудит",b:"c",w:"Используется сочетание разных мер."},{t:"Для публичного сайта и внутренней базы выбрали разные наборы мер с учётом рисков",b:"s",w:"Меры подбираются под конкретную ситуацию."},{t:"Стажёр может смотреть только те заявки, которые назначены ему",b:"m",w:"Полномочия ограничены рабочей необходимостью."},{t:"Вход защищён паролем и MFA, а действия дополнительно записываются в журнал",b:"l",w:"Несколько рубежей защиты."},{t:"Администратор еженедельно проверяет журналы входов и пересматривает права",b:"k",w:"Настройки и события регулярно контролируются."}
      ]}
    ]},
    {name:"ServiceDesk: решение заявок",min:14,brief:`<p>Финальная смена. Для каждой заявки пройди всю цепочку: сначала требование, затем нарушение, затем подходящий комплект из одной-двух мер и способ проверки.</p><p>Не выбирай универсальную меру для всех случаев: одна и та же технология не решает любую проблему.</p>`,parts:[
      {type:"dialog",title:"Три заявки ServiceDesk Lite",lead:"Ты — специалист поддержки. Выбирай обоснованное решение. За каждый этап заявки можно получить до 3 баллов.",otherName:"Заявитель",youName:"Специалист",meterLabel:"Качество решений",finale:`<div class="note"><b>Закрытие смены.</b> В каждом решении должны быть связаны объект, требование, конкретное нарушение, подходящие меры и проверяемый результат. Наличие меры само по себе ещё не доказывает, что проблема решена.</div>`,rounds:[
        {who:"a",line:"Заявка 1/3. База клиентов содержит телефоны и договоры. Какое требование здесь ключевое?",opts:[{t:"Конфиденциальность: доступ к данным только у уполномоченных сотрудников",p:3,r:"Верно. Теперь выясним нарушение.",n:""},{t:"Доступность: база должна открываться быстрее всех остальных приложений",p:0,r:"Скорость может быть важна, но в этой заявке речь о защите клиентских данных.",n:""},{t:"Целостность: все сотрудники должны иметь возможность редактировать записи",p:0,r:"Свободное редактирование как раз создаёт риск.",n:""}]},
        {who:"a",line:"Файл с контактами отправили в общий чат подрядчиков. Что именно нарушено?",opts:[{t:"Избыточный доступ: данные стали доступны лицам, которым они не нужны для работы",p:3,r:"Точно. Подбираем меры.",n:""},{t:"Недоступность: файл невозможно открыть",p:0,r:"Файл доступен, проблема в том, кому он доступен.",n:""},{t:"Сбой оборудования: сервер перегрелся",p:0,r:"В описании нет аппаратного сбоя.",n:""}]},
        {who:"a",line:"Какой комплект мер подходит лучше?",opts:[{t:"Ролевой доступ и MFA для базы; регламент передачи данных и инструктаж сотрудников",p:3,r:"Хорошо: программные ограничения подкреплены организационными правилами.",n:"Проверка: тестовая учётная запись без прав не открывает базу; журнал фиксирует попытки доступа."},{t:"Установить новый монитор и заменить клавиатуры",p:0,r:"Эти меры не ограничивают доступ к клиентским данным.",n:"Проверка: тестовая учётная запись без прав не открывает базу; журнал фиксирует попытки доступа."},{t:"Поставить антивирус и считать заявку закрытой",p:0,r:"Антивирус не предотвращает отправку разрешённым пользователем файла в общий чат.",n:"Проверка: тестовая учётная запись без прав не открывает базу; журнал фиксирует попытки доступа."}]},
        {who:"a",line:"Заявка 2/3. В журнале заявок обычный пользователь изменил чужую запись. Какое требование нарушено?",opts:[{t:"Целостность: менять записи могут только уполномоченные роли, а изменения должны отслеживаться",p:3,r:"Верно. Теперь мера и проверка.",n:""},{t:"Конфиденциальность: портал должен быть скрыт от всех сотрудников",p:0,r:"Сотрудникам нужен доступ к своим заявкам.",n:""},{t:"Доступность: нужно увеличить скорость интернета",p:0,r:"Проблема не в скорости доступа."}]},
        {who:"a",line:"Какое решение лучше для журнала заявок?",opts:[{t:"Разграничить права редактирования по ролям и включить неизменяемый журнал действий/историю изменений",p:3,r:"Подходит: ограничиваем изменение и можем расследовать действия.",n:"Проверка: пользователь не может изменить чужую заявку; тестовое изменение фиксируется в истории."},{t:"Всем выдать роль администратора, чтобы не было ошибок доступа",p:0,r:"Это увеличит риск случайной или намеренной подмены.",n:"Проверка: пользователь не может изменить чужую заявку; тестовое изменение фиксируется в истории."},{t:"Поставить фильтр спама на почту",p:0,r:"Мера не связана с изменением записей в журнале.",n:"Проверка: пользователь не может изменить чужую заявку; тестовое изменение фиксируется в истории."}]},
        {who:"a",line:"Заявка 3/3. Портал поддержки перестал отвечать во время рабочего дня после резкого роста запросов. Какое требование главное?",opts:[{t:"Доступность: сервис должен принимать и показывать заявки в рабочее время",p:3,r:"Да. Выбираем меры для устойчивости сервиса.",n:""},{t:"Конфиденциальность: никто не должен входить на портал",p:0,r:"Полный запрет доступа уничтожит назначение портала.",n:""},{t:"Целостность: нужно изменить все заявки вручную",p:0,r:"Симптом связан с недоступностью сервиса."}]},

/* ============ 11 ноября · Математический аппарат: отношения и отображения ============ */
const mapFig = (A, B, pairs) => {
  const n = Math.max(A.length, B.length), H = 30 + n * 34;
  const ya = i => 24 + i * 34 + (n - A.length) * 17, yb = j => 24 + j * 34 + (n - B.length) * 17;
  return `<svg viewBox="0 0 260 ${H}" style="width:100%;max-width:260px;display:block;margin:6px 0">
  <defs><marker id="mfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b67d6"/></marker></defs>
  <ellipse cx="50" cy="${H/2}" rx="34" ry="${H/2-4}" fill="#f4f6fa" stroke="#9aa0aa"/><ellipse cx="210" cy="${H/2}" rx="34" ry="${H/2-4}" fill="#f4f6fa" stroke="#9aa0aa"/>
  <text x="50" y="12" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5f636b">A</text><text x="210" y="12" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5f636b">B</text>
  ${pairs.map(([i,j]) => `<line x1="62" y1="${ya(i)}" x2="196" y2="${yb(j)}" stroke="#3b67d6" stroke-width="2" marker-end="url(#mfa)"/>`).join("")}
  ${A.map((a,i) => `<circle cx="50" cy="${ya(i)}" r="4" fill="#222"/><text x="40" y="${ya(i)+4}" text-anchor="end" font-size="12" font-family="sans-serif">${a}</text>`).join("")}
  ${B.map((b,j) => `<circle cx="210" cy="${yb(j)}" r="4" fill="#222"/><text x="220" y="${yb(j)+4}" font-size="12" font-family="sans-serif">${b}</text>`).join("")}
  </svg>`;
};
const DIV = [1,2,3,4].map(x => [1,2,3,4].map(y => y % x === 0));
const PERM = (name, row) => `<table class="tt" style="display:inline-table;margin:4px 14px 4px 0"><tr><th rowspan="2">${name}</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr>${row.map(v=>`<td><b>${v}</b></td>`).join("")}</tr></table>`;
const SIGTAU = PERM("σ", [2,4,1,3]) + PERM("τ", [2,1,4,3]);

  { name: "Отображения", min: 10,
    brief: `<p><b>Отображение</b> (функция) f: A → B ставит каждому элементу A <b>ровно один</b> элемент B. Если у какого-то элемента A нет стрелки или их две — это не отображение.</p>

<p>Число биекций n-элементного множества на n-элементное — n!. Число инъекций из k-элементного в n-элементное — n · (n − 1) · … · (n − k + 1).</p>`,
    parts: [

LESSONS.ptr13 = {
  title: "Кто на что указывает", theme: "brand", ui: BRAND_UI,
  intro: `<p>На лекции вы разобрали указатели и ссылки. Теперь — практика: ты будешь «исполнять» код в голове, как отладчик, и отвечать, что окажется в памяти.</p>
<p>Большинство ошибок с указателями и ссылками возникает не из-за незнания синтаксиса, а потому что человек не видит, <b>какое имя на какой объект указывает</b>. Сегодня это и тренируем: Python, указатели в C, сборщик мусора и связный список.</p>
<p class="muted small sans">Перед каждым заданием есть короткая теория. Каждый этап засчитывается с первой попытки, после проверки ты увидишь разбор. В конце результат сам отправится преподавателю.</p>`,
  stages: [
  { name: "Имя и объект", min: 8,
    brief: `<ul>
<li>В Python переменная — это <b>имя, привязанное к объекту</b>. <code>b = a</code> не копирует объект, а создаёт второе имя для того же объекта.</li>
<li><code>a is b</code> — это один и тот же объект? <code>a == b</code> — у объектов одинаковые значения?</li>
<li><b>Изменяемые</b> объекты (list, dict, set) можно поменять «на месте»: <code>append</code>, <code>a[0] = …</code>. Это видно через все имена.</li>
<li><b>Неизменяемые</b> (int, str, tuple) поменять нельзя: <code>x += 1</code> создаёт новый объект и перепривязывает имя.</li>
<li><code>a[:]</code> и <code>list(a)</code> создают <b>новый</b> список (поверхностную копию).</li>

const $ = s => document.querySelector(s);
const app = $("#app");
const KEY = "cab_" + CONFIG.GROUPS.join("_");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(KEY + k)) } catch(e) { return null } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)) } catch(e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };

/* время: берём с сервера, если не вышло — с устройства */
let clockShift = 0;
async function syncClock(){
  try {
    const r = await fetch(location.href.split("#")[0], {method:"HEAD", cache:"no-store"});
    const d = r.headers.get("Date");
    if (d) clockShift = new Date(d).getTime() - Date.now();
  } catch(e) {}
}
const now = () => Date.now() + clockShift;
function mskTime(hm, date){ // момент по Москве (UTC+3)
  if (!hm) return null;
  const [y,m,d] = (date || CONFIG.DATE).split("-").map(Number); const [h,mi] = hm.split(":").map(Number);
  return Date.UTC(y, m-1, d, h-3, mi);
}
const localHM = t => new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

function partMax(p){
  if (p.variants) p = {...p, ...Object.values(p.variants)[0]};
  if (p.type === "reveal") return p.items.length * 3;
  if (p.type === "truth") return 1 << p.vars.length;
  if (p.type === "dnf") return 2;
  if (p.type === "venn") return 3;
  if (p.type === "arc") return 1;
  if (p.type === "venn3") return p.count !== undefined ? 2 : 1;
  if (p.type === "num") return p.items.length;
  if (p.type === "proofread") return (p.text.match(/\[\[/g) || []).length;
  if (p.type === "pivot") return p.qs.length;
  if (p.type === "grid") return p.rows.length * p.cols.length;
  if (p.type === "budget") return p.risks.length + p.bonus;
  if (p.type === "audit") return p.rows.length + p.rows.filter(r => r.err).length;
  if (p.type === "classify" || p.type === "drag" || p.type === "order" || p.type === "dragorder" || p.type === "fill") return p.items.length;
  if (p.type === "hotspot") return 2;
  if (p.type === "dialog") return p.rounds.length * 3;
  if (p.type === "str") return p.items.length;
  if (p.type === "atom") return p.targets.length;
  if (p.type === "huffman") return p.items.length - 1;
  if (p.type === "scene") return p.rounds.length * 3;
  if (p.type === "drag" || p.type === "dragorder") return p.items.length;
  if (p.type === "hotspot") return 2;
  if (p.type === "mc") return 1;
  return 0;
}
const stageMax = s => s.parts.reduce((a,p) => a + partMax(p), 0);
const lessonMax = L => L.stages.reduce((a,s) => a + stageMax(s), 0);

function hash(str){ let h = 2166136261; for (const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) } return (h >>> 0).toString(36).toUpperCase().padStart(6,"0").slice(-6) }

/* ---------- главная ---------- */
const OPEN_DAYS = new Set();
function home(){
  document.body.className = "brand"; document.documentElement.style.background = "#F4F5F7";
  const prof = load("profile");
  let html = `<div class="card folder">
    <span class="tag">${esc(CONFIG.SUBTITLE)}</span>
    <h1>${esc(CONFIG.TITLE).replace(/(\d)-(\d)/g,"$1\u2011$2")}</h1>
    <p class="muted sans small">Расписание занятий · время московское</p>`;
  if (!prof){
    html += `<label for="nm">Фамилия и имя — как на платформе</label>
      <input type="text" id="nm" placeholder="Иванов Иван" autocomplete="name">
      <label for="gr">Группа</label>
      <select id="gr"><option value="">Выбери группу</option>${CONFIG.GROUPS.map(g=>`<option>${g}</option>`).join("")}</select>
      <p style="margin-top:14px"><button class="btn" id="go" disabled>Войти в кабинет</button></p></div>`;
    app.innerHTML = html;
    const chk = () => $("#go").disabled = !($("#nm").value.trim().split(/\s+/).length >= 2 && $("#gr").value);
    $("#nm").oninput = chk; $("#gr").onchange = chk;
    $("#go").onclick = () => { save("profile", {name: $("#nm").value.trim().replace(/\s+/g," "), group: $("#gr").value}); home(); };
    return;
  }
  html += `<div class="row sans small"><span><b>${esc(prof.name)}</b> · группа ${esc(prof.group)}</span>
    <button class="link" id="chg">это не я</button></div></div>`;
  const t = now();
  const today = new Date(t + 3*3600e3).toISOString().slice(0,10);
  const dateOf = s => s.date || CONFIG.DATE;
  const dates = [...new Set(SCHEDULE.map(dateOf))];
  const upcoming = dates.filter(d => d >= today).sort();
  const past = dates.filter(d => d < today).sort().reverse();
  const dname = d => new Date(d+"T12:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"long"});
  const card = (s, d) => {
    const st = mskTime(s.start, d), en = mskTime(s.end, d);
    const done = load("res_" + s.id);
    let status = "", cls = "", open = !s.soon;
    if (s.soon){ status = `<span class="status lock">готовится</span>`; }
    else if (done){ status = `<span class="status done">сдано</span>`; }
    else if (CONFIG.TIME_LOCK && st && t < st){ open = false; cls = "dis"; status = `<span class="status lock">откроется в ${s.start}</span>`; }
    else if (st && en && t >= st && t <= en){ cls = "now"; status = `<span class="status now">идёт сейчас</span>`; }
    else { status = `<span class="status">открыт</span>`; }
    if (!open) cls = "dis";
    const localNote = st && localHM(st) !== s.start ? `<small>у тебя ${localHM(st)}</small>` : "";
    return `<div class="card lesson ${cls}" data-id="${s.id}" data-open="${open?1:0}">
      <div class="time">${s.start || "—"}${s.end ? "–"+s.end : ""}${localNote}</div>
      <div class="body"><span class="tag">${esc(s.subject)}</span><h3>${esc(s.title)}</h3>${s.note?`<p class="muted small" style="margin:0">${esc(s.note)}</p>`:""}</div>
      <div>${status}</div></div>`;
  };
  const dayLessons = d => SCHEDULE.filter(s => dateOf(s) === d);
  upcoming.forEach(d => {
    html += `<h3 class="dayhead">${d === today ? "Сегодня, " : ""}${dname(d)}</h3>`;
    dayLessons(d).forEach(s => html += card(s, d));
  });
  if (past.length){
    html += `<h3 class="dayhead">Прошлые занятия</h3>`;
    past.forEach(d => {
      const ls = dayLessons(d), doneN = ls.filter(s => load("res_" + s.id)).length;
      html += `<details class="past" data-d="${d}" ${OPEN_DAYS.has(d) ? "open" : ""}><summary><span class="pd"><i>▸</i>${dname(d)}</span><span class="pcount ${doneN === ls.length ? "all" : ""}">сдано ${doneN} из ${ls.length}</span></summary><div class="pbody">${ls.map(s => card(s, d)).join("")}</div></details>`;
    });
  }
  if (CONFIG.TEST_MODE) html += `<p style="text-align:center"><button class="link sans small" id="rst">Сбросить прогресс (режим проверки)</button></p>`;
  app.innerHTML = html;
  if ($("#rst")) $("#rst").onclick = resetAll;
  $("#chg").onclick = () => { if (confirmBox()) { try{ localStorage.removeItem(KEY+"profile") }catch(e){} home(); } };
  document.querySelectorAll("details.past").forEach(x => x.ontoggle = () => { x.open ? OPEN_DAYS.add(x.dataset.d) : OPEN_DAYS.delete(x.dataset.d) });
  document.querySelectorAll(".lesson").forEach(el => el.onclick = () => { if (el.dataset.open === "1") openLesson(el.dataset.id) });
}
function confirmBox(){ return true }

/* ---------- урок ---------- */
let L, LID, S;
function openLesson(id){
  LID = id; L = LESSONS[id];
  document.body.className = L.theme || ""; document.documentElement.style.background = L.theme === "brand" ? "#F4F5F7" : "";
  S = load("ls_" + id) || {stage: -1, scores: [], answer: ""};
  const res = load("res_" + id);
  if (res) return results();
  if (S.stage < 0) return intro();
  stageBrief();
}
const DEF_UI = { introStamp: "Дело", start: "Открыть дело", brief: "Материалы дела", doneStamp: "Дело закрыто", submit: "Сдать дело" };
const ui = k => (L.ui && L.ui[k]) || DEF_UI[k];
function persist(){ save("ls_" + LID, S) }
function total(){ return S.scores.reduce((a,b)=>a+(b||0),0) }
function header(){
  const steps = L.stages.map((_,i)=>`<i class="${i < S.stage ? "on" : i === S.stage ? "cur" : ""}"></i>`).join("");
  return `<div class="top"><button class="link" id="back">← В кабинет</button><span class="pts">Баллы: ${total()}</span></div><div class="steps">${steps}</div>`;
}
function bindBack(){ $("#back").onclick = () => { LID = null; home(); } }
function intro(){
  app.innerHTML = `<div class="top"><button class="link" id="back">← В кабинет</button></div>
  <div class="card folder"><span class="stamp">${ui("introStamp")}</span><h1 style="margin-top:12px">${esc(L.title)}</h1>${L.intro}
  <p class="sans small"><b>Этапы:</b> ${L.stages.map((s,i)=>`${i+1}. ${s.name} (${s.min} мин)`).join(" · ")}</p>
  <button class="btn red" id="start">${ui("start")}</button></div>`;
  bindBack();
  $("#start").onclick = () => { S.stage = 0; S.t0 = Date.now(); persist(); stageBrief(); };
}
function stageBrief(){
  if (S.stage >= L.stages.length) return finish();
  const st = L.stages[S.stage];
  app.innerHTML = header() + `<div class="card ${L.theme === "brand" ? "" : "folder"} brief"><span class="tag">${ui("brief")} · часть ${S.stage+1} из ${L.stages.length} · ≈${st.min} мин</span><h2>${esc(st.name)}</h2>${st.brief}
  <button class="btn" id="go">К заданию →</button></div>`;
  bindBack(); scrollTo(0,0);
  let pts = 0, pi = 0;
  $("#go").onclick = () => nextPart();
  function nextPart(){
    if (pi >= st.parts.length){ S.scores[S.stage] = pts; S.stage++; persist(); return stageBrief(); }
    let p = st.parts[pi++];
    if (p.variants) p = {...p, ...p.variants[(S.choice || {})[p.choiceKey]]};
    app.innerHTML = header() + `<div class="card" id="pc"></div>`;
    bindBack(); scrollTo(0,0);
    RENDER[p.type](p, $("#pc"), got => { pts += got; nextPart(); });
  }
}

/* ---------- типы заданий ---------- */
const RENDER = {
str(p, el, done){
  const LOOK = {"а":"a","в":"b","с":"c","е":"e","н":"h","к":"k","м":"m","о":"o","р":"p","т":"t","х":"x"};
  const norm = s => String(s).toLowerCase().replace(/ё/g,"е").replace(/[\s,;.()\-–—→>:]+/g,"");
  const normL = s => norm(s).replace(/[авсенкмортх]/g, c => LOOK[c]);
  el.innerHTML = `<span class="tag">Ответ</span><h2>${p.title}</h2>${p.fig || ""}${p.prompt ? `<p>${p.prompt}</p>` : ""}
  ${p.items.map((x,i)=>`<div class="fill item" data-i="${i}"><label style="margin:0 0 6px">${x.a}</label><input type="text" class="sin" autocomplete="off" spellcheck="false" style="max-width:320px"><div class="why"></div></div>`).join("")}
  <button class="btn" id="ck" disabled>Проверить</button>`;
  const ins = [...el.querySelectorAll(".sin")];
  ins.forEach(n => n.oninput = () => $("#ck").disabled = ins.some(z => !z.value.trim()));
  $("#ck").onclick = () => {
    let got = 0; el.classList.add("checked");
    el.querySelectorAll(".fill").forEach(f => {
      const x = p.items[f.dataset.i], inp = f.querySelector("input"), v = inp.value;
      const ok = [].concat(x.ans).some(a => norm(a) === norm(v) || normL(a) === normL(v));
      if (ok) got++; inp.disabled = true; f.classList.add(ok ? "ok" : "bad");
      f.querySelector(".why").innerHTML = (ok ? "<b>Верно.</b> " : `<b>Правильно: ${x.show || [].concat(x.ans)[0]}.</b> `) + (x.w || "");
    });
    const b = $("#ck"); b.textContent = `${got} из ${p.items.length} · Дальше →`; b.onclick = () => done(got);
  };
},
huffman(p, el, done){
  let uid = 0, sel = [], got = 0, firstTry = true, msg = "";
  let nodes = p.items.map(x => ({id: "h" + (uid++), w: x.w, syms: x.s, leaf: x.s}));
  const total = p.items.length - 1;
  const codesOf = root => { const out = {}; const go = (n, c) => { if (n.leaf) { out[n.leaf] = c || "0"; return; } go(n.l, c + "0"); go(n.r, c + "1"); }; go(root, ""); return out; };
  const draw = () => {
    const step = total - nodes.length + 2;
    const fin = nodes.length === 1;
    el.innerHTML = `<span class="tag">Интерактив</span><h2>${p.title}</h2><p>${p.prompt}</p>
    ${fin ? "" : `<p class="sans small"><b>Шаг ${step} из ${total}.</b> ${msg || "Выбери два узла с наименьшими весами."}</p>`}
    <div class="hf">${nodes.slice().sort((a,b)=>a.w-b.w).map(n=>`<button class="hfn ${sel.includes(n.id)?"on":""} ${n.leaf?"":"inner"}" data-id="${n.id}" ${fin?"disabled":""}><b>${n.w}</b><span>${n.syms}</span></button>`).join("")}</div>
    <div class="hflog">${log.map(s=>`<div>${s}</div>`).join("")}</div><div id="w"></div>`;
    el.querySelectorAll(".hfn").forEach(b => b.onclick = () => pick(b.dataset.id));

        <div class="refcard" style="margin:12px 0 0"><div class="rf"><span>Элемент</span><b>${elname}</b></div><div class="rf"><span>Массовое число A</span><b>${v.p + v.n}</b></div><div class="rf"><span>Заряд</span><b>${qs}</b></div><div class="rf"><span>Слои</span><b>${shells(v.e).join(", ") || "—"}</b></div></div>
      </div></div><div id="w"></div>${checked ? "" : `<button class="btn" id="ck">Проверить</button>`}`;
      el.querySelectorAll(".actr button").forEach(b => b.onclick = () => { const key = b.dataset.k; v[key] = Math.max(0, Math.min(key === "n" ? 30 : 20, v[key] + +b.dataset.d)); draw(); });

    {k:"cos", f:Math.cos, lead:"Теперь справа рисуется <b>сдвиг точки по горизонтали</b> — это косинус угла. Снова прокрути полный оборот."}
  ];
  let m = 0, a = 0, maxA = 0;
  const gcd = (x,y) => y ? gcd(y, x % y) : x;
  const radStr = d => { if (!d) return "0"; const g = gcd(d,180), n = d/g, q = 180/g; return (n === 1 ? "" : n) + "π" + (q === 1 ? "" : "/" + q) };
  el.innerHTML = `<span class="tag">Интерактив</span><h2>${p.title}</h2><p id="lead"></p><div id="fig"></div>
    <input type="range" id="ang" min="0" max="360" step="15" value="0" style="width:100%;accent-color:#3b67d6" aria-label="Угол поворота">
    <p class="sans" id="rd"></p><button class="btn" id="nx" disabled>Прокрути до 360°</button>`;
  const draw = () => {
    const M = modes[m], r = 80, cx = 105, cy = 115, g0 = 235, g1 = 620, sx = (g1 - g0) / 360;
    const rad = a * Math.PI / 180, px = cx + r * Math.cos(rad), py = cy - r * Math.sin(rad);
    let path = ""; for (let d = 0; d <= maxA; d += 3) path += (d ? "L" : "M") + (g0 + d*sx).toFixed(1) + " " + (cy - r*M.f(d*Math.PI/180)).toFixed(1);
    const gx = g0 + a*sx, gy = cy - r*M.f(rad);
    let s = `<svg viewBox="0 0 640 245" style="width:100%;height:auto;display:block;background:#fff;border:1px solid #e2e4e9;border-radius:12px">`;
    s += `<line x1="15" x2="195" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${cx}" x2="${cx}" y1="25" y2="205" stroke="#9aa0aa"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#c9ced8" stroke-width="2"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#222" stroke-width="1.5"/>`;
    if (m === 0) s += `<line x1="${px}" y1="${cy}" x2="${px}" y2="${py}" stroke="#3b67d6" stroke-width="5" stroke-linecap="round"/><line x1="${px}" y1="${py}" x2="${gx}" y2="${gy}" stroke="#3b67d6" stroke-dasharray="4 4"/>`;
    else s += `<line x1="${cx}" y1="${py}" x2="${px}" y2="${py}" stroke="#3b67d6" stroke-width="5" stroke-linecap="round"/>`;
    s += `<circle cx="${px}" cy="${py}" r="6" fill="#222"/>`;
    s += `<line x1="${g0}" x2="${g1}" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${g0}" x2="${g0}" y1="25" y2="205" stroke="#9aa0aa"/>`;
    [[cy-r,"1"],[cy+r,"−1"]].forEach(([y,l]) => s += `<line x1="${g0}" x2="${g1}" y1="${y}" y2="${y}" stroke="#eceef2"/><text x="${g0-6}" y="${y+4}" font-size="12" text-anchor="end" fill="#5f636b" font-family="sans-serif">${l}</text>`);
    [90,180,270,360].forEach(d => s += `<line x1="${g0+d*sx}" x2="${g0+d*sx}" y1="25" y2="205" stroke="#eceef2"/><text x="${g0+d*sx}" y="222" font-size="11" text-anchor="middle" fill="#5f636b" font-family="sans-serif">${d}°</text><text x="${g0+d*sx}" y="237" font-size="11" text-anchor="middle" fill="#5f636b" font-family="sans-serif">${radStr(d)}</text>`);
    s += `<path d="${path}" fill="none" stroke="#3b67d6" stroke-width="3"/><circle cx="${gx}" cy="${gy}" r="5" fill="#3b67d6"/></svg>`;
    $("#fig").innerHTML = s;
    let v = M.f(rad); if (Math.abs(v) < 0.005) v = 0;
    $("#rd").innerHTML = `Угол <b>${a}° = ${radStr(a)}</b> · ${M.k} = <b>${v.toFixed(2).replace("-","−")}</b>`;
    $("#lead").innerHTML = M.lead;
  };
  $("#ang").oninput = e => {
    a = +e.target.value; maxA = Math.max(maxA, a); draw();
    if (maxA >= 360){ const b = $("#nx"); b.disabled = false; b.textContent = m === 0 ? "Теперь косинус →" : "Дальше →"; }
  };
  $("#nx").onclick = () => {
    if (m === 0){ m = 1; a = 0; maxA = 0; $("#ang").value = 0; $("#nx").disabled = true; $("#nx").textContent = "Прокрути до 360°"; draw(); scrollTo(0,0); }
    else done(0);
  };
  draw();
},

reveal(p, el, done){
  let k = 0, got = 0;
  const one = () => {
    if (k >= p.items.length) return done(got);
    const it = p.items[k]; let open = 1, answered = false;
    const draw = () => {
      el.innerHTML = `<span class="tag">Профиль ${k+1} из ${p.items.length}</span><h2>${p.title}</h2>
      <div class="refcard"><div class="avatar">?</div>${it.clues.map((c,i)=>`<div class="rf ${i<open?"":"hid"}"><span>Подсказка ${i+1}</span><b>${i<open?c:"скрыто"}</b></div>`).join("")}</div>
      ${answered ? "" : (open < it.clues.length ? `<p><button class="btn ghost" id="more">Открыть подсказку (сейчас за ответ ${Math.max(1,4-open)} б.)</button></p>` : "")}
      <p class="sans small"><b>${p.ask || "Что это за страна?"}</b></p>
      ${it.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}<div id="w"></div>`;
      if ($("#more")) $("#more").onclick = () => { open++; draw(); };
      el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const ok = +b.dataset.i === it.c, pts = ok ? Math.max(1, 4 - open) : 0; got += pts; answered = true; open = it.clues.length;
        draw();
        el.querySelectorAll(".opt").forEach(z => { z.disabled = true; if (+z.dataset.i === it.c) z.classList.add("ok"); else if (z.dataset.i === b.dataset.i) z.classList.add("bad") });
        $("#w").innerHTML = `<p class="sans"><b>${ok ? `Верно, +${pts}` : "Не угадал"}.</b> Это ${it.opts[it.c]}.</p><button class="btn" id="nx">${k+1 < p.items.length ? "Следующий профиль →" : "Дальше →"}</button>`;
        $("#nx").onclick = () => { k++; scrollTo(0,0); one(); };
      });
    };
    draw();
  };
  one();
},

dnf(p, el, done){
  const n = p.vars.length, rows = [...Array(1<<n)].map((_,r)=>[...Array(n)].map((_,j)=>(r>>(n-1-j))&1));
  const want = p.mode === "sdnf" ? 1 : 0, sel = new Set();
  const term = r => p.mode === "sdnf"
    ? r.map((b,j)=> b ? p.vars[j] : "¬"+p.vars[j]).join("∧")
    : "(" + r.map((b,j)=> b ? "¬"+p.vars[j] : p.vars[j]).join("∨") + ")";
  const formula = () => [...sel].sort((a,b)=>a-b).map(i=>term(rows[i])).join(p.mode === "sdnf" ? " ∨ " : " ∧ ") || "…";
  el.innerHTML = `<span class="tag">Задание</span><h2>${p.title}</h2><p>${p.prompt}</p>
  <table class="tt">${"<tr>"+p.vars.map(v=>`<th>${v}</th>`).join("")+"<th>f</th><th></th></tr>"}
  ${rows.map((r,i)=>`<tr data-i="${i}" class="pickrow">${r.map(b=>`<td>${b}</td>`).join("")}<td><b>${p.f(r)}</b></td><td class="mk"></td></tr>`).join("")}</table>
  <p class="sans small muted">Формула:</p><div class="codebox" id="fm">…</div><p></p>
  <div id="w"></div><button class="btn" id="ck" disabled>Проверить</button>`;
  el.querySelectorAll(".pickrow").forEach(tr => tr.onclick = () => {
    if (el.classList.contains("checked")) return;
    const i = +tr.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i);
    tr.classList.toggle("sel", sel.has(i)); tr.querySelector(".mk").textContent = sel.has(i) ? "✓" : "";
    $("#fm").textContent = formula(); $("#ck").disabled = sel.size === 0;
  });
  $("#ck").onclick = () => {
    el.classList.add("checked");
    const right = rows.map((r,i)=>i).filter(i => p.f(rows[i]) === want);
    const ok = right.length === sel.size && right.every(i => sel.has(i)), got = ok ? 2 : 0;
    sel.clear(); right.forEach(i => sel.add(i));
    $("#w").innerHTML = ok ? `<div class="note"><b>Верно, +2.</b> ${p.why}</div><p></p>` : `<div class="note"><b>Не совсем.</b> ${p.why}<br><b>Правильно:</b> ${formula()}</div><p></p>`;
    const b = $("#ck"); b.textContent = "Дальше →"; b.onclick = () => done(got);
  };
},

proofread(p, el, done){
  const marks = new Set();
  let i = 0; const html = p.text.replace(/\[\[(.+?)\|(err|ok)\]\]/g, (_, w) => `<span class="pw" data-i="${i++}">${w}</span>`);

  <div class="refcard letter">${html}</div><div id="w"></div><button class="btn" id="ck">Проверить</button>`;
  el.querySelectorAll(".pw").forEach(s => s.onclick = () => { if (el.classList.contains("checked")) return; const k = +s.dataset.i; marks.has(k) ? marks.delete(k) : marks.add(k); s.classList.toggle("on", marks.has(k)); });
  $("#ck").onclick = () => {

pivot(p, el, done){
  const F = {m:"Менеджер", mo:"Месяц", c:"Категория"}, idx = {m:0, mo:1, c:2};
  const order = {mo:["Январь","Февраль","Март"]};
  const st = {rows:"m", cols:"", agg:"sum", show:"val", filt:""};
  const fmt = v => st.show === "pct" ? v.toFixed(1).replace(".",",") + " %" : Math.round(v).toLocaleString("ru-RU") + " ₽";
  const vals = k => { const u = [...new Set(p.data.map(r => r[idx[k]]))]; return order[k] ? order[k].filter(x => u.includes(x)) : u.sort(); };
  const opt = (id, list, cur) => `<select id="${id}">${list.map(([v,l]) => `<option value="${v}" ${v===cur?"selected":""}>${l}</option>`).join("")}</select>`;

  el.innerHTML = `<span class="tag">Конструктор</span><h2>${p.title}</h2><p>${p.prompt}</p>
  <div class="pv">
   <div><label>Строки</label>${opt("pvr", fields, st.rows)}</div>
   <div><label>Столбцы</label>${opt("pvc", [["","— нет —"],...fields], st.cols)}</div>
   <div><label>Значения: Сумма продаж</label>${opt("pva", [["sum","Сумма"],["avg","Среднее"],["cnt","Количество сделок"]], st.agg)}</div>
   <div><label>Показывать как</label>${opt("pvs", [["val","Значение"],["pct","% от общего итога"]], st.show)}</div>

  <button class="btn" id="ck" disabled>Проверить ответы</button>`;
  const draw = () => {

    const R = vals(st.rows), C = st.cols && st.cols !== st.rows ? vals(st.cols) : [null];

    const grand = agg(all);

arc(p, el, done){
  const cx = 160, cy = 150, R = 110, pts = [...Array(12)].map((_,i)=>i*30);
  const lab = d => ({0:"0",30:"π/6",60:"π/3",90:"π/2",120:"2π/3",150:"5π/6",180:"π",210:"7π/6",240:"4π/3",270:"3π/2",300:"5π/3",330:"11π/6"})[d];
  let st = null, en = null;
  const P = d => [cx + R*Math.cos(d*Math.PI/180), cy - R*Math.sin(d*Math.PI/180)];
  const draw = () => {
    let s = `<svg viewBox="0 0 320 300" style="width:100%;max-width:380px;display:block;margin:8px 0;touch-action:manipulation">
      <line x1="20" x2="300" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${cx}" x2="${cx}" y1="20" y2="285" stroke="#9aa0aa"/>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c9ced8" stroke-width="3"/>
      ${p.line !== undefined ? `<line x1="30" x2="290" y1="${cy - R*p.line}" y2="${cy - R*p.line}" stroke="#9e2a1e" stroke-dasharray="5 4"/><text x="22" y="${cy - R*p.line - 6}" font-size="12" font-family="sans-serif" fill="#9e2a1e" text-anchor="start">${p.lineLabel}</text>` : ""}`;
    if (st !== null && en !== null){
      const a = P(st), b = P(en), sweep = ((en - st + 360) % 360) || 360;
      s += `<path d="M${a[0]} ${a[1]} A${R} ${R} 0 ${sweep > 180 ? 1 : 0} 0 ${b[0]} ${b[1]}" fill="none" stroke="#3b67d6" stroke-width="7" stroke-linecap="round"/>`;
    }
    pts.forEach(d => { const [x,y] = P(d), on = d === st || d === en;
      s += `<g class="ap" data-d="${d}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="${on?8:5}" fill="${on?"#222":"#7199F1"}"/>
      <text x="${cx + (R+24)*Math.cos(d*Math.PI/180)}" y="${cy - (R+24)*Math.sin(d*Math.PI/180) + 4}" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#222">${lab(d)}</text></g>`; });
    $("#af").innerHTML = s + "</svg>";
    $("#as").textContent = st === null ? "Нажми на начало дуги." : en === null ? `Начало: ${lab(st)}. Теперь нажми на конец дуги (дуга идёт против часовой стрелки).` : `Дуга от ${lab(st)} до ${lab(en)} против часовой стрелки.`;
    $("#ck").disabled = en === null;
    el.querySelectorAll(".ap").forEach(g => g.onclick = () => {
      if (el.classList.contains("checked")) return;
      const d = +g.dataset.d; if (st === null || en !== null){ st = d; en = null; } else if (d !== st) en = d; draw();
    });
  };
  el.innerHTML = `<span class="tag">Интерактив</span><h2>${p.title}</h2><p>${p.q}</p><div id="af"></div><p class="sans small" id="as"></p>
  <p class="sans small muted">Чтобы начать заново, нажми на любую точку ещё раз — она станет новым началом.</p><div id="w"></div><button class="btn" id="ck" disabled>Проверить</button>`;
  draw();
  $("#ck").onclick = () => {
    el.classList.add("checked"); const ok = st === p.from && en === p.to;
    if (!ok){ st = p.from; en = p.to; draw(); }
    $("#w").innerHTML = `<div class="note"><b>${ok ? "Верно." : "Не совсем: правильная дуга теперь показана."}</b> ${p.w}</div><p></p>`;
    const b = $("#ck"); b.disabled = false; b.textContent = "Дальше →"; b.onclick = () => done(ok ? 1 : 0);
  };
},

/* ---------- финал и отправка ---------- */
function finish(){
  const prof = load("profile") || {};
  const max = lessonMax(L), score = total();
  const details = L.stages.map((s,i)=>`${s.name}: ${S.scores[i]||0}/${stageMax(s)}`).join("; ") + (S.choice ? "; выбор: " + Object.values(S.choice).join(", ") : "") + (S.survey ? "; опрос: " + S.survey : "") + (S.t0 ? "; время на урок: " + Math.max(1, Math.round((Date.now() - S.t0) / 60000)) + " мин" : "");
  const code = hash([prof.name, prof.group, LID, score].join("|") + "|dost");
  const res = { name: prof.name, group: prof.group, lesson: SCHEDULE.find(s=>s.id===LID)?.subject + " · " + L.title,
    score, max, percent: Math.round(score / max * 100), answer: S.answer, details, code, sent: false };
  save("res_" + LID, res);
  results(true);
}
async function sendRes(res){
  const F = CONFIG.FORM; if (!F.action) return "none";
  const body = new URLSearchParams();
  for (const k in F.fields) if (F.fields[k]) body.append(F.fields[k], String(res[k] ?? ""));
  try { await fetch(F.action, {method:"POST", mode:"no-cors", body}); return "ok" } catch(e) { return "fail" }
}
async function results(fresh){
  const res = load("res_" + LID);
  const line = `${res.name}, гр. ${res.group}. ${res.lesson}. Баллы: ${res.score} из ${res.max}. Код: ${res.code}`;
  app.innerHTML = `<div class="top"><button class="link" id="back">← В кабинет</button></div>
  <div class="card folder"><span class="stamp">${ui("doneStamp")}</span>
  <h1 style="margin-top:12px">${esc(res.name)}, спасибо за работу</h1>
  <div class="row" style="align-items:flex-end;margin:10px 0 6px"><span class="big">${res.score}</span><span class="sans muted">из ${res.max} баллов</span></div>
  <table class="res">${L.stages.map((s,i)=>`<tr><td>${i+1}. ${s.name}</td><td>${stageMax(s) ? (S.scores[i] ?? "—") + " / " + stageMax(s) : "сдан"}</td></tr>`).join("")}</table>
  <div id="snd" class="note sans small">Отправляем результат…</div></div>`;
  bindBack(); scrollTo(0,0);
  let st = res.sent ? "ok" : await sendRes(res);
  if (st === "ok" && !res.sent){ res.sent = true; save("res_" + LID, res); }
  const backup = `<p style="margin:10px 0 6px">Скопируй строку ниже и отправь преподавателю в чат группы:</p><div class="codebox">${esc(line)}</div><p style="margin-top:8px"><button class="btn ghost" id="cp">Скопировать</button></p>`;
  $("#snd").innerHTML = st === "ok"
    ? `<b>Результат отправлен преподавателю.</b> Ничего пересылать не нужно.`
    : st === "fail"
      ? `<b>Не получилось отправить: проверь интернет.</b> <button class="link" id="rt">Попробовать ещё раз</button>${backup}`
      : `<b>Автоотправка пока не подключена.</b>${backup}`;
  if ($("#rt")) $("#rt").onclick = () => results();
  if ($("#cp")) $("#cp").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(line); $("#cp").textContent = "Скопировано"; };
}

function resetAll(){ try { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)) } catch(e) {} home(); }
if (location.search.includes("reset")) { try { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)) } catch(e) {} }
if (location.search.includes("testsend")) {
  sendRes({name:"Тест Проверка", group:"тест", lesson:"Проверка связи · " + CONFIG.TITLE, score:0, max:0, percent:0, answer:"—", details:"тестовая запись, можно удалить", code:"TEST"})
    .then(st => { app.innerHTML = `<div class="card"><h2>${st === "ok" ? "Тестовая запись отправлена" : "Не удалось отправить"}</h2><p>${st === "ok" ? "Открой таблицу результатов: там должна появиться строка «Тест Проверка». Если её нет через минуту, напиши мне." : "Проверь интернет и попробуй ещё раз."}</p></div>`; });
} else {
home();
}
syncClock().then(() => { if (document.querySelector(".lesson")) home() });
setInterval(() => { if (!LID && document.querySelector(".lesson")) home() }, 60000);
</script>
