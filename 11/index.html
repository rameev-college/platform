<style>
:root{
  --paper:#efe6d2; --card:#fbf7ee; --ink:#2a2521; --muted:#6e6458; --line:#d9ccb1;
  --red:#9e2a1e; --red-soft:#f3dcd6; --ok:#2f6a3b; --ok-soft:#dcebdc; --hi:#e8d9b4;
  --serif:"PT Serif",Georgia,serif; --sans:"PT Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
body{background-image:radial-gradient(rgba(120,90,40,.06) 1px,transparent 1px);background-size:6px 6px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0 0 .4em}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.small{font-size:14px}
.sans{font-family:var(--sans)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;margin:0 0 16px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -12px rgba(60,40,10,.35)}
.folder{position:relative;border-top:6px solid var(--red)}
.tag{display:inline-block;font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;transform:rotate(-3deg)}
.btn{font-family:var(--sans);font-size:16px;font-weight:700;border:0;border-radius:4px;background:var(--ink);color:#fff;padding:12px 18px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.red{background:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select,textarea{font:inherit;font-family:var(--sans);width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
textarea{min-height:150px;font-family:var(--serif)}
label{font-family:var(--sans);font-size:14px;font-weight:700;display:block;margin:10px 0 4px}

/* расписание */
.lesson{display:flex;gap:16px;align-items:flex-start;cursor:pointer;transition:transform .1s}
.lesson:hover{transform:translateY(-1px)}
.lesson.dis{cursor:default;opacity:.6}
.lesson .time{font-family:var(--sans);font-weight:700;min-width:64px}
.lesson .time small{display:block;font-weight:400;color:var(--muted)}
.lesson .body{flex:1}
.lesson.now{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.status{font-family:var(--sans);font-size:13px;font-weight:700;padding:3px 8px;border-radius:3px;background:var(--hi);white-space:nowrap}
.status.now{background:var(--red);color:#fff}
.status.done{background:var(--ok-soft);color:var(--ok)}
.status.lock{background:#e4e0d8;color:var(--muted)}

/* шапка урока */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--sans);font-size:14px}
.steps{display:flex;gap:4px;margin:0 0 18px}
.steps i{flex:1;height:5px;background:var(--line);border-radius:3px}
.steps i.on{background:var(--ink)} .steps i.cur{background:var(--red)}
.pts{font-weight:700}
.link{background:none;border:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}

/* материалы дела */
.brief ul{padding-left:20px;margin:0 0 .8em} .brief li{margin-bottom:6px}
.quote{border-left:3px solid var(--red);padding:4px 0 4px 14px;font-style:italic;margin:10px 0}
.note{background:var(--hi);border-radius:4px;padding:12px 14px;font-size:16px}
.note b{font-family:var(--sans)}

/* задания */
.item{border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:10px;background:#fff}
.item.ok{border-color:var(--ok);background:var(--ok-soft)}
.item.bad{border-color:var(--red);background:var(--red-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--sans);font-size:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:20px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.chip:disabled{cursor:default}
.why{font-size:15px;margin-top:8px;display:none}
.checked .why{display:block}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}

/* допрос */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:88%;padding:10px 14px;border-radius:6px;font-size:16px}
.msg .who{font-family:var(--sans);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px;color:var(--muted)}
.msg.r{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end}
.msg.me .who{color:#cfc6b8}
.msg.p{background:var(--hi);align-self:flex-start;font-style:italic}
.meter{font-family:var(--sans);font-size:13px;margin-bottom:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--red);transition:width .5s}

/* порядок */
.ord{display:flex;align-items:center;gap:10px}
.ord .n{font-family:var(--sans);font-weight:700;min-width:22px}
.ord .t{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:2px}
.ord .mv button{border:1px solid var(--line);background:var(--card);border-radius:3px;width:34px;height:26px;cursor:pointer;font-size:13px}

.fill{margin-bottom:14px}
.fill select{display:block;width:100%;max-width:100%;margin:6px 0;padding:8px 10px}
.res td{padding:6px 8px;border-bottom:1px solid var(--line)} .res td:last-child{text-align:right;font-family:var(--sans);font-weight:700}
.res{width:100%;border-collapse:collapse;margin:8px 0 14px}
.big{font-size:44px;font-weight:700;font-family:var(--sans);line-height:1}
.codebox{font-family:Consolas,Menlo,monospace;font-size:13px;background:#fff;border:1px dashed var(--line);padding:10px;border-radius:4px;word-break:break-word}
/* фирменный стиль колледжа: главная страница кабинета */
body.brand{--paper:#F4F5F7;--card:#fff;--ink:#222;--muted:#5f636b;--line:#e2e4e9;--hi:#EFFE74;--serif:"Manrope",system-ui,sans-serif;--sans:"Manrope",system-ui,sans-serif;background-image:none}
body.brand h1,body.brand h2,body.brand h3{font-weight:800;letter-spacing:-.01em}
body.brand .card{border-radius:18px;box-shadow:none}
body.brand .folder{background:#7199F1;border:0}
body.brand .folder .muted,body.brand .folder .link{color:#222;opacity:.75}
body.brand .tag{color:#222;background:#EFFE74;padding:3px 10px;border-radius:20px;letter-spacing:.03em;font-size:11px}
body.brand .folder .tag{background:#fff}
body.brand .btn{border-radius:12px;background:#222}
body.brand input[type=text],body.brand select{border-radius:12px;border-color:#fff}
body.brand .lesson.now{border-color:#7199F1;box-shadow:0 0 0 2px #7199F1}
body.brand .status{background:#F4F5F7;border-radius:20px;padding:4px 10px}
body.brand .status.now{background:#EFFE74;color:#222}
body.brand .status.done{background:#dfe8fc;color:#222}
body.brand .lesson.dis{opacity:.55}
.dayhead{font-family:var(--sans);font-size:15px;font-weight:800;margin:22px 4px 10px}
.letter p{margin:0 0 .7em}
.pw{border-bottom:2px dashed #7199F1;cursor:pointer;padding:0 2px;border-radius:3px}
.pw.on{background:#EFFE74}
.pw.perr{border-bottom:3px solid var(--red)} .pw.pok{border-bottom:3px solid var(--ok)}
.pw.miss{outline:2px solid var(--red)}
.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px;margin-bottom:12px}
.pv label{margin:6px 0 4px}
.pvt td{text-align:right;white-space:nowrap} .pvt th{text-align:left}
.ord .t{min-width:0;overflow-x:auto}
.ord code{font-size:12px}
.mini{border-collapse:collapse;font-family:var(--sans);font-size:14px;margin:4px 0}
.mini td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.mini td:first-child{font-weight:700;background:#f4f5f7}
.item svg{max-width:100%}
body.brand .steps i.cur{background:#7199F1}
body.brand .btn.red{background:#222}
body.brand .btn.ghost{background:transparent;color:#222;border:1.5px solid #222}
body.brand .stamp{border-color:#222;color:#222;transform:none;border-radius:20px;background:#fff}
body.brand .item,body.brand .opt{border-radius:12px}
body.brand .note{border-radius:12px}
.refcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0 14px}
.refcard .rf{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:15px}
.refcard .rf:last-child{border-bottom:0}
.refcard .rf span{color:var(--muted);min-width:110px}

const LIGHTS = [{id:"g",label:"Зелёный"},{id:"y",label:"Жёлтый"},{id:"r",label:"Красный"}];


/* ============ 9 ноября · История России ============ */
LESSONS.hist11 = {
  title: "Империя перемен", theme: "brand", ui: BRAND_UI,
  intro: `<p>Тебе предстоит собрать общую картину российской истории от реформ Петра I до правления Николая I. Важно не просто вспомнить имена и даты, а увидеть, какие задачи решали правители, почему их решения принимались именно тогда и к каким последствиям приводили.</p>
<p>Ты выступишь в роли исторического аналитика: разберёшь реформы, сравнишь политические курсы, восстановишь последовательность событий и проверишь, как изменения одной эпохи влияли на следующую.</p>
<p class="muted small sans">Это занятие на повторение. В заданиях встречаются факты, причинно-следственные связи и исторические интерпретации. Выбирай ответ по смыслу, а не по знакомым словам.</p>`,
  stages: [
  { name: "Пётр I: перестройка государства", min: 8,
    brief: `<p>В конце XVII — первой четверти XVIII века Россия решала задачи укрепления государства, развития армии и флота, выхода к морям и освоения европейских технологий.</p>
<ul>
<li><b>Военная реформа:</b> регулярная армия, рекрутские наборы, развитие флота и военной промышленности.</li>
<li><b>Управление:</b> Сенат, коллегии, губернская реформа, Табель о рангах. Государственная служба всё больше связывалась с чином и службой.</li>
<li><b>Экономика:</b> поддержка мануфактур, развитие металлургии и оружейного производства, усиление государственного вмешательства.</li>
<li><b>Культура и образование:</b> светские школы, распространение европейских практик, изменение быта дворянства.</li>
<li><b>Цена преобразований:</b> рост налогов и повинностей, усиление крепостной зависимости, принудительный характер многих мер.</li>
</ul>
<div class="note"><b>Главная мысль:</b> реформы ускорили превращение России в империю и усилили государство, но проводились преимущественно сверху и сопровождались тяжёлой нагрузкой на население.</div>`,
    parts: [
    { type: "drag", title: "Реформа или её последствие?", prompt: "Распредели факты по смыслу: что было инструментом преобразований, а что — результатом или издержкой.",
      bins: [{id:"m",label:"Мера / инструмент"},{id:"r",label:"Результат или издержка"}],
      items: [
        {t:"Создание Сената и коллегий для перестройки центрального управления", b:"m", w:"Это новые учреждения и способ организации управления."},
        {t:"Формирование регулярной армии и военно-морского флота", b:"m", w:"Это институциональная военная реформа."},
        {t:"Развитие мануфактур, в том числе для снабжения армии", b:"m", w:"Государство стимулировало промышленное производство."},
        {t:"Увеличение налогового давления и повинностей", b:"r", w:"Это одна из социальных и экономических издержек преобразований."},
        {t:"Укрепление позиций России на Балтике после Северной войны", b:"r", w:"Это важный внешнеполитический результат войны и преобразований."},
        {t:"Расширение возможностей служебного продвижения через Табель о рангах", b:"r", w:"Табель была инструментом, а расширение служебной карьеры — одним из её эффектов."},
        {t:"Усиление зависимости крестьян и распространение крепостных порядков на новые категории работников", b:"r", w:"Это тяжёлое социальное последствие политики государства."}
      ]},
    { type: "mc", q: "Почему создание регулярной армии повлияло не только на военную сферу?", opts: ["Армии требовались налоги, рекруты, оружие, металл и организованное управление","После реформы армия сама обеспечивала государство всеми товарами","Военная реформа автоматически отменяла сословные различия"], c: 0,
      w: "Регулярная армия требовала устойчивой системы снабжения и финансирования, поэтому военные задачи затрагивали налоги, промышленность и управление."},
    { type: "mc", q: "Как точнее всего описать противоречие петровских преобразований?", opts: ["Государство стало слабее, хотя население получило больше свобод","Модернизация и усиление государства сочетались с ростом повинностей и принуждения","Все преобразования были направлены исключительно на изменение культуры"], c: 1,
      w: "Преобразования укрепили государство и его международные позиции, но сопровождались высокой социальной ценой."}
    ]
  },
  { name: "Екатерина II: просвещение и сословия", min: 9,
    brief: `<p>Екатерина II правила в 1762–1796 годах. Её эпоху часто связывают с идеями Просвещения, расширением территории империи и укреплением дворянства.</p>
<ul>
<li><b>«Просвещённый абсолютизм»:</b> использование идей Просвещения при сохранении самодержавной власти. Уложенная комиссия 1767 года обсуждала необходимость нового законодательства, но не создала новый кодекс.</li>
<li><b>Губернская реформа 1775 года:</b> перестройка местного управления и суда, увеличение числа губерний.</li>
<li><b>Жалованная грамота дворянству 1785 года:</b> закрепление сословных привилегий дворян.</li>
<li><b>Крестьянский вопрос:</b> крепостная зависимость не была отменена; в ряде регионов и ситуаций положение крестьян ухудшалось.</li>
<li><b>Внешняя политика:</b> русско-турецкие войны, укрепление позиций на Чёрном море, присоединение Крыма в 1783 году, разделы Речи Посполитой.</li>
</ul>
<div class="note"><b>Важно:</b> идеи Просвещения не означали перехода к демократии или отмены крепостного права. Политика Екатерины сочетала реформаторскую риторику с укреплением сословного строя.</div>`,
    parts: [
    { type: "classify", title: "Две стороны политики", prompt: "Отнеси каждое положение к той стороне политики Екатерины II, которую оно лучше всего характеризует.",
      bins: [{id:"p",label:"Просвещённая / административная модернизация"},{id:"s",label:"Укрепление сословного порядка"}],
      items: [
        {t:"Созыв Уложенной комиссии и обсуждение проекта нового законодательства", b:"p", w:"Попытка использовать идеи рационального законодательства и обсуждения общественных проблем."},
        {t:"Губернская реформа и усиление местного административного аппарата", b:"p", w:"Перестройка управления для более эффективного контроля территории."},
        {t:"Жалованная грамота дворянству 1785 года", b:"s", w:"Документ закрепил права и привилегии дворянского сословия."},
        {t:"Сохранение крепостной зависимости крестьян", b:"s", w:"Сословная система и власть помещиков сохранялись."},
        {t:"Развитие образования и открытие учебных заведений", b:"p", w:"Это часть культурной и образовательной политики эпохи."},
        {t:"Расширение прав и корпоративной самостоятельности дворянских собраний", b:"s", w:"Это укрепляло положение дворян как привилегированного сословия."}
      ]},
    { type: "fill", title: "Проверь исторические ориентиры", items: [
      {a:"Уложенная комиссия была созвана в…", o:["1762 году","1767 году","1775 году","1785 году"], c:1, z:""},
      {a:"Крым вошёл в состав Российской империи в…", o:["1774 году","1783 году","1791 году","1796 году"], c:1, z:""},
      {a:"Жалованная грамота дворянству была издана в…", o:["1767 году","1775 году","1785 году","1796 году"], c:2, z:""}
    ]},
    { type: "mc", q: "Почему выражение «просвещённый абсолютизм» не означает, что Екатерина II стремилась установить равноправие всех сословий?", opts: ["Потому что идеи Просвещения использовались в рамках самодержавной системы и сословных привилегий","Потому что в России не было ни школ, ни печати","Потому что Екатерина отказалась от любых административных преобразований"], c: 0,
      w: "Монарх мог проводить рациональные реформы и поддерживать образование, не отказываясь от самодержавия и сословной иерархии."}
    ]
  },
  { name: "Первая половина XIX века: восстанови хронологию", min: 10,
    brief: `<p>После смерти Екатерины II на престол вступил Павел I, а затем началось длительное правление Александра I (1801–1825). В первой половине XIX века Россия пережила Отечественную войну 1812 года, реформаторские проекты, восстание декабристов и усиление консервативного курса при Николае I (1825–1855).</p>
<ul>
<li><b>1803:</b> указ о вольных хлебопашцах — помещик мог отпустить крестьян с землёй по соглашению.</li>
<li><b>1812:</b> Отечественная война; вторжение армии Наполеона, Бородинское сражение, оставление Москвы и изгнание французских войск.</li>
<li><b>1815:</b> создание Царства Польского в составе личной унии с Российской империей; конституционные обещания Александра I.</li>
<li><b>1817–1818:</b> тайные общества будущих декабристов начинают оформляться.</li>
<li><b>1825:</b> восстание декабристов на Сенатской площади; начало правления Николая I.</li>
<li><b>1830–1831:</b> польское восстание.</li>
<li><b>1837–1841:</b> реформа государственных крестьян П. Д. Киселёва.</li>
<li><b>1842:</b> указ об обязанных крестьянах — помещик мог предоставить личную свободу с земельным наделом, сохраняя повинности по договору.</li>

LESSONS.net11 = {
  title: "Путь одного запроса", theme: "brand", ui: BRAND_UI,
  intro: `<p>Ты открываешь сайт в браузере. За доли секунды компьютер определяет адрес сервера, находит его в сети, устанавливает соединение и получает данные. За этой простой операцией стоят несколько уровней сетевой модели и разные типы адресов.</p>
<p>На занятии ты разберёшь стек TCP/IP, сопоставишь его с OSI, научишься различать IP, MAC и доменное имя, повторишь IPv4 и маски подсети, а затем восстановишь путь запроса к сайту.</p>
<p class="muted small sans">В заданиях встречаются реальные сетевые сценарии. Смотри, на каком уровне возникает проблема и какой протокол или адрес нужен именно в этой ситуации.</p>`,
  stages: [
  { name: "Четыре уровня TCP/IP и модель OSI", min: 8,
    brief: `<p>В учебной модели TCP/IP обычно выделяют четыре уровня. Модель OSI содержит семь уровней и помогает подробнее описывать сетевые функции.</p>
<table class="tt"><tr><th>TCP/IP</th><th>Соответствие OSI</th><th>Что делает</th></tr>
<tr><td>Прикладной</td><td>7–5 · прикладной, представления, сеансовый</td><td>Сетевые сервисы и форматы обмена</td></tr>
<tr><td>Транспортный</td><td>4 · транспортный</td><td>Обмен между приложениями, порты, TCP/UDP</td></tr>
<tr><td>Межсетевой</td><td>3 · сетевой</td><td>IP-адресация и маршрутизация пакетов</td></tr>

<p><b>Запомни:</b> TCP/IP — практический стек протоколов; OSI — эталонная модель для описания функций. Соответствие уровней приблизительное, а не полное совпадение.</p>`,

  { name: "IP, TCP, UDP и прикладные протоколы", min: 9,
    brief: `<p><b>IP</b> доставляет пакеты между сетями, но сам по себе не гарантирует доставку и порядок. За надёжную передачу потока данных может отвечать <b>TCP</b>: устанавливает соединение, подтверждает получение и повторно передаёт потерянные сегменты. <b>UDP</b> отправляет датаграммы без установления соединения и не гарантирует доставку или порядок — это полезно там, где важна скорость и допустима потеря отдельных пакетов.</p>
<p>Прикладные протоколы задают правила общения программ:</p>
<ul>
<li><b>HTTP</b> — передача веб-страниц и данных; защищённый вариант — HTTPS.</li>
<li><b>FTP</b> — передача файлов.</li>
<li><b>Telnet</b> — удалённый текстовый доступ без шифрования; для безопасного администрирования обычно используют SSH.</li>
<li><b>SMTP</b> — отправка электронной почты.</li>

</ul>`,

  { name: "MAC, IP и доменное имя", min: 9,
    brief: `<p>У устройства в сети могут одновременно использоваться разные адреса. Они отвечают на разные вопросы:</p>
<ul>
<li><b>MAC-адрес</b> — адрес сетевого интерфейса для доставки кадров в пределах канального сегмента. Обычно записывается шестью парами шестнадцатеричных символов, например <code>3C:52:82:1A:7B:90</code>.</li>
<li><b>IP-адрес</b> — логический адрес узла для обмена между сетями и маршрутизации, например <code>192.168.1.25</code>.</li>
<li><b>Доменное имя</b> — удобное для человека имя, например <code>example.com</code>; DNS помогает найти соответствующий IP-адрес.</li>
</ul>
<p>MAC не заменяет IP: кадр доставляется в пределах локального канала, а IP-пакет может пройти через несколько маршрутизаторов. Доменное имя, в свою очередь, не является физическим адресом устройства.</p>`,

  { name: "IPv4, маска и частные диапазоны", min: 10,
    brief: `<p><b>IPv4</b> — адрес длиной 32 бита. Его записывают как четыре октета, разделённые точками; каждый октет содержит 8 бит и принимает значение от 0 до 255.</p>
<ul>
<li><b>Маска подсети</b> отделяет сетевую часть адреса от узловой.</li>
<li><b>CIDR</b> записывает длину сетевой части после косой черты: <code>/24</code> означает 24 сетевых бита и 8 бит узла.</li>
<li><code>/24</code> соответствует маске <code>255.255.255.0</code>. В обычной IPv4-подсети это 256 адресов всего, обычно 254 адреса для устройств (адрес сети и широковещательный адрес не назначают узлам).</li>
<li>Частные диапазоны IPv4: <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Они используются внутри частных сетей и сами по себе не маршрутизируются в публичном интернете.</li>
</ul>`,

  { name: "Как устройство выходит на сайт", min: 9,

<li><b>ARP</b> помогает узнать MAC-адрес, соответствующий IPv4-адресу в локальном сегменте. Если адрес назначения находится вне локальной сети, устройство обычно узнаёт MAC шлюза по умолчанию.</li>

</ul>
<p>Упрощённый путь: получить настройки по DHCP → узнать IP сайта через DNS → определить MAC следующего узла через ARP → отправить кадр маршрутизатору → маршрутизаторы пересылают IP-пакет к серверу → сервер отвечает.</p>`,

        {type:"classify",title:"Найди функцию вне каждого класса",prompt:"Для каждого класса выбери функцию из системы, которая в него НЕ входит. Одну и ту же функцию можно использовать несколько раз.",bins:[{id:"f1",label:"f₁"},{id:"f2",label:"f₂"},{id:"f3",label:"f₃"}],items:[
          {t:"Вне T0",b:"f1",w:"f₁(0,0)=1, поэтому f₁ не сохраняет 0."},
          {t:"Вне T1",b:"f2",w:"f₂(1,1)=0, поэтому f₂ не сохраняет 1."},
          {t:"Вне S",b:"f1",w:"f₁ не самодвойственна: f₁(0,0)=1 и f₁(1,1)=1, а значения должны быть противоположными."},
          {t:"Вне L",b:"f1",w:"Полином Жегалкина f₁ содержит произведение xy."},
          {t:"Вне M",b:"f2",w:"При переходе (0,1) → (1,1) значение f₂ меняется с 1 на 0."}
        ]},
        {type:"mc",q:"Какой вывод следует из матрицы и критерия Поста для системы {f₁, f₂, f₃}?",opts:["Система полна: для каждого класса найдена функция, которая в него не входит","Система неполна: константа 1 делает любую систему неполной","Нельзя сделать вывод без построения полиномов для всех трёх функций"],c:0,w:"Система не содержится ни в одном из пяти классов: f₁ выводит систему из T0, S, L и M; f₂ — из T1. Следовательно, по критерию Поста система полна."}
      ]
    }
  ]
};

LESSONS.fin11 = {
  title:"Финансовый навигатор",theme:"brand",ui:BRAND_UI,
  intro:`<p>Ты проходишь короткий финансовый тренажёр. У героя есть доход, регулярные расходы и несколько целей. По ходу занятия предстоит распределить деньги, пережить непредвиденную ситуацию и разобраться, чем отличаются вклад, кредит и инфляция.</p>
  <p class="muted small sans">Это вводный урок по базовым понятиям, а не персональная финансовая рекомендация. Все суммы в задачах условные.</p>`,
  stages:[
    {name:"Доходы и расходы",min:8,brief:`<p><b>Доход</b> — деньги, которые поступают человеку. <b>Расход</b> — деньги, которые он тратит.</p><ul><li><b>Регулярные</b> расходы повторяются: связь, проездной, подписки.</li><li><b>Переменные</b> меняются от месяца к месяцу: продукты, развлечения, покупки.</li><li><b>Обязательные</b> связаны с базовыми потребностями и обязательствами; необязательные можно сократить или отложить.</li></ul>`,parts:[
      {type:"classify",title:"Разбери денежный поток",prompt:"Распредели операции по типам: деньги приходят или уходят?",bins:[{id:"in",label:"Доход"},{id:"out",label:"Расход"}],items:[
        {t:"Зарплата за месяц",b:"in",w:"Регулярный трудовой доход."},{t:"Оплата за выполненный фриланс-заказ",b:"in",w:"Доход от разовой работы."},{t:"Оплата мобильной связи",b:"out",w:"Регулярный расход."},{t:"Покупка компьютерной мыши",b:"out",w:"Разовый расход."},{t:"Проценты, начисленные по вкладу",b:"in",w:"Доход от размещения денег в банке."},{t:"Погашение ежемесячного платежа по кредиту",b:"out",w:"Обязательный денежный отток."}
      ]},
      {type:"classify",title:"Регулярное или переменное?",prompt:"Теперь классифицируй именно расходы.",bins:[{id:"r",label:"Регулярный расход"},{id:"v",label:"Переменный расход"}],items:[
        {t:"Фиксированная плата за интернет",b:"r",w:"Сумма обычно повторяется каждый месяц."},{t:"Покупка продуктов на неделю",b:"v",w:"Сумма зависит от набора покупок."},{t:"Ежемесячная подписка на сервис",b:"r",w:"Повторяющийся платёж."},{t:"Поход в кино или кафе",b:"v",w:"Необязательная трата, частота и сумма меняются."}
      ]}
    ]},
    {name:"Собери бюджет",min:11,brief:`<p>Бюджет — план доходов и расходов за определённый период.</p><p>У героя тренажёра доход <b>60 000 ₽</b>. Обязательные расходы — <b>31 000 ₽</b>, переменные — <b>17 000 ₽</b>. Остаток можно распределить между резервом, целью и дополнительными покупками.</p><p><b>Финансовая подушка</b> — запас денег на непредвиденные ситуации. Часто ориентируются на несколько месяцев обязательных расходов; точный размер зависит от обстоятельств.</p>`,parts:[
      {type:"mc",q:"Сколько остаётся после обязательных и переменных расходов?",opts:["12 000 ₽","22 000 ₽","8 000 ₽"],c:0,w:"60 000 − 31 000 − 17 000 = 12 000 ₽. Это остаток до распределения на цели и резерв."},
      {type:"order",title:"Приоритеты бюджета",prompt:"Расположи шаги разумного планирования бюджета от первого к последнему.",items:["Зафиксировать доход за месяц","Вычесть обязательные платежи и базовые расходы","Оценить переменные траты и найти то, что можно сократить","Определить сумму для резерва и финансовой цели","Оставшуюся сумму распределить на необязательные покупки"]}
    ]},
    {name:"Непредвиденная ситуация",min:14,brief:`<p>Финансовый план проверяется не только в обычный месяц. Представим, что у героя внезапно сломался ноутбук, а ремонт стоит <b>8 000 ₽</b>.</p><p>Резерв снижает вероятность того, что для срочной траты придётся брать дорогой кредит. Но использовать резерв нужно на действительно важные и непредвиденные расходы, а затем постепенно восстановить его.</p>`,parts:[
      {type:"dialog",title:"Разговор с финансовым консультантом",lead:"Ты помогаешь герою выбрать действия. После каждого решения консультант показывает последствия.",otherName:"Консультант",youName:"Ты",meterLabel:"Качество решений",finale:`<div class="note">Финансовая устойчивость строится не на запрете любых покупок, а на планировании, приоритетах и запасе на непредвиденные события.</div>`,rounds:[
        {who:"a",line:"Ноутбук сломался, ремонт стоит 8 000 ₽. На отдельном накопительном счёте есть 20 000 ₽. Что разумнее?",opts:[{t:"Оплатить ремонт из резерва, затем запланировать его пополнение",p:3,r:"Да. Это как раз непредвиденный необходимый расход.",n:"После ремонта в резерве осталось 12 000 ₽. В следующем месяце можно начать его восстанавливать."},{t:"Оформить микрозайм, а накопления не трогать ни при каких условиях",p:0,r:"Так можно получить переплату и дополнительные обязательства.",n:"После ремонта в резерве осталось 12 000 ₽. В следующем месяце можно начать его восстанавливать."},{t:"Потратить все накопления на новый дорогой ноутбук, не сравнивая варианты",p:0,r:"Сначала оцени необходимость и стоимость ремонта, а не трать весь запас автоматически.",n:"После ремонта в резерве осталось 12 000 ₽. В следующем месяце можно начать его восстанавливать."}]},
        {who:"a",line:"В следующем месяце доход снизился на 10%. Как действовать?",opts:[{t:"Пересмотреть переменные расходы, сохранить обязательные платежи и временно сократить необязательные покупки",p:3,r:"Верно: бюджет адаптируется к изменившемуся доходу.",n:"Теперь сравним кредит и вклад."},{t:"Сохранить прежние траты и закрыть разницу новым кредитом",p:0,r:"Кредит не должен автоматически закрывать регулярный дефицит бюджета.",n:"Теперь сравним кредит и вклад."},{t:"Перестать учитывать расходы — всё равно доход уже изменился",p:0,r:"Именно в нестабильный период учёт особенно полезен.",n:"Теперь сравним кредит и вклад."}]},
        {who:"a",line:"Что важно сравнить перед оформлением кредита?",opts:[{t:"Полную сумму возврата, ставку, срок, комиссии и последствия просрочки",p:3,r:"Да. Смотри не только на размер ежемесячного платежа, но и на полную стоимость кредита.",n:"И последнее: как оценить вклад на фоне инфляции?"},{t:"Только рекламируемый размер ежемесячного платежа",p:0,r:"Небольшой платёж может означать очень долгий срок и большую переплату.",n:"И последнее: как оценить вклад на фоне инфляции?"},{t:"Только цвет банковской карты и название тарифа",p:0,r:"Это не финансовые параметры договора.",n:"И последнее: как оценить вклад на фоне инфляции?"}]},
        {who:"a",line:"Вклад обещает 10% годовых, а инфляция за год составила 8%. Какой вывод точнее для упрощённого примера?",opts:[{t:"Номинальный доход есть, но реальный прирост покупательной способности будет примерно около 2%, а не 10%",p:3,r:"Верно. Для точного расчёта учитывают сложный процент и фактическую инфляцию.",n:"Тренажёр завершён: бюджет, резерв и понимание условий помогают принимать более взвешенные решения."},{t:"Деньги точно стали на 10% ценнее",p:0,r:"Проценты по вкладу нужно сопоставлять с ростом цен.",n:"Тренажёр завершён: бюджет, резерв и понимание условий помогают принимать более взвешенные решения."},{t:"Инфляция означает, что вклад полностью обесценился",p:0,r:"Если ставка выше инфляции, покупательная способность в упрощённом сравнении может вырасти.",n:"Тренажёр завершён: бюджет, резерв и понимание условий помогают принимать более взвешенные решения."}]}
      ]}
    ]},
    {name:"Финансовые термины",min:12,brief:`<p>Запомни разницу:</p><ul><li><b>Инфляция</b> — общий рост цен и снижение покупательной способности денег.</li><li><b>Кредит</b> — деньги, полученные на условиях возврата и оплаты процентов/иных предусмотренных договором платежей.</li><li><b>Вклад</b> — деньги, размещённые в банке на согласованных условиях; банк начисляет проценты.</li><li><b>Переплата</b> — сумма сверх полученной суммы кредита, которую заёмщик платит по договору.</li><li><b>Ликвидность</b> — насколько быстро актив можно превратить в деньги без существенной потери стоимости.</li></ul>`,parts:[
      {type:"classify",title:"Соедини термин и смысл",prompt:"Распредели определения по финансовым понятиям.",bins:[{id:"i",label:"Инфляция"},{id:"c",label:"Кредит"},{id:"d",label:"Вклад"},{id:"l",label:"Ликвидность"}],items:[
        {t:"Общий рост цен, из-за которого на ту же сумму можно купить меньше",b:"i",w:"Это инфляция."},{t:"Деньги, которые банк предоставляет с обязанностью вернуть их по договору",b:"c",w:"Это кредит."},{t:"Деньги, размещённые в банке для хранения и получения процентов",b:"d",w:"Это вклад."},{t:"Возможность быстро получить деньги от продажи актива без большой потери стоимости",b:"l",w:"Это ликвидность."}
      ]},
      {type:"mc",q:"Почему нельзя сравнивать два кредита только по ежемесячному платежу?",opts:["Потому что важны также срок, ставка, комиссии и полная сумма возврата","Потому что размер платежа вообще не имеет значения","Потому что у всех кредитов одинаковая стоимость"],c:0,w:"Нужно оценивать полную стоимость и условия договора, а не одну цифру."},
      {type:"num",title:"Посчитай переплату",prompt:"По договору человек получил 40 000 ₽. Общая сумма всех платежей по кредиту — 46 800 ₽. Сколько составит переплата?",items:[{a:"Переплата по кредиту",unit:"₽",ans:6800,show:"6 800 ₽",w:"46 800 − 40 000 = 6 800 ₽. Переплата — это сумма сверх полученной суммы кредита."}]}
    ]}
  ]
};

/* ============ 10 ноября · Информационная безопасность ============ */
LESSONS.ib8 = {
  title:"ServiceDesk Lite",theme:"brand",ui:BRAND_UI,
  intro:`<p>Ты работаешь на первой линии ServiceDesk небольшой IT-компании. Поступили три заявки: нужно защитить базу клиентов, журнал заявок и портал поддержки.</p>
  <p>Твоя задача — для каждого объекта определить требование, понять, что именно нарушено, подобрать одну-две подходящие меры и указать, как проверить результат.</p>
  <p class="muted small sans">Главная цепочка занятия: <b>объект → требование → проблема → мера → проверка</b>.</p>`,
  stages:[
    {name:"Объекты и требования",min:8,brief:`<p>Требование защиты зависит от того, что именно защищаем.</p><ul><li><b>Конфиденциальность</b> — доступ только у тех, кому он разрешён.</li><li><b>Целостность</b> — данные нельзя незаметно и неправомерно изменить.</li><li><b>Доступность</b> — система и информация доступны тогда, когда нужны.</li></ul>
    <p>В ServiceDesk Lite три объекта: база клиентов, журнал заявок и портал поддержки.</p>`,parts:[
      {type:"classify",title:"Назначь главное требование",prompt:"Для каждого объекта выбери свойство, которое в описанном сценарии важнее всего защитить.",bins:[{id:"c",label:"Конфиденциальность"},{id:"i",label:"Целостность"},{id:"a",label:"Доступность"}],items:[
        {t:"База клиентов: контакты, договоры и история обращений",b:"c",w:"Эти данные не должны попадать к посторонним."},{t:"Журнал заявок: статусы, исполнители и сроки",b:"i",w:"Важно, чтобы заявки и их статусы не подменяли без разрешения."},{t:"Портал поддержки: сотрудники создают и отслеживают заявки в течение рабочего дня",b:"a",w:"Сервис должен работать, иначе обращения не принимаются."}
      ]}
    ]},
    {name:"Определи нарушение",min:8,brief:`<p>Один объект может столкнуться с разными угрозами, но в каждой заявке есть конкретный симптом. Не путай сам объект с тем, что произошло.</p>`,parts:[
      {type:"classify",title:"Разбери три заявки",prompt:"Распредели инциденты по объекту, которому они непосредственно угрожают.",bins:[{id:"db",label:"База клиентов"},{id:"log",label:"Журнал заявок"},{id:"portal",label:"Портал поддержки"}],items:[
        {t:"Сотрудник отправил файл с контактами клиентов в общий чат, доступный внешним подрядчикам",b:"db",w:"Риск утечки конфиденциальной информации из базы клиентов."},{t:"Пользователь с обычной ролью изменил статус чужой заявки и удалил комментарий",b:"log",w:"Нарушена целостность журнала: изменения сделаны без нужных полномочий."},{t:"Портал перестал отвечать во время рабочего дня после резкого потока запросов",b:"portal",w:"Нарушена доступность сервиса."}
      ]},
      {type:"mc",q:"Что является корректной постановкой проблемы для ServiceDesk?",opts:["«Нужно купить самый дорогой антивирус»","«Обычный пользователь может менять чужие заявки; требуется ограничить изменение и фиксировать действия»","«Нужно сделать безопасность максимальной»"],c:1,w:"Проблема описывает объект, наблюдаемое нарушение и то, какое свойство оказалось под угрозой. Покупка конкретного средства — уже возможная мера."}
    ]},
    {name:"Выбери тип меры",min:8,brief:`<p>Меры защиты бывают четырёх типов:</p><ul><li><b>Правовые</b> — договоры, правила обработки данных, локальные политики, ответственность.</li><li><b>Организационные</b> — регламенты, обучение, назначение ответственных, порядок выдачи и отзыва доступа.</li><li><b>Технические</b> — физическая защита оборудования, контроль доступа в помещения, резервирование каналов и питания.</li><li><b>Программные</b> — роли и права в системе, MFA, шифрование, антивирус, журналирование, резервное копирование средствами ПО.</li></ul>`,parts:[
      {type:"classify",title:"Разложи меры защиты",prompt:"Определи, к какому типу относится каждая мера.",bins:[{id:"law",label:"Правовая"},{id:"org",label:"Организационная"},{id:"tech",label:"Техническая"},{id:"soft",label:"Программная"}],items:[
        {t:"Утвердить политику обработки и хранения клиентских данных",b:"law",w:"Локальный нормативный документ."},{t:"Назначить владельца базы и утвердить порядок согласования доступа",b:"org",w:"Это распределение ответственности и процедура."},{t:"Установить резервный источник питания для сервера",b:"tech",w:"Физическая инженерная мера."},{t:"Включить ролевую модель доступа и MFA",b:"soft",w:"Настройки реализуются средствами программной системы."},{t:"Проводить инструктаж сотрудников по работе с клиентскими данными",b:"org",w:"Обучение и регламент поведения."},{t:"Включить шифрование резервных копий",b:"soft",w:"Шифрование реализуется программными средствами."}
      ]}
    ]},
    {name:"Пять принципов защиты",min:7,brief:`<p>Хорошая система защиты опирается на пять принципов:</p><ul><li><b>Комплексность</b> — сочетать разные меры, а не надеяться на одну.</li><li><b>Соответствие ситуации</b> — учитывать конкретный объект, угрозу и возможный ущерб.</li><li><b>Минимальные права</b> — выдавать только те полномочия, которые нужны для работы.</li><li><b>Многоуровневость</b> — несколько рубежей защиты; отказ одного не должен сразу открывать всё.</li><li><b>Постоянный контроль</b> — следить за событиями, проверять настройки и пересматривать меры.</li></ul>`,parts:[

/* ============ 11 ноября · Математический аппарат: отношения и отображения ============ */
const mapFig = (A, B, pairs) => {
  const n = Math.max(A.length, B.length), H = 30 + n * 34;
  const ya = i => 24 + i * 34 + (n - A.length) * 17, yb = j => 24 + j * 34 + (n - B.length) * 17;
  return `<svg viewBox="0 0 260 ${H}" style="width:100%;max-width:260px;display:block;margin:6px 0">
  <defs><marker id="mfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b67d6"/></marker></defs>
  <ellipse cx="50" cy="${H/2}" rx="34" ry="${H/2-4}" fill="#f4f6fa" stroke="#9aa0aa"/><ellipse cx="210" cy="${H/2}" rx="34" ry="${H/2-4}" fill="#f4f6fa" stroke="#9aa0aa"/>
  <text x="50" y="12" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5f636b">A</text><text x="210" y="12" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5f636b">B</text>
  ${pairs.map(([i,j]) => `<line x1="62" y1="${ya(i)}" x2="196" y2="${yb(j)}" stroke="#3b67d6" stroke-width="2" marker-end="url(#mfa)"/>`).join("")}
  ${A.map((a,i) => `<circle cx="50" cy="${ya(i)}" r="4" fill="#222"/><text x="40" y="${ya(i)+4}" text-anchor="end" font-size="12" font-family="sans-serif">${a}</text>`).join("")}
  ${B.map((b,j) => `<circle cx="210" cy="${yb(j)}" r="4" fill="#222"/><text x="220" y="${yb(j)+4}" font-size="12" font-family="sans-serif">${b}</text>`).join("")}
  </svg>`;
};
const DIV = [1,2,3,4].map(x => [1,2,3,4].map(y => y % x === 0));
const PERM = (name, row) => `<table class="tt" style="display:inline-table;margin:4px 14px 4px 0"><tr><th rowspan="2">${name}</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr>${row.map(v=>`<td><b>${v}</b></td>`).join("")}</tr></table>`;
const SIGTAU = PERM("σ", [2,4,1,3]) + PERM("τ", [2,1,4,3]);

<p class="muted small sans">Перед каждым заданием есть теория — всё нужное для ответов там есть. Каждый этап засчитывается с первой попытки, после проверки ты увидишь разбор. В конце результат сам отправится преподавателю.</p>`,
  stages: [
  { name: "Отношение как множество пар", min: 9,

<li><b>Бинарное отношение</b> R на множестве A — любое подмножество A × A. Запись x R y означает (x, y) ∈ R.</li>
<li>Отношение можно задать <b>списком пар</b>, <b>матрицей</b> (1 в клетке (x, y), если x R y) или <b>графом</b> (стрелка x → y).</li>
<li>На множестве из n элементов всего n² пар, а каждое отношение — это выбор, какие пары взять. Поэтому отношений 2^(n²).</li>
</ul>
<div class="note"><b>Пример CRM:</b> каналы C = {email, SMS}, сегменты S = {новые, VIP, спящие}. C × S содержит 2 · 3 = 6 пар: (email, новые), (email, VIP), … Каждая пара — возможный вариант рассылки.</div>`,

    { type: "grid", title: "Матрица отношения «x делит y»", cols: ["y = 1","y = 2","y = 3","y = 4"],

  { name: "Свойства отношений", min: 12,
    brief: `<p>Отношение R на множестве A может обладать свойствами:</p>
<ul>
<li><b>Рефлексивность:</b> x R x для любого x. В матрице — вся диагональ из единиц.</li>
<li><b>Симметричность:</b> если x R y, то y R x. Матрица симметрична относительно диагонали.</li>
<li><b>Антисимметричность:</b> если x R y и y R x, то x = y. Иначе: для разных x и y не может быть пары в обе стороны. Если таких «встречных» пар нет вообще — свойство выполнено.</li>

/* ============ 16 ноября · Иностранный язык в проф. деятельности: стендап ============ */
LESSONS.stand16 = {
  title: "Stand-up in English", theme: "brand", ui: BRAND_UI,
  intro: `<p>В прошлый раз ты представлял себя и свою профессию. Сегодня — главный ежедневный ритуал IT-команды: <b>стендап</b>, короткая утренняя встреча, где каждый рассказывает, что сделал, что будет делать и что мешает. В международных командах она проходит на английском.</p>
<p>Ты разберёшь формат стендапа, грамматику для отчётов, послушаешь апдейты коллег, оформишь баг-репорт и проведёшь свой стендап.</p>
<p class="muted small sans">В задании на аудирование нажимай «▶ Послушать» — фразу прочитает браузер. Если звука нет, нажми «показать текст». Каждый этап засчитывается с первой попытки. В конце результат сам отправится преподавателю.</p>`,
  stages: [
  { name: "Три вопроса стендапа", min: 7,
    brief: `<p>Стендап (daily stand-up, daily scrum) длится около 15 минут. Каждый участник отвечает на три вопроса:</p>
<ol>
<li><b>What did I do yesterday?</b> — что я сделал вчера.</li>
<li><b>What will I do today?</b> — что буду делать сегодня.</li>
<li><b>Are there any blockers?</b> — что мне мешает (blocker — препятствие, без которого не продвинуться).</li>
</ol>
<p>Полезные фразы:</p>
<ul>
<li><i>Yesterday I finished… / I've fixed… / I reviewed…</i></li>
<li><i>Today I'm going to… / I'll work on… / I plan to…</i></li>
<li><i>I'm blocked by… / I'm waiting for… / I need help with…</i> — <i>No blockers.</i></li>
</ul>`,
    parts: [
    { type: "drag", title: "Sort the updates", prompt: "Разложи фразы по трём частям стендапа.",
      bins: [{id:"y",label:"Yesterday"},{id:"t",label:"Today"},{id:"b",label:"Blockers"}],
      items: [
        {t:"I finished the login page.", b:"y", w:"Прошедшее время — уже сделано."},
        {t:"I've fixed two bugs in the payment form.", b:"y", w:"Результат к моменту стендапа."},
        {t:"I'm going to write unit tests for the cart.", b:"t", w:"План на сегодня."},
        {t:"I'll review Anna's pull request.", b:"t", w:"План на сегодня."},
        {t:"I'm waiting for access to the test server.", b:"b", w:"Без доступа работа стоит."},
        {t:"The API documentation is missing, so I can't continue.", b:"b", w:"Препятствие."},
        {t:"I reviewed the design mockups with the designer.", b:"y", w:"Уже сделано."}
      ]}
    ]
  },
  { name: "Grammar for reports", min: 9,
    brief: `<ul>
<li><b>Past Simple</b> — действие закончилось, есть указание на время: <i>I <b>fixed</b> the bug <b>yesterday</b>.</i></li>
<li><b>Present Perfect</b> (have/has + 3-я форма) — важен результат сейчас, время не названо: <i>I<b>'ve merged</b> the branch.</i> Нельзя: <s>I've fixed it yesterday</s>.</li>
<li><b>Present Continuous</b> — действие в процессе: <i>I<b>'m working</b> on the search feature.</i></li>
<li><b>going to / will</b> — планы: <i>I'm <b>going to</b> deploy it today. I<b>'ll</b> ask the team lead.</i></li>
</ul>
<p>Глаголы IT-команды: <b>fix</b> — исправить, <b>deploy</b> — выкатить на сервер, <b>merge</b> — слить ветки, <b>review</b> — проверить код, <b>test</b> — протестировать, <b>reproduce</b> — воспроизвести ошибку.</p>`,
    parts: [
    { type: "fill", title: "Choose the right form",
      items: [
        {a:"Yesterday I ___ the bug in the login form.", o:["fixed","have fixed","am fixing"], c:0, z:""},
        {a:"Good news: I ___ the new version — you can check it now.", o:["deploy","have deployed","deployed yesterday"], c:1, z:""},
        {a:"Right now I ___ on the search feature.", o:["work","worked","am working"], c:2, z:""},
        {a:"Today I ___ write tests for the cart.", o:["am going to","went to","have gone"], c:0, z:""},
        {a:"I can't ___ the error on my computer — it works fine for me.", o:["reproduce","deploy","merge"], c:0, z:""},
        {a:"Please ___ my pull request before lunch.", o:["review","reproduce","crash"], c:0, z:""}
      ]}
    ]
  },
  { name: "Listen to the team", min: 9,
    brief: `<p>Сейчас ты услышишь апдейты коллег на утреннем стендапе. Нажми «▶ Послушать» (можно несколько раз) и ответь на вопрос. Если звук не работает, нажми «показать текст».</p>`,
    parts: [
    { type: "listen", title: "Morning stand-up", prompt: "Послушай каждого участника и ответь на вопрос.",
      items: [
        {say:"Hi, it's Tom. Yesterday I finished the registration form. Today I'm going to connect it to the database. No blockers.", q:"Что Том будет делать сегодня?", opts:["Подключать форму к базе данных","Делать форму регистрации","Чинить базу данных"], c:0, w:"«Today I'm going to connect it to the database»."},
        {say:"Hello, Maria here. I'm blocked. I'm waiting for the designer to send the new icons.", q:"Что мешает Марии?", opts:["Нет доступа к серверу","Она ждёт новые иконки от дизайнера","Она заболела"], c:1, w:"«Waiting for the designer to send the new icons»."},
        {say:"This is Alex. I've fixed three bugs in the payment page, and I've deployed the fix to the test server.", q:"Куда Алекс выкатил исправление?", opts:["На рабочий сервер","На тестовый сервер","Никуда"], c:1, w:"«Deployed the fix to the test server»."},
        {say:"Kate speaking. The app crashes when you upload a big photo. I can reproduce it every time.", q:"Что сообщает Кейт?", opts:["Приложение падает при загрузке большой фотографии, ошибка воспроизводится","Приложение работает медленно","Фото не загружаются только у неё"], c:0, w:"crash — аварийно завершаться, reproduce — воспроизвести."},
        {say:"It's Dan. Today I'll review Kate's pull request and then I'll update the documentation.", q:"Что Дэн сделает сначала?", opts:["Обновит документацию","Проверит пулл-реквест Кейт","Исправит баг"], c:1, w:"«First review…, then update the documentation»."}
      ]}
    ]
  },
  { name: "Bug report", min: 10,
    brief: `<p>Баг-репорт — сообщение об ошибке, по которому разработчик может её найти и исправить. Стандартные разделы:</p>
<ul>
<li><b>Title</b> — короткое описание: <i>App crashes when uploading a photo larger than 10 MB</i>.</li>
<li><b>Steps to reproduce</b> — шаги: <i>1. Open the profile. 2. Click "Upload photo". 3. Choose a 12 MB file.</i></li>
<li><b>Expected result</b> — что должно было произойти.</li>
<li><b>Actual result</b> — что произошло на самом деле.</li>
<li><b>Environment</b> — где: устройство, ОС, браузер, версия приложения.</li>
<li><b>Severity</b> — серьёзность: <i>critical, major, minor</i>.</li>
</ul>`,
    parts: [
    { type: "classify", title: "Which section?", prompt: "Определи раздел баг-репорта для каждой строки.",
      bins: [{id:"t",label:"Title"},{id:"s",label:"Steps"},{id:"e",label:"Expected"},{id:"a",label:"Actual"},{id:"v",label:"Environment"}],
      items: [
        {t:"Login button does nothing on the mobile version", b:"t", w:"Коротко и по сути — заголовок."},
        {t:"1. Open the site on a phone. 2. Enter email and password. 3. Tap \"Log in\".", b:"s", w:"Шаги воспроизведения."},
        {t:"The user is logged in and sees the dashboard.", b:"e", w:"Как должно быть."},
        {t:"Nothing happens. No error message is shown.", b:"a", w:"Что происходит на самом деле."},
        {t:"iPhone 13, iOS 18, Safari, app version 2.4.1", b:"v", w:"Окружение."}
      ]},
    { type: "mc", q: "Какой заголовок баг-репорта лучше?", opts: ["Bug!!!","Something is wrong with the site","Cart total is not updated after removing an item"], c: 2,
      w: "Хороший заголовок говорит, где и что именно не работает." }
    ]
  },
  { name: "Your stand-up", min: 10,
    brief: `<p>Твоя очередь. Сначала тимлид проведёт короткий стендап и задаст пару вопросов, а потом ты напишешь свой апдейт.</p>`,
    parts: [
    { type: "dialog", title: "Daily stand-up", lead: "Выбери лучший ответ. За каждый — до 3 баллов.", otherName: "Team lead", youName: "You", meterLabel: "Clarity",
      finale: `<div class="note"><b>Great job!</b> Хороший апдейт короткий, конкретный и честно называет блокеры.</div>`,
      rounds: [
        {who:"a", line:"Good morning! What did you do yesterday?", opts:[
          {t:"Yesterday I finished the search filter and wrote tests for it.", p:3, r:"Great, thanks."},
          {t:"I have finished the search filter yesterday.", p:1, r:"OK… (С yesterday нужен Past Simple: I finished.)"},
          {t:"Many things.", p:0, r:"Could you be more specific?"}]},
        {who:"a", line:"And what are your plans for today?", opts:[
          {t:"Today I'm going to fix the sorting bug and update the docs.", p:3, r:"Sounds good."},
          {t:"Today I fixed the sorting bug.", p:1, r:"Today… fixed? You mean you're going to fix it?"},
          {t:"I don't know yet.", p:0, r:"Please plan your day before the stand-up."}]},
        {who:"a", line:"Any blockers?", opts:[
          {t:"Yes, I'm waiting for access to the staging server. Could you help me with that?", p:3, r:"Sure, I'll ask the admin right after the meeting."},
          {t:"No.", p:1, r:"OK. (Можно, но если блокер есть, о нём важно сказать.)"},
          {t:"Everything is bad.", p:0, r:"Can you explain what exactly?"}]},
        {who:"a", line:"Kate found a crash in the app. Can you take a look?", opts:[
          {t:"Sure. I'll try to reproduce it and update the bug report today.", p:3, r:"Perfect, thank you!"},
          {t:"It's not my bug.", p:0, r:"We're one team…"},
          {t:"Yes, I will crash it.", p:0, r:"I hope not! (crash — падать; нужно reproduce — воспроизвести.)"}]}
      ]},
    { type: "text", title: "Write your stand-up", min: 120, ph: "Yesterday I…\nToday I'm going to…\nBlockers: …",
      prompt: "Напиши свой стендап на английском: 3–4 предложения по схеме yesterday → today → blockers. Можно о реальной учёбе: что сделал по учебному проекту вчера, что будешь делать сегодня и что мешает." }
    ]
  }
  ]
};

LESSONS.sw6 = {
  title: "Коммутатор: настройка вживую", theme: "brand", ui: BRAND_UI,
  intro: `<p>На встрече вы разбираете настройку управления коммутатором на бумаге. Здесь — <b>консоль коммутатора</b>, похожая на Cisco IOS: ты сам введёшь команды, увидишь реакцию устройства и настроишь удалённое управление по SSH.</p>
<p>Сначала разберёмся, зачем коммутатору IP-адрес и как выбрать его в подсети, освоим режимы консоли, затем настройка и разбор типичных неисправностей.</p>
<p class="muted small sans">Перед каждым заданием есть теория. Каждый этап засчитывается с первой попытки, после проверки ты увидишь разбор. В конце результат сам отправится преподавателю.</p>`,
  stages: [
  { name: "Зачем коммутатору IP", min: 7,
    brief: `<ul>
<li>Коммутатор пересылает кадры по <b>MAC-адресам</b> — для этого IP ему не нужен.</li>
<li>IP-адрес нужен, чтобы <b>управлять</b> коммутатором по сети. Его назначают виртуальному интерфейсу VLAN (SVI), например <code>interface vlan 1</code> или отдельному VLAN управления.</li>
<li>Адрес управления выбирают из <b>подсети администраторов</b>, а <b>шлюз по умолчанию</b> (<code>ip default-gateway</code>) нужен, чтобы коммутатор отвечал администраторам из других подсетей.</li>
</ul>
<p>Способы управления:</p>
<ul>

/* ============ 17 ноября · ОИБ: TaskFlow — что защищаем и кто что может ============ */
LESSONS.tf8 = {
  title: "TaskFlow: кто что может", theme: "brand", ui: BRAND_UI,
  intro: `<p>На встрече вы пишете требования безопасности для сервиса TaskFlow. Здесь разберёшь то, на чём держатся хорошие требования: <b>какое свойство информации</b> важнее для каждого объекта, <b>какие права</b> нужны каждой роли по принципу минимальных привилегий, чем проверяемое требование отличается от пожелания и <b>как</b> каждое требование проверить.</p>
<p class="muted small sans">TaskFlow — сервис задач. Роли: клиент (создаёт заявки), поддержка (обрабатывает заявки клиентов), разработчик (выполняет назначенные ему задачи), администратор (управляет учётными записями и сервером). Каждый этап засчитывается с первой попытки. В конце результат сам отправится преподавателю.</p>`,
  stages: [
  { name: "К, Ц или Д?", min: 9,
    brief: `<p>Три свойства информации, которые защищают:</p>
<ul>
<li><b>Конфиденциальность (К)</b> — информацию видят только те, кому положено. Нарушение: утечка, подсмотрели, украли.</li>
<li><b>Целостность (Ц)</b> — информацию не изменили незаметно и без права. Нарушение: подмена, удаление, тайное исправление.</li>
<li><b>Доступность (Д)</b> — информация доступна, когда нужна. Нарушение: сервис упал, данные потеряны без копии, доступ заблокирован.</li>
</ul>
<p>Для каждого объекта важны все три, но одно обычно <b>критичнее</b>. От этого зависит, какие требования писать в первую очередь.</p>`,
    parts: [
    { type: "classify", title: "Что нарушено?", prompt: "Определи, какое свойство нарушено в каждом инциденте.",
      bins: [{id:"k",label:"Конфиденциальность"},{id:"c",label:"Целостность"},{id:"d",label:"Доступность"}],
      items: [
        {t:"Список клиентов с телефонами выложили в открытый чат", b:"k", w:"Информацию увидели посторонние."},
        {t:"Кто-то тайно поменял срок задачи, и в истории изменений этого нет", b:"c", w:"Незаметное изменение."},
        {t:"Сервер TaskFlow лежал весь рабочий день", b:"d", w:"Сервис недоступен."},
        {t:"Разработчик прочитал чужие заявки клиентов с паспортными данными", b:"k", w:"Доступ без необходимости."},
        {t:"После сбоя диска задачи за месяц пропали, резервной копии не было", b:"d", w:"Потеря данных без возможности восстановить."},
        {t:"Злоумышленник изменил сумму в счёте, прикреплённом к заявке", b:"c", w:"Подмена данных."}
      ]},
    { type: "fill", title: "Главное свойство объекта", prompt: "Выбери, какое свойство для объекта TaskFlow критичнее всего.",
      items: [
        {a:"Пароли пользователей", o:["К","Ц","Д"], c:0, z:""},
        {a:"Журнал аудита (кто, что и когда изменил)", o:["К","Ц","Д"], c:1, z:""},
        {a:"Работа сервиса в рабочее время", o:["К","Ц","Д"], c:2, z:""},
        {a:"Вложения клиентов с договорами", o:["К","Ц","Д"], c:0, z:""},
        {a:"Статусы и сроки задач", o:["К","Ц","Д"], c:1, z:""}
      ]}
    ]
  },
  { name: "Минимальные привилегии", min: 10,
    brief: `<p><b>Принцип минимальных привилегий:</b> каждая роль получает только те права, без которых не может выполнить свою работу. Лишнее право — лишний риск: его могут украсть вместе с учётной записью или использовать по ошибке.</p>
<p>В TaskFlow договорились так:</p>
<ul>
<li><b>Клиент</b> видит и создаёт только свои заявки.</li>
<li><b>Поддержка</b> обрабатывает заявки всех клиентов, но не трогает разработку и учётные записи.</li>
<li><b>Разработчик</b> видит только назначенные ему задачи и меняет их статус. Заявки всех клиентов с личными данными ему не нужны.</li>
<li><b>Администратор</b> создаёт и удаляет учётные записи и обслуживает сервер. Читать содержимое заявок и менять статусы задач ему для работы не нужно.</li>

</ul>`,

    { type: "mc", q: "Разработчик просит дать ему доступ ко всем заявкам клиентов, «чтобы быстрее разбираться». Что ответить?", opts: ["Отказать: пусть поддержка назначает ему конкретные заявки — так он видит только нужное","Дать: разработчикам можно доверять","Дать права администратора, чтобы больше не просил"], c: 0, w: "Удобство не повод нарушать минимальные привилегии." }
    ]
  },
  { name: "Требование или пожелание?", min: 9,
    brief: `<p>Хорошее требование безопасности:</p>
<ul>
<li><b>конкретное</b> — понятно, что именно должно быть: какие данные, какие роли, какие числа;</li>
<li><b>проверяемое</b> — можно провести тест и однозначно сказать «выполнено» или «нет»;</li>
<li><b>обоснованное</b> — понятно, от какой угрозы защищает.</li>
</ul>
<div class="note"><b>Плохо:</b> «Система должна быть защищённой».<br><b>Хорошо:</b> «После 5 неверных вводов пароля подряд учётная запись блокируется на 15 минут».</div>
<p>Требования должны покрывать не только пароль: доступ, целостность данных, восстановление после сбоя.</p>`,

        {t:"Каждое изменение статуса задачи записывается в журнал: кто, когда, что было и что стало", b:"y", w:"Проверяется изменением статуса и поиском записи."},

/* ============ 17 ноября · Математический аппарат: множества в Python ============ */
LESSONS.pyset11 = {
  title: "Множества: от диаграммы к коду", theme: "brand", ui: BRAND_UI,
  intro: `<p>На встрече вы решаете практическую работу по трём спискам ID и проверяете ответы кодом. Здесь — тренировка навыков, которые для этого нужны: предсказывать результат операций над множествами в Python, читать диаграммы Венна для трёх множеств, применять формулу включений-исключений, ловить типичные ошибки в коде и считать подмножества.</p>
<p class="muted small sans">Каждый этап засчитывается с первой попытки, после проверки ты увидишь разбор. В конце результат сам отправится преподавателю.</p>`,
  stages: [
  { name: "Операции в Python", min: 9,
    brief: `${PCODE(`A = {1, 2, 3, 4}
B = {3, 4, 5}

A | B     # объединение      {1, 2, 3, 4, 5}
A & B     # пересечение      {3, 4}
A - B     # разность A \\ B  {1, 2}
A ^ B     # симметрическая разность (в одном, но не в обоих)  {1, 2, 5}
B <= A    # B — подмножество A?   False
3 in A    # принадлежность        True
len(A)    # мощность (число элементов) 4
set()     # пустое множество; {} — это пустой СЛОВАРЬ!`)}

    parts: [
    { type: "str", title: "Предскажи результат", prompt: "Пиши множества в фигурных скобках по возрастанию, например {1, 2}. Логические значения — True или False.", fig: PCODE(`X = {2, 4, 6, 8}

  { name: "Три множества на диаграмме", min: 9,
    brief: `<p>Три круга делят универсум на 8 областей. Например, «в A и B, но не в C» — это одна область: пересечение A и B вне круга C.</p>

<li><b>(A ∩ B) \\ C</b> — в A и в B, но не в C.</li>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };

/* время: берём с сервера, если не вышло — с устройства */
let clockShift = 0;
async function syncClock(){
  try {
    const r = await fetch(location.href.split("#")[0], {method:"HEAD", cache:"no-store"});
    const d = r.headers.get("Date");
    if (d) clockShift = new Date(d).getTime() - Date.now();
  } catch(e) {}
}
const now = () => Date.now() + clockShift;
function mskTime(hm, date){ // момент по Москве (UTC+3)
  if (!hm) return null;
  const [y,m,d] = (date || CONFIG.DATE).split("-").map(Number); const [h,mi] = hm.split(":").map(Number);
  return Date.UTC(y, m-1, d, h-3, mi);
}
const localHM = t => new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

  if (p.type === "dnf") return 2;

  if (p.type === "num") return p.items.length;
  if (p.type === "proofread") return (p.text.match(/\[\[/g) || []).length;
  if (p.type === "pivot") return p.qs.length;
  if (p.type === "grid") return p.rows.length * p.cols.length;
  if (p.type === "budget") return p.risks.length + p.bonus;
  if (p.type === "audit") return p.rows.length + p.rows.filter(r => r.err).length;
  if (p.type === "classify" || p.type === "drag" || p.type === "order" || p.type === "dragorder" || p.type === "fill") return p.items.length;
  if (p.type === "hotspot") return 2;
  if (p.type === "dialog") return p.rounds.length * 3;
  if (p.type === "str") return p.items.length;
  if (p.type === "atom") return p.targets.length;
  if (p.type === "huffman") return p.items.length - 1;
  if (p.type === "scene") return p.rounds.length * 3;
  if (p.type === "drag" || p.type === "dragorder") return p.items.length;
  if (p.type === "hotspot") return 2;
  if (p.type === "cdquest") return p.tasks.length;
  if (p.type === "build") return p.rules.length;
  if (p.type === "shell") return p.qs.length;
  if (p.type === "galv" || p.type === "stack") return p.tasks.length;
  if (p.type === "listen") return p.items.length;
  if (p.type === "bond") return p.tasks.length * 2;
  if (p.type === "ios") return p.goals.length;
  if (p.type === "rowpick" || p.type === "parity2d") return p.tasks.length;
  if (p.type === "netlab") return p.qs.length;
  if (p.type === "mc") return 1;

}

ios(p, el, done){

galv(p, el, done){

        <rect x="80" y="30" width="18" height="115" fill="#9aa0aa"/><rect id="ly" x="${80 - 6*fr}" y="${145 - 80*Math.min(fr,1)}" width="${18 + 12*fr}" height="${80*Math.min(fr,1)}" fill="${T.col || "#c46a3a"}"/>
        <rect x="222" y="30" width="18" height="115" fill="${T.col || "#c46a3a"}"/>
        <text x="89" y="22" text-anchor="middle" font-weight="700">− катод</text><text x="231" y="22" text-anchor="middle" font-weight="700">+ анод</text>
        <text x="160" y="125" text-anchor="middle" fill="#1d2635">${T.ion}</text>
      </svg>
      <div class="refcard"><div class="rf"><span>${T.ask === "I" ? "Сила тока I" : "Время t"}</span><b id="vv">${T.ask === "I" ? fmt(val,1) + " А" : val + " мин"}</b></div>

      <div class="rf"><span>Осело ${T.metal}</span><b id="vm">${fmt(m)} г из ${fmt(T.m)} г</b></div></div>
      <div id="w"></div>${checked ? "" : `<button class="btn" id="ck">Проверить</button>`}`;
      const sl = $("#sl");
      sl.oninput = () => {
        val = +sl.value; const m2 = mass(), f2 = Math.min(1.25, m2 / T.m);
        $("#vv").textContent = T.ask === "I" ? fmt(val,1) + " А" : val + " мин";
        $("#vm").textContent = `${fmt(m2)} г из ${fmt(T.m)} г`;
        const ly = $("#ly"); ly.setAttribute("x", 80 - 6*f2); ly.setAttribute("y", 145 - 80*Math.min(f2,1)); ly.setAttribute("width", 18 + 12*f2); ly.setAttribute("height", 80*Math.min(f2,1));
      };

        $("#nx").onclick = () => { k++; scrollTo(0,0); one(); };
      } else $("#ck").onclick = () => { checked = true; if (Math.abs(mass() - T.m) / T.m <= (T.tol || 0.03)) got++; draw(); };
    };
    draw();
  };
  one();
},
stack(p, el, done){
  const PAIR = {")":"(", "]":"[", "}":"{"};
  let k = 0, got = 0;
  const one = () => {
    if (k >= p.tasks.length) return done(got);
    const s = p.tasks[k]; let i = 0, st = [], mist = 0, broken = "", over = false, msg = "";
    const draw = () => {
      const ch = s[i], end = i >= s.length || broken;
      el.innerHTML = `<span class="tag">Стек · строка ${k+1} из ${p.tasks.length}</span><h2>${p.title}</h2><p>${p.prompt}</p>
      <div class="stk-str">${[...s].map((c,j)=>`<span class="${j < i ? "dn" : j === i && !end ? "cur" : ""}">${esc(c)}</span>`).join("")}</div>
      <div class="stk-wrap"><div class="stk">${st.length ? st.slice().reverse().map((c,j)=>`<div class="${j===0?"top":""}">${esc(c)}${j===0?" <small>← вершина</small>":""}</div>`).join("") : `<div class="empty">стек пуст</div>`}</div>
      <div class="stk-act">${over ? "" : end
        ? `<p class="sans small"><b>${broken || "Строка закончилась."}</b> Твой вердикт:</p><button class="opt" data-a="ok">Скобки расставлены корректно</button><button class="opt" data-a="bad">Скобки расставлены некорректно</button>`
        : `<p class="sans small">Текущий символ: <b style="font-size:20px">${esc(ch)}</b></p><button class="opt" data-a="push">stack.append("${esc(ch)}") — положить</button><button class="opt" data-a="pop">stack.pop() — снять и сравнить</button>`}
        <div class="sans small" style="min-height:22px">${msg}</div></div></div><div id="w"></div>`;
      el.querySelectorAll(".opt").forEach(b => b.onclick = () => act(b.dataset.a));
    };
    const act = a => {
      msg = "";
      if (a === "ok" || a === "bad") {
        const valid = !broken && st.length === 0, right = (a === "ok") === valid;
        over = true; const pts = right && mist === 0; if (pts) got++;
        draw();
        $("#w").innerHTML = `<div class="note"><b>${pts ? "Верно!" : right ? "Вердикт верный, но были ошибки в действиях." : "Вердикт неверный."}</b> ${valid ? "Каждой закрывающей скобке нашлась пара, и стек в конце пуст." : broken ? broken : "Строка закончилась, а в стеке остались открывающие скобки без пары."}</div><p></p><button class="btn" id="nx">${k+1 < p.tasks.length ? "Следующая строка →" : "Дальше →"}</button>`;
        $("#nx").onclick = () => { k++; one(); };
        return;
      }
      const ch = s[i], open = !PAIR[ch];
      if (a === "push") {
        if (!open) { mist++; msg = `<span style="color:var(--red)">Закрывающую скобку не кладут в стек — её сравнивают с вершиной.</span>`; return draw(); }
        st.push(ch); i++;
      } else {
        if (open) { mist++; msg = `<span style="color:var(--red)">Открывающую скобку кладут в стек, а не снимают.</span>`; return draw(); }
        if (!st.length) broken = `Стек пуст: для «${ch}» на позиции ${i+1} нет открывающей пары.`;
        else { const top = st.pop(); if (top !== PAIR[ch]) broken = `На вершине «${top}», а пришла «${ch}» — пара не совпадает.`; else msg = `Сняли «${top}» — пара к «${ch}» совпала.`; }
        i++;
      }
      draw();
    };
    draw();
  };
  one();
},
cdquest(p, el, done){
  const T = p.tree, HOME = p.home;
  let k = 0, got = 0;
  const kids = path => { let n = T; for (const s of path) n = n[s]; return n; };
  const isDir = path => { let n = T; for (const s of path){ if (!n || typeof n !== "object" || !(s in n) || n[s] === null) return false; n = n[s]; } return true; };
  const abs = path => "/" + path.join("/");
  const short = path => { const a = abs(path), h = abs(HOME); return a === h ? "~" : a.startsWith(h + "/") ? "~" + a.slice(h.length) : a; };
  const resolve = (cwd, arg) => {
    let base;
    if (!arg || arg === "~") return HOME.slice();
    if (arg.startsWith("/")) base = [];
    else if (arg.startsWith("~/")) { base = HOME.slice(); arg = arg.slice(2); }
    else base = cwd.slice();
    for (const s of arg.split("/")) {
      if (!s || s === ".") continue;
      if (s === "..") { base.pop(); continue; }
      base.push(s);
      if (!isDir(base)) return null;
    }
    return base;
  };
  const one = () => {
    if (k >= p.tasks.length) return done(got);
    const task = p.tasks[k]; let cwd = task.from.slice(), used = 0, fin = false;
    el.innerHTML = `<span class="tag">Терминал · задание ${k+1} из ${p.tasks.length}</span><h2>${p.title}</h2>
      <div class="note">${task.t}<br><span class="small">Лимит: <b>${task.limit}</b> ${task.limit === 1 ? "команда" : "команды"} cd. Команды <code>ls</code> и <code>pwd</code> не считаются.</span></div><p></p>
      <div class="term" id="term"><div id="tl"></div><div class="tin"><span id="pr"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Команда"></div></div>
      <p class="small muted sans">Команды: <code>ls</code> — содержимое каталога, <code>pwd</code> — где я, <code>cd путь</code> — перейти. Вводи и нажимай Enter.</p>
      <div id="w"></div><button class="link sans small" id="sk">Не получается — показать ответ</button>`;
    const tl = $("#tl"), inp = $("#cmd");
    const pr = () => $("#pr").textContent = `student@college:${short(cwd)}$ `;
    const out = (t, cls) => { tl.insertAdjacentHTML("beforeend", `<div class="${cls || ""}">${esc(t)}</div>`); $("#term").scrollTop = 1e6; };
    const finish = (ok, shown) => {
      fin = true; inp.disabled = true; if (ok) got++;
      $("#sk").remove();
      $("#w").innerHTML = `<div class="note"><b>${ok ? "Готово!" : shown ? "Ответ:" : "Добрался, но с превышением лимита."}</b> ${task.w}</div><p></p><button class="btn" id="nx">${k+1 < p.tasks.length ? "Следующее задание →" : "Дальше →"}</button>`;
      $("#nx").onclick = () => { k++; one(); };
    };
    pr(); out(`Ты в каталоге ${abs(cwd)}`, "dim");
    inp.onkeydown = e => {
      if (e.key !== "Enter" || fin) return;
      const raw = inp.value.trim(); inp.value = ""; if (!raw) return;
      out(`student@college:${short(cwd)}$ ${raw}`);
      const [c, ...rest] = raw.split(/\s+/), arg = rest.join(" ");
      if (c === "pwd") out(abs(cwd));
      else if (c === "ls") { const n = kids(cwd); const names = Object.keys(n).map(x => n[x] === null ? x : x + "/"); out(names.length ? names.join("   ") : "(пусто)", "ls"); }
      else if (c === "clear") tl.innerHTML = "";
      else if (c === "cd") {
        used++;
        const r = resolve(cwd, arg);
        if (!r) out(`cd: ${arg}: Нет такого каталога`, "err");
        else { cwd = r; pr(); if (abs(cwd) === abs(task.to)) finish(used <= task.limit, false); }
      }
      else out(`${c}: команда не найдена`, "err");
    };
    $("#sk").onclick = () => { out(`# одна из правильных команд: ${task.ans}`, "dim"); finish(false, true); };
    inp.focus({preventScroll: true});
  };
  one();
},
build(p, el, done){
  const sel = {}; p.slots.forEach(s => sel[s.id] = 0);
  const fmt = n => n.toLocaleString("ru-RU");
  const cur = () => Object.fromEntries(p.slots.map(s => [s.id, s.opts[sel[s.id]]]));
  const cost = () => p.slots.reduce((a, s) => a + (s.opts[sel[s.id]].price || 0), 0);
  let checked = false;
  const draw = () => {
    const c = cost(), over = c > p.budget;
    el.innerHTML = `<span class="tag">Конструктор</span><h2>${p.title}</h2>${p.lead || ""}
    ${p.slots.map(s => `<div class="bslot"><div class="bname">${s.name}</div>${s.opts.map((o, j) => `<button class="bopt ${sel[s.id] === j ? "on" : ""}" data-s="${s.id}" data-j="${j}" ${checked ? "disabled" : ""}><span>${o.t}</span><b>${o.price ? fmt(o.price) + " ₽" : "0 ₽"}</b></button>`).join("")}</div>`).join("")}
    <div class="btotal ${over ? "over" : ""}">Стоимость апгрейда: <b>${fmt(c)} ₽</b> из ${fmt(p.budget)} ₽</div>
    <div id="w"></div><button class="btn" id="ck">${checked ? "Дальше →" : "Проверить сборку"}</button>`;
    el.querySelectorAll(".bopt").forEach(b => b.onclick = () => { sel[b.dataset.s] = +b.dataset.j; const y = scrollY; draw(); scrollTo(0, y); });
    if (checked) {
      const s = cur(); let got = 0;
      const rows = p.rules.map(r => { const ok = !!r.f(s, cost()); if (ok) got++; return `<div class="brule ${ok ? "ok" : "bad"}"><b>${ok ? "✓" : "✗"}</b><div>${r.t}${ok ? "" : `<div class="small muted">${typeof r.w === "function" ? r.w(s, cost()) : r.w}</div>`}</div></div>`; }).join("");
      $("#w").innerHTML = `<p class="sans"><b>Выполнено требований: ${got} из ${p.rules.length}</b></p>${rows}${p.after || ""}<p></p>`;
      $("#ck").onclick = () => done(got);
    } else $("#ck").onclick = () => { checked = true; draw(); };
  };
  draw();
},
str(p, el, done){
  const LOOK = {"а":"a","в":"b","с":"c","е":"e","н":"h","к":"k","м":"m","о":"o","р":"p","т":"t","х":"x"};
  const norm = s => String(s).toLowerCase().replace(/ё/g,"е").replace(/[\s,;.()\-–—→>:]+/g,"");
  const normL = s => norm(s).replace(/[авсенкмортх]/g, c => LOOK[c]);

      if (ok) got++; inp.disabled = true; f.classList.add(ok ? "ok" : "bad");
      f.querySelector(".why").innerHTML = (ok ? "<b>Верно.</b> " : `<b>Правильно: ${x.show || [].concat(x.ans)[0]}.</b> `) + (x.w || "");
    });

  };
},
huffman(p, el, done){
  let uid = 0, sel = [], got = 0, firstTry = true, msg = "";
  let nodes = p.items.map(x => ({id: "h" + (uid++), w: x.w, syms: x.s, leaf: x.s}));
  const total = p.items.length - 1;
  const codesOf = root => { const out = {}; const go = (n, c) => { if (n.leaf) { out[n.leaf] = c || "0"; return; } go(n.l, c + "0"); go(n.r, c + "1"); }; go(root, ""); return out; };
  const draw = () => {
    const step = total - nodes.length + 2;
    const fin = nodes.length === 1;
    el.innerHTML = `<span class="tag">Интерактив</span><h2>${p.title}</h2><p>${p.prompt}</p>
    ${fin ? "" : `<p class="sans small"><b>Шаг ${step} из ${total}.</b> ${msg || "Выбери два узла с наименьшими весами."}</p>`}
    <div class="hf">${nodes.slice().sort((a,b)=>a.w-b.w).map(n=>`<button class="hfn ${sel.includes(n.id)?"on":""} ${n.leaf?"":"inner"}" data-id="${n.id}" ${fin?"disabled":""}><b>${n.w}</b><span>${n.syms}</span></button>`).join("")}</div>
    <div class="hflog">${log.map(s=>`<div>${s}</div>`).join("")}</div><div id="w"></div>`;
    el.querySelectorAll(".hfn").forEach(b => b.onclick = () => pick(b.dataset.id));
    if (fin) {
      const C = codesOf(nodes[0]);
      const rows = p.items.map(x => `<tr><td><b>${x.s}</b></td><td>${x.w}</td><td><code>${C[x.s]}</code></td><td>${C[x.s].length}</td><td>${x.w * C[x.s].length}</td></tr>`).join("");
      const bits = p.items.reduce((a,x) => a + x.w * C[x.s].length, 0);
      $("#w").innerHTML = `<div class="note"><b>Дерево готово.</b> Объединений с первой попытки: ${got} из ${total}. Левой ветке приписан 0, правой — 1:</div>
      <div style="overflow-x:auto"><table class="tt"><tr><th>Символ</th><th>Частота</th><th>Код</th><th>Длина</th><th>Бит всего</th></tr>${rows}<tr><th colspan="4">Итого</th><td><b>${bits}</b></td></tr></table></div>
      <p class="small muted sans">Самый частый символ получил самый короткий код.</p><button class="btn" id="nx">Дальше →</button>`;
      $("#nx").onclick = () => done(got);
    }
  };
  const log = [];
  const pick = id => {
    sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id);
    if (sel.length < 2) { msg = ""; return draw(); }
    const ws = nodes.map(n => n.w).sort((a,b)=>a-b);
    const [a, b] = sel.map(s => nodes.find(n => n.id === s)).sort((x,y)=>x.w-y.w);
    if (a.w === ws[0] && b.w === ws[1]) {
      const nn = {id: "h" + (uid++), w: a.w + b.w, syms: a.syms + b.syms, l: a, r: b};
      nodes = nodes.filter(n => n !== a && n !== b).concat(nn);
      log.push(`${a.syms} (${a.w}) + ${b.syms} (${b.w}) → ${nn.syms} (${nn.w})${firstTry ? "" : " · со второй попытки"}`);
      if (firstTry) got++;
      firstTry = true; msg = "";
    } else {
      firstTry = false;
      msg = `<span style="color:var(--red)">Не самые лёгкие узлы: сейчас наименьшие веса — ${ws[0]} и ${ws[1]}. Попробуй ещё раз.</span>`;
    }
    sel = []; draw();
  };
  draw();
},
atom(p, el, done){
  const EL = [["H","водород"],["He","гелий"],["Li","литий"],["Be","бериллий"],["B","бор"],["C","углерод"],["N","азот"],["O","кислород"],["F","фтор"],["Ne","неон"],["Na","натрий"],["Mg","магний"],["Al","алюминий"],["Si","кремний"],["P","фосфор"],["S","сера"],["Cl","хлор"],["Ar","аргон"],["K","калий"],["Ca","кальций"]];
  const CAP = [2,8,8,2];
  let k = 0, got = 0;
  const one = () => {
    if (k >= p.targets.length) return done(got);
    const T = p.targets[k], v = {p:0, n:0, e:0}; let checked = false;
    const shells = e => { const out = []; let left = e; for (const c of CAP) { if (left <= 0) break; out.push(Math.min(c, left)); left -= c; } return out; };
    const svg = () => {
      const cx = 150, cy = 140, sh = shells(v.e);
      let s = `<svg viewBox="0 0 300 280" style="width:100%;max-width:300px;display:block;margin:0 auto">`;
      [46,74,102,130].forEach((r,i) => s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${i < sh.length ? "#9aa8bf" : "#eceef2"}" stroke-dasharray="${i < sh.length ? "" : "3 4"}"/>`);
      s += `<circle cx="${cx}" cy="${cy}" r="30" fill="#EFFE74" stroke="#222" stroke-width="1.5"/>`;
      s += `<text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b0361f">${v.p} p⁺</text><text x="${cx}" y="${cy+13}" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f636b">${v.n} n⁰</text>`;
      sh.forEach((cnt, i) => { const r = [46,74,102,130][i]; for (let j = 0; j < cnt; j++) { const a = -Math.PI/2 + j * 2 * Math.PI / cnt; s += `<circle cx="${cx + r*Math.cos(a)}" cy="${cy + r*Math.sin(a)}" r="6" fill="#3b67d6"/><text x="${cx + r*Math.cos(a)}" y="${cy + r*Math.sin(a)+3.5}" text-anchor="middle" font-size="9" fill="#fff" font-family="sans-serif">−</text>`; } });
      return s + `</svg>`;
    };
    const draw = () => {
      const elname = v.p ? `${EL[v.p-1][1]} (${EL[v.p-1][0]})` : "—";
      const q = v.p - v.e, qs = q === 0 ? "0 — нейтральный атом" : (q > 0 ? `+${q} — положительный ион` : `−${-q} — отрицательный ион`);
      const ctr = (key, label) => `<div class="actr"><span>${label}</span><div><button data-k="${key}" data-d="-1" ${checked?"disabled":""}>−</button><b>${v[key]}</b><button data-k="${key}" data-d="1" ${checked?"disabled":""}>+</button></div></div>`;
      el.innerHTML = `<span class="tag">Конструктор · атом ${k+1} из ${p.targets.length}</span><h2>${p.title}</h2>
      <div class="note">Собери: <b>${T.name}</b></div><p></p>
      <div class="abox"><div>${svg()}</div><div class="actl">
        ${ctr("p","Протоны")}${ctr("n","Нейтроны")}${ctr("e","Электроны")}
        <div class="refcard" style="margin:12px 0 0"><div class="rf"><span>Элемент</span><b>${elname}</b></div><div class="rf"><span>Массовое число A</span><b>${v.p + v.n}</b></div><div class="rf"><span>Заряд</span><b>${qs}</b></div><div class="rf"><span>Слои</span><b>${shells(v.e).join(", ") || "—"}</b></div></div>
      </div></div><div id="w"></div>${checked ? "" : `<button class="btn" id="ck">Проверить</button>`}`;
      el.querySelectorAll(".actr button").forEach(b => b.onclick = () => { const key = b.dataset.k; v[key] = Math.max(0, Math.min(key === "n" ? 30 : 20, v[key] + +b.dataset.d)); draw(); });
      if (!checked) $("#ck").onclick = () => {
        checked = true;
        const ne = T.Z - (T.q || 0), nn = T.A - T.Z;
        const ok = v.p === T.Z && v.n === nn && v.e === ne; if (ok) got++;
        draw();
        $("#w").innerHTML = `<div class="note"><b>${ok ? "Верно!" : "Не совсем."}</b> ${T.name}: протонов ${T.Z} (порядковый номер), нейтронов ${T.A} − ${T.Z} = ${nn}, электронов ${ne}${T.q ? ` (атом отдал ${T.q} электрон)` : ""}.</div><p></p><button class="btn" id="nx">${k+1 < p.targets.length ? "Следующий атом →" : "Дальше →"}</button>`;
        $("#nx").onclick = () => { k++; scrollTo(0,0); one(); };
      };
    };
    draw();
  };
  one();
},
classify(p, el, done){
