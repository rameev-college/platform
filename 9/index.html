  intro: `<p>Петербург, 1865 год. Убита старуха-процентщица Алёна Ивановна и её сестра Лизавета. Кто это сделал, следователю Порфирию Петровичу уже ясно: бывший студент Родион Раскольников.</p>

<p class="muted small sans">Каждый этап засчитывается с первой попытки. После проверки ты увидишь разбор. В конце результат сам отправится преподавателю.</p>`,

/* ---------- графики для уроков математики ---------- */
let _clip = 0;
function svgPlot(o){
  const W = o.w || 300, H = o.h || 180, P = 26;
  const [x0,x1] = o.x, [y0,y1] = o.y;
  const X = x => P + (x - x0) / (x1 - x0) * (W - 2*P), Y = y => H - P - (y - y0) / (y1 - y0) * (H - 2*P);
  const id = "cl" + (++_clip);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:8px 0" role="img"><defs><clipPath id="${id}"><rect x="${P}" y="${P}" width="${W-2*P}" height="${H-2*P}"/></clipPath></defs>`;
  s += `<rect x="${P}" y="${P}" width="${W-2*P}" height="${H-2*P}" fill="#fff" stroke="#e2e4e9"/>`;
  (o.xt || []).forEach(([v,l]) => { s += `<line x1="${X(v)}" x2="${X(v)}" y1="${P}" y2="${H-P}" stroke="#eceef2"/><text x="${X(v)}" y="${H-P+14}" font-size="10" text-anchor="middle" fill="#5f636b" font-family="sans-serif">${l}</text>` });
  (o.yt || []).forEach(([v,l]) => { s += `<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceef2"/><text x="${P-4}" y="${Y(v)+3}" font-size="10" text-anchor="end" fill="#5f636b" font-family="sans-serif">${l}</text>` });
  if (x0 <= 0 && x1 >= 0) s += `<line x1="${X(0)}" x2="${X(0)}" y1="${P}" y2="${H-P}" stroke="#9aa0aa"/>`;
  if (y0 <= 0 && y1 >= 0) s += `<line x1="${P}" x2="${W-P}" y1="${Y(0)}" y2="${Y(0)}" stroke="#9aa0aa"/>`;
  (o.c || []).forEach(c => {
    let d = "";
    if (c.f){
      let pen = false; const lim = (y1 - y0) * 2;
      for (let i = 0; i <= 600; i++){
        const x = x0 + (x1 - x0) * i / 600, y = c.f(x);
        if (!isFinite(y) || y > y1 + lim || y < y0 - lim){ pen = false; continue }
        d += (pen ? "L" : "M") + X(x).toFixed(1) + " " + Y(y).toFixed(1); pen = true;
      }
    } else d = c.p.map((q,i) => (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1)).join("");
    s += `<path d="${d}" fill="none" stroke="${c.col || "#3b67d6"}" stroke-width="2.6" stroke-linejoin="round" clip-path="url(#${id})"/>`;
  });
  (o.dots || []).forEach(([x,y]) => { s += `<circle cx="${X(x)}" cy="${Y(y)}" r="3.5" fill="#222"/>` });
  return s + "</svg>";
}
const PI_T = [[-2*Math.PI,"−2π"],[-Math.PI,"−π"],[0,"0"],[Math.PI,"π"],[2*Math.PI,"2π"]];

<li><b>Разложение на множители:</b> произведение равно нулю — каждый множитель приравниваем к нулю.</li>
<li><b>Однородные:</b> все слагаемые одной степени по sin и cos, например a·sin x + b·cos x = 0. Делим на cos x и получаем уравнение с tg x.</li>

<li>tg x = a: <b>x = arctg a + πk</b>.</li>

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(KEY + k)) } catch(e) { return null } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)) } catch(e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };

/* время: берём с сервера, если не вышло — с устройства */
let clockShift = 0;
async function syncClock(){
  try {
    const r = await fetch(location.href.split("#")[0], {method:"HEAD", cache:"no-store"});
    const d = r.headers.get("Date");
    if (d) clockShift = new Date(d).getTime() - Date.now();
  } catch(e) {}
}
const now = () => Date.now() + clockShift;
function mskTime(hm, date){ // момент по Москве (UTC+3)
  if (!hm) return null;
  const [y,m,d] = (date || CONFIG.DATE).split("-").map(Number); const [h,mi] = hm.split(":").map(Number);
  return Date.UTC(y, m-1, d, h-3, mi);
}
const localHM = t => new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

function partMax(p){
  if (p.variants) p = {...p, ...Object.values(p.variants)[0]};
  if (p.type === "reveal") return p.items.length * 3;
  if (p.type === "truth") return 1 << p.vars.length;
  if (p.type === "dnf") return 2;
  if (p.type === "venn") return 3;
  if (p.type === "arc") return 1;
  if (p.type === "venn3") return p.count !== undefined ? 2 : 1;
  if (p.type === "num") return p.items.length;
  if (p.type === "proofread") return (p.text.match(/\[\[/g) || []).length;
  if (p.type === "pivot") return p.qs.length;
  if (p.type === "grid") return p.rows.length * p.cols.length;
  if (p.type === "budget") return p.risks.length + p.bonus;
  if (p.type === "audit") return p.rows.length + p.rows.filter(r => r.err).length;
  if (p.type === "classify" || p.type === "order" || p.type === "fill") return p.items.length;
  if (p.type === "dialog") return p.rounds.length * 3;
  if (p.type === "mc") return 1;
  return 0;
}
const stageMax = s => s.parts.reduce((a,p) => a + partMax(p), 0);
const lessonMax = L => L.stages.reduce((a,s) => a + stageMax(s), 0);

function hash(str){ let h = 2166136261; for (const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) } return (h >>> 0).toString(36).toUpperCase().padStart(6,"0").slice(-6) }

/* ---------- главная ---------- */
function home(){
  document.body.className = "brand"; document.documentElement.style.background = "#F4F5F7";
  const prof = load("profile");
  let html = `<div class="card folder">
    <span class="tag">${esc(CONFIG.SUBTITLE)}</span>
    <h1>${esc(CONFIG.TITLE).replace(/(\d)-(\d)/g,"$1\u2011$2")}</h1>
    <p class="muted sans small">Расписание занятий · время московское</p>`;
  if (!prof){
    html += `<label for="nm">Фамилия и имя — как на платформе</label>
      <input type="text" id="nm" placeholder="Иванов Иван" autocomplete="name">
      <label for="gr">Группа</label>
      <select id="gr"><option value="">Выбери группу</option>${CONFIG.GROUPS.map(g=>`<option>${g}</option>`).join("")}</select>
      <p style="margin-top:14px"><button class="btn" id="go" disabled>Войти в кабинет</button></p></div>`;
    app.innerHTML = html;
    const chk = () => $("#go").disabled = !($("#nm").value.trim().split(/\s+/).length >= 2 && $("#gr").value);
    $("#nm").oninput = chk; $("#gr").onchange = chk;
    $("#go").onclick = () => { save("profile", {name: $("#nm").value.trim().replace(/\s+/g," "), group: $("#gr").value}); home(); };
    return;
  }
  html += `<div class="row sans small"><span><b>${esc(prof.name)}</b> · группа ${esc(prof.group)}</span>
    <button class="link" id="chg">это не я</button></div></div>`;
  const t = now();
  const today = new Date(t + 3*3600e3).toISOString().slice(0,10);
  const dateOf = s => s.date || CONFIG.DATE;
  const dates = [...new Set(SCHEDULE.map(dateOf))].sort((x,y) => (x === today ? -1 : y === today ? 1 : y.localeCompare(x)));
  const dname = d => new Date(d+"T12:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"long"});
  dates.forEach(d => {
    html += `<h3 class="dayhead">${d === today ? "Сегодня, " : d < today ? "Прошлые занятия · " : ""}${dname(d)}</h3>`;
    SCHEDULE.filter(s => dateOf(s) === d).forEach(s => {
    const st = mskTime(s.start, d), en = mskTime(s.end, d);
    const done = load("res_" + s.id);
    let status = "", cls = "", open = !s.soon;
    if (s.soon){ status = `<span class="status lock">готовится</span>`; }
    else if (done){ status = `<span class="status done">сдано</span>`; }
    else if (CONFIG.TIME_LOCK && st && t < st){ open = false; cls = "dis"; status = `<span class="status lock">откроется в ${s.start}</span>`; }
    else if (st && en && t >= st && t <= en){ cls = "now"; status = `<span class="status now">идёт сейчас</span>`; }
    else { status = `<span class="status">открыт</span>`; }
    if (!open) cls = "dis";
    const localNote = st && localHM(st) !== s.start ? `<small>у тебя ${localHM(st)}</small>` : "";
    html += `<div class="card lesson ${cls}" data-id="${s.id}" data-open="${open?1:0}">
      <div class="time">${s.start || "—"}${s.end ? "–"+s.end : ""}${localNote}</div>
      <div class="body"><span class="tag">${esc(s.subject)}</span><h3>${esc(s.title)}</h3>${s.note?`<p class="muted small" style="margin:0">${esc(s.note)}</p>`:""}</div>
      <div>${status}</div></div>`;
    });
  });
  if (CONFIG.TEST_MODE) html += `<p style="text-align:center"><button class="link sans small" id="rst">Сбросить прогресс (режим проверки)</button></p>`;
  app.innerHTML = html;
  if ($("#rst")) $("#rst").onclick = resetAll;
  $("#chg").onclick = () => { if (confirmBox()) { try{ localStorage.removeItem(KEY+"profile") }catch(e){} home(); } };
  document.querySelectorAll(".lesson").forEach(el => el.onclick = () => { if (el.dataset.open === "1") openLesson(el.dataset.id) });
}
function confirmBox(){ return true }

/* ---------- урок ---------- */
let L, LID, S;
function openLesson(id){
  LID = id; L = LESSONS[id];
  document.body.className = L.theme || ""; document.documentElement.style.background = L.theme === "brand" ? "#F4F5F7" : "";
  S = load("ls_" + id) || {stage: -1, scores: [], answer: ""};
  const res = load("res_" + id);
  if (res) return results();
  if (S.stage < 0) return intro();
  stageBrief();
}
const DEF_UI = { introStamp: "Дело", start: "Открыть дело", brief: "Материалы дела", doneStamp: "Дело закрыто", submit: "Сдать дело" };
const ui = k => (L.ui && L.ui[k]) || DEF_UI[k];
function persist(){ save("ls_" + LID, S) }
function total(){ return S.scores.reduce((a,b)=>a+(b||0),0) }
function header(){
  const steps = L.stages.map((_,i)=>`<i class="${i < S.stage ? "on" : i === S.stage ? "cur" : ""}"></i>`).join("");
  return `<div class="top"><button class="link" id="back">← В кабинет</button><span class="pts">Баллы: ${total()}</span></div><div class="steps">${steps}</div>`;
}
function bindBack(){ $("#back").onclick = () => { LID = null; home(); } }
function intro(){
  app.innerHTML = `<div class="top"><button class="link" id="back">← В кабинет</button></div>
  <div class="card folder"><span class="stamp">${ui("introStamp")}</span><h1 style="margin-top:12px">${esc(L.title)}</h1>${L.intro}
  <p class="sans small"><b>Этапы:</b> ${L.stages.map((s,i)=>`${i+1}. ${s.name} (${s.min} мин)`).join(" · ")}</p>
  <button class="btn red" id="start">${ui("start")}</button></div>`;
  bindBack();
  $("#start").onclick = () => { S.stage = 0; S.t0 = Date.now(); persist(); stageBrief(); };
}
function stageBrief(){
  if (S.stage >= L.stages.length) return finish();
  const st = L.stages[S.stage];
  app.innerHTML = header() + `<div class="card ${L.theme === "brand" ? "" : "folder"} brief"><span class="tag">${ui("brief")} · часть ${S.stage+1} из ${L.stages.length} · ≈${st.min} мин</span><h2>${esc(st.name)}</h2>${st.brief}
  <button class="btn" id="go">К заданию →</button></div>`;
  bindBack(); scrollTo(0,0);
  let pts = 0, pi = 0;
  $("#go").onclick = () => nextPart();
  function nextPart(){
    if (pi >= st.parts.length){ S.scores[S.stage] = pts; S.stage++; persist(); return stageBrief(); }
    let p = st.parts[pi++];
    if (p.variants) p = {...p, ...p.variants[(S.choice || {})[p.choiceKey]]};
    app.innerHTML = header() + `<div class="card" id="pc"></div>`;
    bindBack(); scrollTo(0,0);
    RENDER[p.type](p, $("#pc"), got => { pts += got; nextPart(); });
  }
}

/* ---------- типы заданий ---------- */
const RENDER = {
classify(p, el, done){
  const items = shuffle(p.items.map((x,i)=>({...x,i})));
  const pick = {};
  el.innerHTML = `<span class="tag">Задание</span><h2>${p.title}</h2><p>${p.prompt}</p>
   ${items.map(x=>`<div class="item" data-i="${x.i}"><div>${x.t}</div><div class="chips">${p.bins.map(b=>`<button class="chip" data-b="${b.id}">${b.label}</button>`).join("")}</div><div class="why"></div></div>`).join("")}
   <div id="aft"></div><button class="btn" id="ck" disabled>Проверить</button>`;
  el.querySelectorAll(".item").forEach(it => it.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    pick[it.dataset.i] = c.dataset.b;
    it.querySelectorAll(".chip").forEach(z => z.classList.toggle("on", z === c));
    $("#ck").disabled = Object.keys(pick).length < p.items.length;
  }));
  $("#ck").onclick = () => {
    let got = 0; el.classList.add("checked");
    el.querySelectorAll(".item").forEach(it => {
      const x = p.items[it.dataset.i], ok = pick[it.dataset.i] === x.b;
      if (ok) got++;
      it.classList.add(ok ? "ok" : "bad");
      it.querySelectorAll(".chip").forEach(z => z.disabled = true);
      it.querySelector(".why").innerHTML = (ok ? "<b>Верно.</b> " : `<b>Правильно: ${p.bins.find(b=>b.id===x.b).label}.</b> `) + x.w;
    });
    $("#aft").innerHTML = `<p class="sans"><b>${got} из ${p.items.length}</b></p>` + (p.after || "");
    const b = $("#ck"); b.textContent = "Дальше →"; b.onclick = () => done(got);
  };
},
mc(p, el, done){
  el.innerHTML = `<span class="tag">Вопрос</span>${p.fig || ""}<h3>${p.q}</h3>${p.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}<div id="w"></div>`;
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === p.c;
    el.querySelectorAll(".opt").forEach(z => { z.disabled = true; if (+z.dataset.i === p.c) z.classList.add("ok") });
    if (!ok) b.classList.add("bad");
    $("#w").innerHTML = `<p>${ok ? "<b>Верно.</b> " : "<b>Не совсем.</b> "}${p.w}</p><button class="btn" id="nx">Дальше →</button>`;
    $("#nx").onclick = () => done(ok ? 1 : 0);
  });
},
order(p, el, done){
  let cur = shuffle(p.items.map((t,i)=>i));
  while (cur.every((v,i)=>v===i)) cur = shuffle(cur);
  let checked = false;
  const draw = () => {
    el.innerHTML = `<span class="tag">Задание</span><h2>${p.title}</h2><p>${p.prompt}</p>
    ${cur.map((v,k)=>`<div class="item ord ${checked ? (v===k?"ok":"bad") : ""}"><span class="n">${k+1}</span><span class="t">${p.items[v]}</span>${checked?"":`<span class="mv"><button data-k="${k}" data-d="-1" aria-label="выше">↑</button><button data-k="${k}" data-d="1" aria-label="ниже">↓</button></span>`}</div>`).join("")}
    <div id="w"></div><button class="btn" id="ck">${checked ? "Дальше →" : "Проверить"}</button>`;
    el.querySelectorAll(".mv button").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, j = k + +b.dataset.d; if (j < 0 || j >= cur.length) return;
      [cur[k], cur[j]] = [cur[j], cur[k]]; draw();
    });
    const got = cur.filter((v,k)=>v===k).length;
    if (checked) $("#w").innerHTML = `<p class="sans"><b>На своём месте: ${got} из ${p.items.length}</b></p>` + (got < p.items.length ? `<div class="note"><b>Правильный порядок:</b><ol style="margin:6px 0 0;padding-left:20px">${p.items.map(t=>`<li>${t}</li>`).join("")}</ol></div><p></p>` : "");
    $("#ck").onclick = () => { if (checked) return done(got); checked = true; draw(); };
  };
  draw();
},
fill(p, el, done){
  el.innerHTML = `<span class="tag">Задание</span><h2>${p.title}</h2>${p.fig || ""}
  ${p.items.map((x,i)=>`<div class="fill item" data-i="${i}">${x.a} <select><option value="">…</option>${x.o.map((o,j)=>`<option value="${j}">${o}</option>`).join("")}</select>${x.z}<div class="why"></div></div>`).join("")}
  <button class="btn" id="ck" disabled>Проверить</button>`;
  const sels = [...el.querySelectorAll("select")];
  sels.forEach(s => s.onchange = () => $("#ck").disabled = sels.some(z => z.value === ""));
  $("#ck").onclick = () => {
    let got = 0; el.classList.add("checked");
    el.querySelectorAll(".fill").forEach(f => {
      const x = p.items[f.dataset.i], s = f.querySelector("select"), ok = [].concat(x.c).includes(+s.value);
      if (ok) got++; s.disabled = true; f.classList.add(ok ? "ok" : "bad");
      f.querySelector(".why").innerHTML = ok ? "<b>Верно.</b>" : `<b>Правильно: ${[].concat(x.c).map(j => x.o[j]).join(" или ")}.</b>`;
    });
    const b = $("#ck"); b.textContent = `${got} из ${p.items.length} · Дальше →`; b.onclick = () => done(got);
  };
},
dialog(p, el, done){
  let r = 0, got = 0, conf = 100;
  const step = 100 / (p.rounds.length * 3);
  el.innerHTML = `<span class="tag">Допрос</span><h2>${p.title}</h2><p>${p.lead}</p>
   <div class="meter">Уверенность Раскольникова в теории<div class="bar"><b id="cf" style="width:100%"></b></div></div>
   <div class="chat" id="chat"></div><div id="ops"></div>`;
  const chat = $("#chat");
  const say = (cls, who, t) => { chat.insertAdjacentHTML("beforeend", `<div class="msg ${cls}"><span class="who">${who}</span>${t}</div>`); };
  const round = () => {
    if (r >= p.rounds.length){
      $("#ops").innerHTML = p.finale + `<p class="sans" style="margin-top:12px"><b>${got} из ${p.rounds.length*3}</b></p><button class="btn" id="nx">Дальше →</button>`;
      $("#nx").onclick = () => done(got); return;
    }
    const R = p.rounds[r];
    say(R.who === "p" ? "p" : "r", R.who === "p" ? "Порфирий" : "Раскольников", R.line);
    $("#ops").innerHTML = shuffle(R.opts.map((o,i)=>({...o,i}))).map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join("");
    $("#ops").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = R.opts[b.dataset.i]; got += o.p; conf -= o.p * step;
      say("me", "Ты", o.t);
      if (R.who !== "p") say("r", "Раскольников", o.r);
      say("p", "Порфирий", o.n);
      $("#cf").style.width = Math.max(0, conf) + "%";
      r++;
      $("#ops").innerHTML = `<button class="btn" id="nx">${r < p.rounds.length ? "Следующий вопрос →" : "Итог допроса →"}</button>`;
      $("#nx").onclick = () => { $("#ops").innerHTML = ""; round(); };
      $("#nx").scrollIntoView({behavior:"smooth", block:"center"});
    });
  };
  round();
},
explore(p, el, done){
  const modes = [
    {k:"sin", f:Math.sin, lead:"Двигай ползунок. Точка вала поворачивается, а справа рисуется её <b>высота</b> — это синус угла. Прокрути полный оборот, до 360°."},
    {k:"cos", f:Math.cos, lead:"Теперь справа рисуется <b>сдвиг точки по горизонтали</b> — это косинус угла. Снова прокрути полный оборот."}
  ];
  let m = 0, a = 0, maxA = 0;
  const gcd = (x,y) => y ? gcd(y, x % y) : x;
  const radStr = d => { if (!d) return "0"; const g = gcd(d,180), n = d/g, q = 180/g; return (n === 1 ? "" : n) + "π" + (q === 1 ? "" : "/" + q) };
  el.innerHTML = `<span class="tag">Интерактив</span><h2>${p.title}</h2><p id="lead"></p><div id="fig"></div>
    <input type="range" id="ang" min="0" max="360" step="15" value="0" style="width:100%;accent-color:#3b67d6" aria-label="Угол поворота">
    <p class="sans" id="rd"></p><button class="btn" id="nx" disabled>Прокрути до 360°</button>`;
  const draw = () => {
    const M = modes[m], r = 80, cx = 105, cy = 115, g0 = 235, g1 = 620, sx = (g1 - g0) / 360;
    const rad = a * Math.PI / 180, px = cx + r * Math.cos(rad), py = cy - r * Math.sin(rad);
    let path = ""; for (let d = 0; d <= maxA; d += 3) path += (d ? "L" : "M") + (g0 + d*sx).toFixed(1) + " " + (cy - r*M.f(d*Math.PI/180)).toFixed(1);
    const gx = g0 + a*sx, gy = cy - r*M.f(rad);
    let s = `<svg viewBox="0 0 640 245" style="width:100%;height:auto;display:block;background:#fff;border:1px solid #e2e4e9;border-radius:12px">`;
    s += `<line x1="15" x2="195" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${cx}" x2="${cx}" y1="25" y2="205" stroke="#9aa0aa"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#c9ced8" stroke-width="2"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#222" stroke-width="1.5"/>`;
    if (m === 0) s += `<line x1="${px}" y1="${cy}" x2="${px}" y2="${py}" stroke="#3b67d6" stroke-width="5" stroke-linecap="round"/><line x1="${px}" y1="${py}" x2="${gx}" y2="${gy}" stroke="#3b67d6" stroke-dasharray="4 4"/>`;
    else s += `<line x1="${cx}" y1="${py}" x2="${px}" y2="${py}" stroke="#3b67d6" stroke-width="5" stroke-linecap="round"/>`;
    s += `<circle cx="${px}" cy="${py}" r="6" fill="#222"/>`;
    s += `<line x1="${g0}" x2="${g1}" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${g0}" x2="${g0}" y1="25" y2="205" stroke="#9aa0aa"/>`;
    [[cy-r,"1"],[cy+r,"−1"]].forEach(([y,l]) => s += `<line x1="${g0}" x2="${g1}" y1="${y}" y2="${y}" stroke="#eceef2"/><text x="${g0-6}" y="${y+4}" font-size="12" text-anchor="end" fill="#5f636b" font-family="sans-serif">${l}</text>`);
    [90,180,270,360].forEach(d => s += `<line x1="${g0+d*sx}" x2="${g0+d*sx}" y1="25" y2="205" stroke="#eceef2"/><text x="${g0+d*sx}" y="222" font-size="11" text-anchor="middle" fill="#5f636b" font-family="sans-serif">${d}°</text><text x="${g0+d*sx}" y="237" font-size="11" text-anchor="middle" fill="#5f636b" font-family="sans-serif">${radStr(d)}</text>`);
    s += `<path d="${path}" fill="none" stroke="#3b67d6" stroke-width="3"/><circle cx="${gx}" cy="${gy}" r="5" fill="#3b67d6"/></svg>`;
    $("#fig").innerHTML = s;
    let v = M.f(rad); if (Math.abs(v) < 0.005) v = 0;
    $("#rd").innerHTML = `Угол <b>${a}° = ${radStr(a)}</b> · ${M.k} = <b>${v.toFixed(2).replace("-","−")}</b>`;
    $("#lead").innerHTML = M.lead;
  };
  $("#ang").oninput = e => {
    a = +e.target.value; maxA = Math.max(maxA, a); draw();
    if (maxA >= 360){ const b = $("#nx"); b.disabled = false; b.textContent = m === 0 ? "Теперь косинус →" : "Дальше →"; }
  };
  $("#nx").onclick = () => {
    if (m === 0){ m = 1; a = 0; maxA = 0; $("#ang").value = 0; $("#nx").disabled = true; $("#nx").textContent = "Прокрути до 360°"; draw(); scrollTo(0,0); }
    else done(0);
  };
  draw();
},
pick(p, el, done){
  el.innerHTML = `<span class="tag">Выбор</span><h2>${p.title}</h2><p>${p.prompt}</p>${p.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${o}</button>`).join("")}`;
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.choice = S.choice || {}; S.choice[p.key] = b.dataset.v; persist(); done(0); });
},
reveal(p, el, done){
  let k = 0, got = 0;
  const one = () => {
    if (k >= p.items.length) return done(got);
    const it = p.items[k]; let open = 1, answered = false;
    const draw = () => {
      el.innerHTML = `<span class="tag">Профиль ${k+1} из ${p.items.length}</span><h2>${p.title}</h2>
      <div class="refcard"><div class="avatar">?</div>${it.clues.map((c,i)=>`<div class="rf ${i<open?"":"hid"}"><span>Подсказка ${i+1}</span><b>${i<open?c:"скрыто"}</b></div>`).join("")}</div>

  <button class="btn" id="ck" disabled>Проверить ответы</button>`;
  const draw = () => {
    const D = p.data.filter(r => !st.filt || r[2] === st.filt), all = p.data.filter(r => !st.filt || r[2] === st.filt);
    const R = vals(st.rows), C = st.cols && st.cols !== st.rows ? vals(st.cols) : [null];
    const agg = rs => !rs.length ? null : st.agg === "sum" ? rs.reduce((a,r)=>a+r[3],0) : st.agg === "avg" ? rs.reduce((a,r)=>a+r[3],0)/rs.length : rs.length;
    const grand = agg(all);
    const cell = rs => { const v = agg(rs); if (v === null) return "—"; if (st.show === "pct") return st.agg === "avg" ? "—" : fmt(v / grand * 100); return st.agg === "cnt" ? String(v) : fmt(v); };
    const sel = (r, c) => D.filter(x => x[idx[st.rows]] === r && (c === null || x[idx[st.cols]] === c));
    let h = `<table class="tt pvt"><tr><th>${F[st.rows]}</th>${C.map(c=>`<th>${c ?? "Итого"}</th>`).join("")}${C[0] !== null ? "<th>Итого</th>" : ""}</tr>`;
    R.forEach(r => { h += `<tr><th>${r}</th>${C.map(c=>`<td>${cell(sel(r,c))}</td>`).join("")}${C[0] !== null ? `<td><b>${cell(sel(r,null))}</b></td>` : ""}</tr>`; });
    h += `<tr><th>Общий итог</th>${C.map(c=>`<td><b>${cell(D.filter(x => c === null || x[idx[st.cols]] === c))}</b></td>`).join("")}${C[0] !== null ? `<td><b>${cell(D)}</b></td>` : ""}</tr></table>`;
    $("#pt").innerHTML = h;
  };
  [["pvr","rows"],["pvc","cols"],["pva","agg"],["pvs","show"],["pvf","filt"]].forEach(([id,k]) => $("#"+id).onchange = e => { st[k] = e.target.value; draw(); });
  const sels = [...el.querySelectorAll(".fill select")];
  sels.forEach(s => s.onchange = () => $("#ck").disabled = sels.some(z => z.value === ""));
  draw();
  $("#ck").onclick = () => {
    let got = 0; el.classList.add("checked");
    el.querySelectorAll(".fill").forEach(f => { const q = p.qs[f.dataset.i], s = f.querySelector("select"), ok = +s.value === q.c; if (ok) got++; s.disabled = true; f.classList.add(ok?"ok":"bad"); f.querySelector(".why").innerHTML = (ok ? "<b>Верно.</b> " : `<b>Правильно: ${q.o[q.c]}.</b> `) + q.w; });
    const b = $("#ck"); b.textContent = `${got} из ${p.qs.length} · Дальше →`; b.onclick = () => done(got);
  };
},
num(p, el, done){
  const parse = s => { s = String(s).trim().replace(/\s/g,"").replace(",",".").replace("−","-"); if (/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){ const [a,b] = s.split("/").map(Number); return a/b; } return s === "" ? NaN : Number(s); };
  el.innerHTML = `<span class="tag">Расчёт</span><h2>${p.title}</h2>${p.fig || ""}${p.prompt ? `<p>${p.prompt}</p>` : ""}
  ${p.items.map((x,i)=>`<div class="fill item" data-i="${i}"><label style="margin:0 0 6px">${x.a}</label><div class="row" style="flex-wrap:nowrap"><input type="text" inputmode="decimal" class="nin" style="max-width:180px">${x.unit ? `<span class="sans">${x.unit}</span>` : ""}</div><div class="why"></div></div>`).join("")}
  <p class="sans small muted">Вводи число. Дробную часть можно писать через запятую или точку, допустима запись вида 1/2.</p>
  <button class="btn" id="ck" disabled>Проверить</button>`;
  const ins = [...el.querySelectorAll(".nin")];
  ins.forEach(n => n.oninput = () => $("#ck").disabled = ins.some(z => isNaN(parse(z.value))));
  $("#ck").onclick = () => {
    let got = 0; el.classList.add("checked");
    el.querySelectorAll(".fill").forEach(f => { const x = p.items[f.dataset.i], inp = f.querySelector("input"), v = parse(inp.value);
      const ok = [].concat(x.ans).some(a => Math.abs(v - a) <= (x.tol || 1e-6)); if (ok) got++; inp.disabled = true; f.classList.add(ok?"ok":"bad");
      f.querySelector(".why").innerHTML = (ok ? "<b>Верно.</b> " : `<b>Правильно: ${x.show || [].concat(x.ans)[0]}.</b> `) + (x.w || ""); });
    const b = $("#ck"); b.textContent = `${got} из ${p.items.length} · Дальше →`; b.onclick = () => done(got);
  };
},
venn3(p, el, done){
  const C = [[150,100],[232,100],[191,170]], r = 70, N = p.names || ["P","D","E"], on = new Set(), k = "v3" + p.k;
  const zoneSvg = z => { let inner = `<rect width="380" height="270" fill="#7199F1"/>`;
    z.split("").forEach((b,i) => { inner = b === "1" ? `<g clip-path="url(#${k}c${i})">${inner}</g>` : `<g mask="url(#${k}m${i})">${inner}</g>`; });
    return `<g clip-path="url(#${k}box)">${inner}</g>`; };
  const svg = () => `<svg viewBox="0 0 380 270" id="vs" style="width:100%;max-width:440px;display:block;margin:8px 0;cursor:pointer;touch-action:manipulation"><defs>
    <clipPath id="${k}box"><rect x="5" y="5" width="370" height="260" rx="12"/></clipPath>
    ${C.map((c,i)=>`<clipPath id="${k}c${i}"><circle cx="${c[0]}" cy="${c[1]}" r="${r}"/></clipPath><mask id="${k}m${i}"><rect width="380" height="270" fill="#fff"/><circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="#000"/></mask>`).join("")}</defs>
    <rect x="5" y="5" width="370" height="260" rx="12" fill="#fff" stroke="#222" stroke-width="1.5"/>
    ${[...on].map(zoneSvg).join("")}
    ${C.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="none" stroke="#222" stroke-width="2"/>`).join("")}
    <text x="18" y="26" font-family="sans-serif" font-weight="700" font-size="15">U</text>
    <text x="78" y="44" font-family="sans-serif" font-weight="700" font-size="14">${N[0]}</text>
    <text x="${C[1][0]+48}" y="44" font-family="sans-serif" font-weight="700" font-size="14">${N[1]}</text>
    <text x="${C[2][0]+66}" y="${C[2][1]+56}" font-family="sans-serif" font-weight="700" font-size="14">${N[2]}</text></svg>`;
  el.innerHTML = `<span class="tag">Диаграмма</span><h2>${p.title}</h2>${p.fig || ""}<p>${p.q}</p>
   <div id="vd">${svg()}</div><p class="sans small muted">Нажимай на области, чтобы закрасить их. Повторное нажатие снимает закраску.</p>
   ${p.count !== undefined ? `<div class="fill item"><label style="margin:0 0 6px">Сколько студентов в закрашенной части?</label><input type="text" inputmode="numeric" id="vn" style="max-width:140px"></div>` : ""}
   <div id="w"></div><button class="btn" id="ck" disabled>Проверить</button>`;
  const ready = () => $("#ck").disabled = !(on.size && (p.count === undefined || $("#vn").value.trim() !== ""));
  const bind = () => { $("#vs").onclick = e => {
    if (el.classList.contains("checked")) return;
    const bx = $("#vs").getBoundingClientRect(), x = (e.clientX - bx.left) * 380 / bx.width, y = (e.clientY - bx.top) * 270 / bx.height;
    const z = C.map(c => Math.hypot(x-c[0], y-c[1]) <= r ? "1" : "0").join("");
    on.has(z) ? on.delete(z) : on.add(z); $("#vd").innerHTML = svg(); bind(); ready();
  }};
  bind(); if ($("#vn")) $("#vn").oninput = ready;
  $("#ck").onclick = () => {
    el.classList.add("checked");
    const okR = p.regions.length === on.size && p.regions.every(z => on.has(z));
    const okC = p.count === undefined ? null : Number($("#vn").value.trim().replace(",",".")) === p.count;
    const got = (okR ? 1 : 0) + (okC ? 1 : 0);
    if ($("#vn")) $("#vn").disabled = true;
    on.clear(); p.regions.forEach(z => on.add(z)); $("#vd").innerHTML = svg();
    $("#w").innerHTML = `<div class="note"><b>${got} из ${partMax(p)}.</b> Области: ${okR ? "верно" : "правильные теперь закрашены на диаграмме"}.${okC === null ? "" : ` Количество: ${okC ? "верно" : p.count}.`}<br>${p.w}</div><p></p>`;
    const b = $("#ck"); b.textContent = "Дальше →"; b.onclick = () => done(got);
  };
},
arc(p, el, done){
  const cx = 160, cy = 150, R = 110, pts = [...Array(12)].map((_,i)=>i*30);
  const lab = d => ({0:"0",30:"π/6",60:"π/3",90:"π/2",120:"2π/3",150:"5π/6",180:"π",210:"7π/6",240:"4π/3",270:"3π/2",300:"5π/3",330:"11π/6"})[d];
  let st = null, en = null;
  const P = d => [cx + R*Math.cos(d*Math.PI/180), cy - R*Math.sin(d*Math.PI/180)];
  const draw = () => {
    let s = `<svg viewBox="0 0 320 300" style="width:100%;max-width:380px;display:block;margin:8px 0;touch-action:manipulation">
      <line x1="20" x2="300" y1="${cy}" y2="${cy}" stroke="#9aa0aa"/><line x1="${cx}" x2="${cx}" y1="20" y2="285" stroke="#9aa0aa"/>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c9ced8" stroke-width="3"/>
      ${p.line !== undefined ? `<line x1="30" x2="290" y1="${cy - R*p.line}" y2="${cy - R*p.line}" stroke="#9e2a1e" stroke-dasharray="5 4"/><text x="22" y="${cy - R*p.line - 6}" font-size="12" font-family="sans-serif" fill="#9e2a1e" text-anchor="start">${p.lineLabel}</text>` : ""}`;
    if (st !== null && en !== null){
      const a = P(st), b = P(en), sweep = ((en - st + 360) % 360) || 360;
      s += `<path d="M${a[0]} ${a[1]} A${R} ${R} 0 ${sweep > 180 ? 1 : 0} 0 ${b[0]} ${b[1]}" fill="none" stroke="#3b67d6" stroke-width="7" stroke-linecap="round"/>`;
    }
    pts.forEach(d => { const [x,y] = P(d), on = d === st || d === en;
      s += `<g class="ap" data-d="${d}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="${on?8:5}" fill="${on?"#222":"#7199F1"}"/>
      <text x="${cx + (R+24)*Math.cos(d*Math.PI/180)}" y="${cy - (R+24)*Math.sin(d*Math.PI/180) + 4}" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#222">${lab(d)}</text></g>`; });
    $("#af").innerHTML = s + "</svg>";
    $("#as").textContent = st === null ? "Нажми на начало дуги." : en === null ? `Начало: ${lab(st)}. Теперь нажми на конец дуги (дуга идёт против часовой стрелки).` : `Дуга от ${lab(st)} до ${lab(en)} против часовой стрелки.`;
    $("#ck").disabled = en === null;
    el.querySelectorAll(".ap").forEach(g => g.onclick = () => {
      if (el.classList.contains("checked")) return;
      const d = +g.dataset.d; if (st === null || en !== null){ st = d; en = null; } else if (d !== st) en = d; draw();
    });
  };
  el.innerHTML = `<span class="tag">Интерактив</span><h2>${p.title}</h2><p>${p.q}</p><div id="af"></div><p class="sans small" id="as"></p>
  <p class="sans small muted">Чтобы начать заново, нажми на любую точку ещё раз — она станет новым началом.</p><div id="w"></div><button class="btn" id="ck" disabled>Проверить</button>`;
  draw();
  $("#ck").onclick = () => {
    el.classList.add("checked"); const ok = st === p.from && en === p.to;
    if (!ok){ st = p.from; en = p.to; draw(); }
    $("#w").innerHTML = `<div class="note"><b>${ok ? "Верно." : "Не совсем: правильная дуга теперь показана."}</b> ${p.w}</div><p></p>`;
    const b = $("#ck"); b.disabled = false; b.textContent = "Дальше →"; b.onclick = () => done(ok ? 1 : 0);
  };
},
survey(p, el, done){
  const ans = {};
  el.innerHTML = `<span class="tag">Обратная связь</span><h2>${p.title}</h2><p>${p.prompt}</p>
  ${p.qs.map((q,i)=>`<div class="item" data-i="${i}"><div><b>${q.q}</b></div><div class="chips">${q.o.map(o=>`<button class="chip" data-v="${esc(o)}">${o}</button>`).join("")}</div></div>`).join("")}
  <label for="sc">Что понравилось или мешало? <span class="muted">(по желанию)</span></label><textarea id="sc" style="min-height:90px" placeholder="Например: понятные объяснения, но мешало…"></textarea>
  <p></p><button class="btn red" id="ck" disabled>Отправить и завершить</button>`;
  el.querySelectorAll(".item").forEach(it => it.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    ans[it.dataset.i] = c.dataset.v; it.querySelectorAll(".chip").forEach(z => z.classList.toggle("on", z === c));
    $("#ck").disabled = Object.keys(ans).length < p.qs.length;
  }));
  $("#ck").onclick = () => {
    const cm = $("#sc").value.trim().replace(/\s+/g," ");
    S.survey = p.qs.map((q,i) => `${q.k}: ${ans[i]}`).join(", ") + (cm ? `, комментарий: ${cm}` : "");
    persist(); done(0);
  };
},
text(p, el, done){
  el.innerHTML = `<span class="tag">Ответ</span><h2>${p.title}</h2><p>${p.prompt}</p>
  <textarea id="tx" placeholder="${p.ph || ""}">${esc(S.draft || "")}</textarea>
  <p class="sans small muted" id="cnt"></p><button class="btn red" id="ck">${ui("submit")}</button>`;
  const upd = () => { const n = $("#tx").value.trim().length; $("#cnt").textContent = n < p.min ? `Ещё хотя бы ${p.min - n} символов` : "Готово к сдаче"; $("#ck").disabled = n < p.min; S.draft = $("#tx").value; persist(); };
  $("#tx").oninput = upd; upd();
  $("#ck").onclick = () => { const pre = p.choiceKey ? (S.choice || {})[p.choiceKey] + ": " : ""; S.answer = pre + $("#tx").value.trim(); done(0); };
}
};

/* ---------- финал и отправка ---------- */
function finish(){
  const prof = load("profile") || {};
  const max = lessonMax(L), score = total();
  const details = L.stages.map((s,i)=>`${s.name}: ${S.scores[i]||0}/${stageMax(s)}`).join("; ") + (S.choice ? "; выбор: " + Object.values(S.choice).join(", ") : "") + (S.survey ? "; опрос: " + S.survey : "") + (S.t0 ? "; время на урок: " + Math.max(1, Math.round((Date.now() - S.t0) / 60000)) + " мин" : "");
  const code = hash([prof.name, prof.group, LID, score].join("|") + "|dost");
  const res = { name: prof.name, group: prof.group, lesson: SCHEDULE.find(s=>s.id===LID)?.subject + " · " + L.title,
    score, max, percent: Math.round(score / max * 100), answer: S.answer, details, code, sent: false };
  save("res_" + LID, res);
  results(true);
}
async function sendRes(res){
  const F = CONFIG.FORM; if (!F.action) return "none";
  const body = new URLSearchParams();
  for (const k in F.fields) if (F.fields[k]) body.append(F.fields[k], String(res[k] ?? ""));
  try { await fetch(F.action, {method:"POST", mode:"no-cors", body}); return "ok" } catch(e) { return "fail" }
}
async function results(fresh){
  const res = load("res_" + LID);
  const line = `${res.name}, гр. ${res.group}. ${res.lesson}. Баллы: ${res.score} из ${res.max}. Код: ${res.code}`;
  app.innerHTML = `<div class="top"><button class="link" id="back">← В кабинет</button></div>
  <div class="card folder"><span class="stamp">${ui("doneStamp")}</span>
  <h1 style="margin-top:12px">${esc(res.name)}, спасибо за работу</h1>
  <div class="row" style="align-items:flex-end;margin:10px 0 6px"><span class="big">${res.score}</span><span class="sans muted">из ${res.max} баллов</span></div>
  <table class="res">${L.stages.map((s,i)=>`<tr><td>${i+1}. ${s.name}</td><td>${stageMax(s) ? (S.scores[i] ?? "—") + " / " + stageMax(s) : "сдан"}</td></tr>`).join("")}</table>
  <div id="snd" class="note sans small">Отправляем результат…</div></div>`;
  bindBack(); scrollTo(0,0);
  let st = res.sent ? "ok" : await sendRes(res);
  if (st === "ok" && !res.sent){ res.sent = true; save("res_" + LID, res); }
  const backup = `<p style="margin:10px 0 6px">Скопируй строку ниже и отправь преподавателю в чат группы:</p><div class="codebox">${esc(line)}</div><p style="margin-top:8px"><button class="btn ghost" id="cp">Скопировать</button></p>`;
  $("#snd").innerHTML = st === "ok"
    ? `<b>Результат отправлен преподавателю.</b> Ничего пересылать не нужно.`
    : st === "fail"
      ? `<b>Не получилось отправить: проверь интернет.</b> <button class="link" id="rt">Попробовать ещё раз</button>${backup}`
      : `<b>Автоотправка пока не подключена.</b>${backup}`;
  if ($("#rt")) $("#rt").onclick = () => results();
  if ($("#cp")) $("#cp").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(line); $("#cp").textContent = "Скопировано"; };
}

function resetAll(){ try { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)) } catch(e) {} home(); }
if (location.search.includes("reset")) { try { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)) } catch(e) {} }
if (location.search.includes("testsend")) {
  sendRes({name:"Тест Проверка", group:"тест", lesson:"Проверка связи · " + CONFIG.TITLE, score:0, max:0, percent:0, answer:"—", details:"тестовая запись, можно удалить", code:"TEST"})
    .then(st => { app.innerHTML = `<div class="card"><h2>${st === "ok" ? "Тестовая запись отправлена" : "Не удалось отправить"}</h2><p>${st === "ok" ? "Открой таблицу результатов: там должна появиться строка «Тест Проверка». Если её нет через минуту, напиши мне." : "Проверь интернет и попробуй ещё раз."}</p></div>`; });
} else {
home();
}
syncClock().then(() => { if (document.querySelector(".lesson")) home() });
setInterval(() => { if (!LID && document.querySelector(".lesson")) home() }, 60000);
</script>
